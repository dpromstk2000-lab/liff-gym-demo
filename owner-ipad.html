<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DPRO パーソナルジム｜iPad受付</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#13213c;--navy2:#1d3259;--blue:#2563eb;--green:#087a55;--red:#c93444;--amber:#a56500;--purple:#7247b8;--text:#182235;--muted:#617086;--line:#d6dfeb;--bg:#eef2f7}
*{box-sizing:border-box}html{font-size:18px}body{margin:0;color:var(--text);background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.gate-card{width:min(590px,100%);border-radius:28px;padding:30px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.3)}
.brand{margin:0;color:var(--blue);font-size:.72rem;font-weight:950;letter-spacing:.15em}h1,h2,h3{line-height:1.35}.gate h1{margin:7px 0 0;font-size:1.8rem}.sub{margin:6px 0 0;color:var(--muted);font-size:.88rem}
.auth-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}
input,textarea,select{width:100%;min-height:56px;border:2px solid var(--line);border-radius:15px;padding:10px 13px;background:#fff}textarea{min-height:110px;resize:vertical}
.btn{min-height:54px;border:0;border-radius:15px;padding:10px 16px;font-weight:950}.btn-full{width:100%;margin-top:12px}.btn-blue{color:#fff;background:var(--blue)}.btn-green{color:#fff;background:var(--green)}.btn-red{color:#fff;background:var(--red)}.btn-purple{color:#fff;background:var(--purple)}.btn-dark{color:#fff;background:var(--navy)}.btn-soft{color:var(--navy);background:#e5ebf4}.btn:disabled{cursor:not-allowed;opacity:.58}
.gate-message{min-height:28px;margin:10px 0 0;color:var(--red);font-weight:900}
.header{position:sticky;top:0;z-index:30;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 5px 18px rgba(20,36,65,.22)}
.header-inner{max-width:1280px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.header h1{margin:2px 0 0;font-size:1.25rem}.header .brand{color:#c7d9ff}.header-actions{display:flex;gap:8px}.header-actions .btn{min-height:46px;padding:7px 12px}
.tabs{position:sticky;top:75px;z-index:25;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:1280px;margin:auto;padding:10px 18px;background:rgba(238,242,247,.96)}
.tab{min-height:56px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#526177;font-weight:950}.tab.active{color:#fff;background:var(--blue)}
main{max-width:1280px;margin:auto;padding:8px 18px 30px}.view{display:none}.view.active{display:block}.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 14px}.page-head h2{margin:0}.page-actions{display:flex;align-items:end;gap:8px;flex-wrap:wrap}.field{width:210px}label{display:block;margin-bottom:4px;color:#46546a;font-size:.76rem;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}.stat{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.stat span{display:block;color:var(--muted);font-size:.72rem;font-weight:900}.stat strong{font-size:1.75rem}.stat.blue{background:#f2f7ff}.stat.green{background:#f0faf6}.stat.red{background:#fff4f5}.stat.purple{background:#f8f3ff}
.panel{border:1px solid var(--line);border-radius:20px;padding:17px;background:#fff}.list{display:grid;gap:10px;margin-top:12px}.item,.customer-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fafbfd}.item-top{display:flex;justify-content:space-between;gap:10px}.item-name{font-weight:950}.item-meta{margin-top:3px;color:var(--muted);font-size:.82rem}
.badge{display:inline-flex;white-space:nowrap;border-radius:999px;padding:5px 10px;font-size:.7rem;font-weight:950;background:#e7edf5}.badge.green{color:#066443;background:#e1f7ee}.badge.red{color:#a32331;background:#ffeaed}.badge.amber{color:#805300;background:#fff0c5}.badge.blue{color:#174dac;background:#e5efff}.badge.purple{color:#60389d;background:#efe7fb}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.safety{margin-top:9px;border-radius:12px;padding:9px 11px;color:#8a2933;background:#fff0f2;font-size:.8rem;font-weight:850}.goal{margin-top:8px;border-radius:12px;padding:9px 11px;color:#174dac;background:#eaf2ff;font-size:.8rem}.ticket{display:inline-block;margin-top:7px;border-radius:11px;padding:4px 10px;color:#075f43;background:#e0f7ed;font-weight:950}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;align-items:end;margin-bottom:13px}.search-row{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px}.customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty,.loading{border:1px dashed #c6cfdb;border-radius:15px;padding:28px 10px;text-align:center;color:var(--muted);background:#fafbfd}
.notice{border-radius:13px;padding:10px 12px;margin:11px 0;color:#775200;background:#fff4d5;font-size:.83rem}.toast{position:fixed;right:18px;bottom:18px;z-index:120;max-width:500px;border-radius:14px;padding:13px 17px;color:#fff;background:var(--green);font-weight:950}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;background:rgba(6,16,34,.62)}.modal-card{width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:23px;padding:19px;background:#fff}.modal-head{display:flex;justify-content:space-between;gap:12px}.close{width:50px;height:50px;border:0;border-radius:14px;background:#e5ebf4;font-weight:950}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.span-2{grid-column:1/-1}.modal-actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:9px;margin-top:14px}.session-summary{border-radius:13px;padding:11px 13px;margin:12px 0;color:#60389d;background:#f1eafb;font-weight:900}.required::after{content:" 必須";color:var(--red);font-size:.7rem}
@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.customer-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.page-head{align-items:start}}
@media(max-width:620px){html{font-size:17px}.header-inner{padding:11px}.header-actions .cross-link{display:none}.tabs{top:72px;padding:8px}.tab{font-size:.82rem}main{padding:6px 9px 24px}.page-head{display:block}.page-actions{margin-top:9px}.field{width:100%}.actions,.modal-actions{grid-template-columns:1fr}.panel{padding:13px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}}

.tab.active{background:var(--blue)}
</style>
</head>
<body data-dpro-next-step="GYM-NEXT-6" data-dpro-role="reception">

<div class="gate" id="loginGate"><div class="gate-card"><p class="brand">DPRO PERSONAL GYM LINE</p><h1>iPad受付画面</h1><p class="sub">スタッフコードを入力してください。デモURLでは5678を自動設定します。</p><div class="auth-row"><input id="staffCode" type="password" inputmode="numeric" placeholder="スタッフコード"><button class="btn btn-soft" onclick="clearStaffCode()">削除</button></div><button class="btn btn-blue btn-full" id="loginButton" onclick="login()">受付画面を開く</button><p class="gate-message" id="loginMessage"></p></div></div>
<div class="hidden" id="app"><header class="header"><div class="header-inner"><div><p class="brand">RECEPTION</p><h1 id="facilityName">iPad受付</h1></div><div class="header-actions"><button class="btn btn-soft cross-link" onclick="openStaff()">スタッフ画面</button><button class="btn btn-soft" onclick="reloadCurrent()">再読込</button><button class="btn btn-red" onclick="logout()">コード削除</button></div></div></header>
<nav class="tabs"><button class="tab active" data-view="today" onclick="showView('today')">本日の受付 <span id="todayCount">-</span></button><button class="tab" data-view="schedule" onclick="showView('schedule')">予約一覧 <span id="scheduleCount">-</span></button><button class="tab" data-view="customers" onclick="showView('customers')">簡易会員検索</button></nav>
<main>
<section class="view active" id="view-today"><div class="page-head"><div><h2>本日の受付</h2><p class="sub" id="todayLabel">来店受付と開始までを操作します。</p></div><div class="page-actions"><div class="field"><label for="todayDate">表示日</label><input id="todayDate" type="date"></div><button class="btn btn-blue" onclick="loadToday()">表示</button></div></div><div class="stats"><div class="stat blue"><span>予約</span><strong id="statTotal">-</strong></div><div class="stat red"><span>承認待ち</span><strong id="statPending">-</strong></div><div class="stat green"><span>来店済み</span><strong id="statArrived">-</strong></div><div class="stat purple"><span>実施中</span><strong id="statSession">-</strong></div></div><div class="notice">設定・入会・プラン変更・回数券調整・キャンセル確定はPC管理で行います。</div><div class="panel"><h3>予約と進行状況</h3><div class="list" id="todayList"></div></div></section>
<section class="view" id="view-schedule"><div class="page-head"><div><h2>予約一覧</h2><p class="sub">7日間の予約を確認します。</p></div></div><div class="panel"><div class="filters"><div><label for="scheduleFrom">開始日</label><input id="scheduleFrom" type="date"></div><div><label for="scheduleStatus">状態</label><select id="scheduleStatus"><option value="">すべて</option><option value="requested">承認待ち</option><option value="confirmed">予約確定</option><option value="arrived">来店済み</option><option value="in_session">実施中</option><option value="completed">完了</option><option value="no_show">未来店</option></select></div><div></div><button class="btn btn-blue" onclick="loadSchedule()">表示</button></div><div class="list" id="scheduleList"></div></div></section>
<section class="view" id="view-customers"><div class="page-head"><div><h2>簡易会員検索</h2><p class="sub">氏名・電話番号・会員番号を2文字以上入力。電話番号自体は表示しません。</p></div></div><div class="panel"><div class="search-row"><input id="customerQuery" type="search" placeholder="氏名・電話番号・会員番号"><button class="btn btn-blue" onclick="loadCustomers()">検索</button></div><div class="customer-grid" id="customerList"></div></div></section>
</main></div>

<div class="toast hidden" id="toast"></div>
<script src="config.js"></script><script>
const CONFIG=window.DPRO_GYM_CONFIG,API=String(CONFIG.workerBaseUrl||'').replace(/\/$/,''),FACILITY=CONFIG.facilityCode;
const params=new URLSearchParams(location.search);const state={staffKey:'',view:'today',today:null,schedule:[],customers:[],facilityData:null};
document.addEventListener('DOMContentLoaded',()=>{const today=todayYmd();valSet('todayDate',today);valSet('scheduleFrom',today);if(params.get('demo')==='1'){valSet('staffCode',CONFIG.demoStaffCode||'5678');login()}});
async function login(){const key=val('staffCode');if(!key)return setText('loginMessage','スタッフコードを入力してください。');const b=document.getElementById('loginButton');b.disabled=true;b.textContent='確認中…';try{state.staffKey=key;const[health,todayData,facility]=await Promise.all([api('/api/staff/health'),api(`/api/staff/today?facility_code=${FACILITY}&date=${todayYmd()}`),publicApi(`/api/public/facility?facility_code=${FACILITY}`)]);if(health.role!=='staff')throw new Error('スタッフ認証を確認できません。');state.facilityData=facility;state.today=todayData;setText('facilityName',`${todayData.facility.facility_name}｜iPad受付`);document.getElementById('loginGate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderToday()}catch(e){state.staffKey='';setText('loginMessage',e.message)}finally{b.disabled=false;b.textContent='受付画面を開く'}}
function clearStaffCode(){valSet('staffCode','');document.getElementById('staffCode').focus()}function logout(){state.staffKey='';clearStaffCode();document.getElementById('app').classList.add('hidden');document.getElementById('loginGate').classList.remove('hidden')}
function openStaff(){window.open(`${CONFIG.staffPageUrl||'staff.html'}${params.get('demo')==='1'?'?demo=1':''}`,'_blank')}
function showView(view){state.view=view;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===`view-${view}`));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.view===view));if(view==='schedule')loadSchedule();if(view==='customers')document.getElementById('customerQuery').focus()}
function reloadCurrent(){if(state.view==='today')loadToday();else if(state.view==='schedule')loadSchedule();else loadCustomers()}
async function loadToday(){const date=val('todayDate')||todayYmd(),list=document.getElementById('todayList');list.innerHTML=loading();try{state.today=await api(`/api/staff/today?facility_code=${FACILITY}&date=${date}`);renderToday()}catch(e){list.innerHTML=empty(e.message);toast(e.message,true)}}
function renderToday(){const rows=state.today?.reservations||[];setText('todayLabel',`${formatDate(state.today?.date||todayYmd())}の予約`);setText('statTotal',rows.length);setText('statPending',rows.filter(r=>r.status==='requested').length);setText('statArrived',rows.filter(r=>r.status==='arrived').length);setText('statSession',rows.filter(r=>r.status==='in_session').length);setText('todayCount',rows.length);document.getElementById('todayList').innerHTML=rows.length?rows.map(reservationCard).join(''):empty('予約はありません。')}
async function loadSchedule(){const from=val('scheduleFrom')||todayYmd(),status=val('scheduleStatus'),q=new URLSearchParams({facility_code:FACILITY,date_from:from,date_to:addDaysYmd(from,6)});if(status)q.set('status',status);const list=document.getElementById('scheduleList');list.innerHTML=loading();try{const data=await api(`/api/staff/reservations?${q}`);state.schedule=data.reservations||[];setText('scheduleCount',state.schedule.length);list.innerHTML=state.schedule.length?state.schedule.map(reservationCard).join(''):empty('予約はありません。')}catch(e){list.innerHTML=empty(e.message);toast(e.message,true)}}
function reservationCard(r){const c=r.customer||{},s=statusInfo(r.status),warn=[c.precautions,c.concern].filter(Boolean).join(' / ');return `<article class="item"><div class="item-top"><div><div class="item-name">${esc(formatDateTime(r.start_at))}　${esc(c.full_name||'会員未取得')}</div><div class="item-meta">${esc(serviceName(r.service_code))} / ${esc(trainerName(r.trainer_code))}<br>${esc(c.customer_no||'')}　残り${Number(c.ticket_remaining||0)}回</div></div><span class="badge ${s.color}">${esc(s.label)}</span></div>${warn?`<div class="safety">注意：${esc(warn)}</div>`:''}<div class="actions">${statusButtons(r)}</div></article>`}
function statusButtons(r){const id=attr(r.id);if(r.status==='requested')return `<button class="btn btn-green" onclick="changeStatus('${id}','confirmed')">予約確定</button>`;if(r.status==='confirmed')return `<button class="btn btn-blue" onclick="changeStatus('${id}','arrived')">来店</button><button class="btn btn-red" onclick="changeStatus('${id}','no_show')">未来店</button>`;if(r.status==='arrived')return `<button class="btn btn-purple" onclick="changeStatus('${id}','in_session')">開始</button>`;if(r.status==='in_session')return '<button class="btn btn-dark" onclick="openStaff()">スタッフ画面で記録・完了</button>';if(['cancel_requested','change_requested'].includes(r.status))return '<button class="btn btn-soft" disabled>PC管理で対応</button>';return '<button class="btn btn-soft" disabled>更新済み</button>'}
async function changeStatus(id,status){try{await api('/api/staff/reservations/status',{method:'POST',body:{facility_code:FACILITY,reservation_id:id,status,created_by:'ipad_reception'}});toast('予約状態を更新しました。');state.view==='today'?await loadToday():await loadSchedule()}catch(e){toast(e.message,true)}}
async function loadCustomers(){const q=val('customerQuery'),list=document.getElementById('customerList');if(q.length<2){list.innerHTML=empty('2文字以上入力してください。');return}list.innerHTML=loading();try{const data=await api(`/api/staff/customers?facility_code=${FACILITY}&q=${encodeURIComponent(q)}`);state.customers=data.customers||[];list.innerHTML=state.customers.length?state.customers.map(customerCard).join(''):empty('会員が見つかりません。')}catch(e){list.innerHTML=empty(e.message);toast(e.message,true)}}
function customerCard(c){const warn=[c.precautions,c.concern].filter(Boolean).join(' / ');return `<article class="customer-card"><div class="item-top"><div><div class="item-name">${esc(c.full_name||'氏名未登録')}</div><div class="item-meta">${esc(c.customer_no||'')}<br>${esc(c.plan_name||'プラン未設定')} / 最終来店 ${esc(c.last_visit_on||'-')}</div></div><span class="badge ${c.status==='member'?'green':'amber'}">${esc(customerStatus(c.status))}</span></div><span class="ticket">残り${Number(c.ticket_remaining||0)}回 / ${esc(c.ticket_expires_on||'期限未設定')}</span>${c.goal?`<div class="goal">目標：${esc(c.goal)}</div>`:''}${warn?`<div class="safety">注意：${esc(warn)}</div>`:''}</article>`}

async function api(path,opt={}){return request(path,{...opt,headers:{'Content-Type':'application/json','X-Staff-Key':state.staffKey,...(opt.headers||{})}})}
async function publicApi(path,opt={}){return request(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}})}
async function request(path,opt){const response=await fetch(`${API}${path}`,{method:opt.method||'GET',headers:opt.headers,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'}),text=await response.text();let data;try{data=text?JSON.parse(text):{}}catch(_){data={message:text}}if(!response.ok||data.ok===false)throw new Error(data.message||`HTTP ${response.status}`);return data}
function statusInfo(status){return({requested:{label:'承認待ち',color:'amber'},confirmed:{label:'予約確定',color:'green'},arrived:{label:'来店済み',color:'blue'},in_session:{label:'実施中',color:'purple'},completed:{label:'完了',color:'green'},change_requested:{label:'変更希望',color:'amber'},cancel_requested:{label:'キャンセル希望',color:'red'},cancelled:{label:'キャンセル',color:'red'},no_show:{label:'未来店',color:'red'}})[status]||{label:status||'-',color:''}}
function serviceName(code){return state.facilityData?.services?.find(item=>item.service_code===code)?.service_name||code||'-'}
function trainerName(code){return code?(state.facilityData?.trainers?.find(item=>item.trainer_code===code)?.trainer_name||code):'おまかせ'}
function customerStatus(status){return({trial:'体験',member:'入会済',continuation:'継続相談',inactive:'休眠',withdrawn:'退会'})[status]||status||'-'}
function toast(message,isError=false){const e=document.getElementById('toast');e.textContent=message;e.style.background=isError?'var(--red)':'var(--green)';e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),3500)}
function empty(message){return `<div class="empty">${esc(message)}</div>`}function loading(){return '<div class="loading">読み込んでいます…</div>'}
function val(id){return document.getElementById(id).value.trim()}function valSet(id,value){document.getElementById(id).value=value??''}function setText(id,value){document.getElementById(id).textContent=value??'-'}
function todayYmd(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function addDaysYmd(ymd,days){const d=new Date(`${ymd}T12:00:00+09:00`);d.setUTCDate(d.getUTCDate()+days);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function formatDate(value){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short'}).format(new Date(`${value}T00:00:00+09:00`))}
function formatDateTime(value){if(!value)return'-';return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}function attr(value){return esc(value)}
</script>
</body></html>
