name: STEP GYM-NEXT-5-VERIFY - Trial Admission and Plans UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-5-VERIFY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-5-verify-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-5-VERIFY
  CURRENT_STEP_REQUIRED: GYM-NEXT-5-PREPARED
  NEXT_STEP: GYM-NEXT-6
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-5-VERIFY.yml
  STALE_WORKFLOW_FILE: .github/workflows/GYM-NEXT-5.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-5-verify-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-5-WORKER-20260725
  PATCH_SCRIPT_B64: ""

jobs:
  verify-and-complete:
    name: Verify NEXT-5 and add trial admission UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP_IN_LEDGER="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP_IN_LEDGER}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP_IN_LEDGER}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Prepared result is not PREPARED."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-VERIFY version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム LINE before GYM-NEXT-5-VERIFY"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current UI baselines and Worker URL
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 94619ddc2fd2dd43b6d3cb99ba2349eef9d1f705
          check_blob dashboard.html 2f69ca0e207c244d9bb671bcd2c6d36b747a14de
          check_blob owner-ipad.html 04b119e1f32a5156f94a64079c6d751253d7dfff

          grep -Fq             "workerBaseUrl: 'https://dpro-gym-line-api.dpromstk2000.workers.dev'"             config.js

      - name: Verify deployed Worker Supabase and read APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-5-verify

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-5-verify/health.json             "${WORKER_BASE}/api/health?verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-5-verify/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("version") == "GYM-NEXT-5-WORKER-20260725", data
          assert data.get("database", {}).get("ok") is True, data

          next4 = data.get("next4", {})
          assert next4.get("ok") is True, data
          assert next4.get("session_records") is True, data
          assert next4.get("duplicate_completion_count") == 0, data

          next5 = data.get("next5", {})
          assert next5.get("ok") is True, data
          assert next5.get("plan_master") is True, data
          assert next5.get("trial_pipeline") is True, data
          assert next5.get("atomic_admission") is True, data
          assert next5.get("membership_grant_guard") is True, data
          assert next5.get("duplicate_membership_grants") == 0, data
          assert next5.get("duplicate_active_memberships") == 0, data
          assert next5.get("active_plan_count", 0) >= 1, data
          PY

          for endpoint in             "next-5-system-check?facility_code=dpro_gym_demo"             "plans?facility_code=dpro_gym_demo&include_inactive=1"             "trial-pipeline?facility_code=dpro_gym_demo"
          do
            name="$(printf '%s' "${endpoint}" | tr '/?&=' '____')"
            curl --fail --location --silent --show-error               --retry 3 --retry-delay 2 --max-time 30               -H "X-Admin-Key: 1234"               --output "/tmp/gym-next-5-verify/${name}.json"               "${WORKER_BASE}/api/admin/${endpoint}&verify=${GITHUB_RUN_ID}"
          done

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-5-verify")
          check = json.loads(
              (root / "next-5-system-check_facility_code_dpro_gym_demo.json")
              .read_text(encoding="utf-8")
          )
          assert check.get("ok") is True, check
          result = check.get("result", {})
          assert result.get("duplicate_membership_grants") == 0, check
          assert result.get("duplicate_active_memberships") == 0, check

          plans = json.loads(
              (root / "plans_facility_code_dpro_gym_demo_include_inactive_1.json")
              .read_text(encoding="utf-8")
          )
          assert plans.get("ok") is True, plans
          assert isinstance(plans.get("plans"), list), plans
          assert len(plans.get("plans", [])) >= 1, plans

          pipeline = json.loads(
              (root / "trial-pipeline_facility_code_dpro_gym_demo.json")
              .read_text(encoding="utf-8")
          )
          assert pipeline.get("ok") is True, pipeline
          assert isinstance(pipeline.get("pipeline"), list), pipeline
          assert isinstance(pipeline.get("plans"), list), pipeline
          PY

      - name: Apply NEXT-5 trial admission and plan UI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${PATCH_SCRIPT_B64}" |
            base64 --decode > /tmp/gym-next-5-verify/apply_patch.py
          python3 -m py_compile /tmp/gym-next-5-verify/apply_patch.py
          python3 /tmp/gym-next-5-verify/apply_patch.py

      - name: Validate HTML JavaScript IDs and NEXT-5 contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-5-verify/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          text = Path("dashboard.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(text)
          duplicates = sorted({
              value for value in parser.ids
              if parser.ids.count(value) > 1
          })
          if duplicates:
              raise SystemExit(f"Duplicate IDs: {duplicates}")

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.I | re.S,
          )
          inline = [script for script in scripts if script.strip()]
          for index, script in enumerate(inline, 1):
              Path(
                  f"/tmp/gym-next-5-verify/scripts/dashboard-{index}.js"
              ).write_text(script, encoding="utf-8")

          Path("/tmp/gym-next-5-verify/html-report.json").write_text(
              json.dumps({
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "inline_script_count": len(inline),
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          find /tmp/gym-next-5-verify/scripts -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do
              node --check "${script}"
            done

          grep -Fq 'data-dpro-next-step="GYM-NEXT-5"' dashboard.html
          grep -Fq 'id="view-trials"' dashboard.html
          grep -Fq 'id="trialDecisionModal"' dashboard.html
          grep -Fq 'id="admissionModal"' dashboard.html
          grep -Fq 'id="planModal"' dashboard.html
          grep -Fq 'customerMembershipHistory' dashboard.html

          for marker in             '/api/admin/plans'             '/api/admin/plans/upsert'             '/api/admin/trial-pipeline'             '/api/admin/trial-decisions'             '/api/admin/customers/admit'             '/memberships?facility_code='
          do
            grep -Fq "${marker}" dashboard.html
          done

          for marker in             '/api/admin/dashboard'             '/api/admin/customers'             '/api/admin/customers/tickets'             '/api/admin/reservations/status'             '/api/admin/sessions/complete'             '/api/admin/session-records/upsert'             '/api/admin/inquiries'             '/api/admin/settings'             '/api/admin/demo-prepare'
          do
            grep -Fq "${marker}" dashboard.html
          done

          grep -Fq '自動LINE送信は行いません' dashboard.html
          grep -Fq '二重付与されません' dashboard.html

      - name: Confirm only dashboard changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only |
              sed '/^$/d' |
              sort
          )

          [[ "$(printf '%s\n' "${CHANGED[@]}")" == "dashboard.html" ]] || {
            echo "::error::Unexpected application files changed."
            printf 'Changed:\n%s\n' "${CHANGED[*]}"
            exit 1
          }

          git diff --quiet -- config.js || {
            echo "::error::config.js must remain unchanged."
            exit 1
          }
          git diff --quiet -- owner-ipad.html || {
            echo "::error::owner-ipad.html must remain unchanged in NEXT-5."
            exit 1
          }
          git diff --check

      - name: Commit NEXT-5 dashboard UI
        shell: bash
        run: |
          set -euo pipefail
          git add dashboard.html
          git commit -m "Complete GYM-NEXT-5 trial admission UI"
          APPLICATION_COMMIT_SHA="$(git rev-parse HEAD)"
          DASHBOARD_BLOB="$(git hash-object dashboard.html)"
          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "DASHBOARD_BLOB=${DASHBOARD_BLOB}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify published UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-5-verify/public
          file=/tmp/gym-next-5-verify/public/dashboard.html

          for attempt in $(seq 1 24); do
            curl --fail --location --silent --show-error               --max-time 30               --output "${file}"               "${PUBLIC_BASE}/dashboard.html?verify=${GITHUB_RUN_ID}-${attempt}" || true

            if [[ -s "${file}" ]] &&
               grep -Fq 'data-dpro-next-step="GYM-NEXT-5"' "${file}" &&
               grep -Fq '/api/admin/customers/admit' "${file}" &&
               grep -Fq 'id="view-trials"' "${file}"; then
              break
            fi

            if [[ "${attempt}" -eq 24 ]]; then
              echo "::error::Published dashboard did not reach NEXT-5."
              exit 1
            fi
            sleep 10
          done

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-5-verify/public/health.json             "${WORKER_BASE}/api/health?public_verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-5-verify/public/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True
          assert data.get("version") == "GYM-NEXT-5-WORKER-20260725"
          assert data.get("next5", {}).get("ok") is True
          PY

      - name: Record GYM-NEXT-5 completion and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-5-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-5 COMPLETE

          - 結果: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - Supabase NEXT-5: OK
          - 体験者・検討中一覧: OK
          - 体験結果記録: OK
          - プランマスター: OK
          - 体験から入会への一体処理: OK
          - 回数券二重付与防止: OK
          - 入会・プラン履歴: OK
          - 自動LINE送信: なし
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-5-COMPLETE"
          workflow_revision: "R1"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          dashboard_blob: "${DASHBOARD_BLOB}"
          owner_ipad_blob: "04b119e1f32a5156f94a64079c6d751253d7dfff"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_deployed: true
          supabase_executed: true
          runtime_files_changed: true
          worker_changed: true
          supabase_changed: true
          api_changed: true
          changed_files:
            - "dashboard.html"
          completed_features:
            plan_master: true
            trial_pipeline: true
            trial_decisions: true
            atomic_admission: true
            membership_grant_guard: true
            membership_history: true
            automatic_line_send: false
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            worker_health: "OK"
            supabase_next5: "OK"
            duplicate_membership_grants: 0
            duplicate_active_memberships: 0
            config_worker_url: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            existing_api_references: "OK"
            trial_admission_ui: "OK"
            public_dashboard: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          if [[ -f "${STALE_WORKFLOW_FILE}" ]]; then
            git rm "${STALE_WORKFLOW_FILE}"
          fi
          git commit -m "Record GYM-NEXT-5 completion"
          git push origin HEAD:main

      - name: Upload NEXT-5 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-5-completion
          path: |
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-5-COMPLETE.md
            /tmp/gym-next-5-verify/health.json
            /tmp/gym-next-5-verify/html-report.json
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-5 COMPLETE"
            echo ""
            echo "- Worker: \`${EXPECTED_WORKER_VERSION}\`"
            echo "- Supabase NEXT-5: \`OK\`"
            echo "- Trial pipeline UI: \`OK\`"
            echo "- Atomic admission UI: \`OK\`"
            echo "- Duplicate membership grants: \`0\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
