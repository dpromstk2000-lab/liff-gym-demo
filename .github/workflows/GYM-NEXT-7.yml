name: STEP GYM-NEXT-7 - Prepare LINE History and Repeat Booking

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-7.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-7-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-7
  CURRENT_STEP_REQUIRED: GYM-NEXT-6-COMPLETE
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-7.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  SOURCE_WORKER: dpro-next/gym/deploy/GYM-NEXT-6/worker.js
  PACKAGE_DIR: dpro-next/gym/deploy/GYM-NEXT-7
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-7-20260725
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  CURRENT_WORKER_VERSION: GYM-NEXT-6-WORKER-20260725
  EXPECTED_WORKER_VERSION: GYM-NEXT-7-WORKER-20260725

jobs:
  prepare:
    name: Prepare member history Worker without runtime changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-6 completion and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::Previous STEP result is not OK."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-7 version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム LINE before GYM-NEXT-7"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current source and Worker baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 90d477523912be87378d71a9e247365771848440
          check_blob member.html 1f5c980c63fbc817d6e99334bfe1290b0229dae4
          check_blob dashboard.html 538199c142e44d4ee03953d29359c1b341c4ca28
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob "${SOURCE_WORKER}" 0245b34820fe594195364a66fde80c4bed72d9ca

          mkdir -p /tmp/gym-next-7
          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-7/health.json             "${WORKER_BASE}/api/health?prepare=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-7/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("version") == "GYM-NEXT-6-WORKER-20260725", data
          assert data.get("next4", {}).get("ok") is True, data
          assert data.get("next5", {}).get("ok") is True, data
          features = data.get("features", {})
          assert features.get("staff_api") is True, data
          assert features.get("role_separation") is True, data
          PY

      - name: Generate NEXT-7 Worker package from compact patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}" /tmp/gym-next-7
          cp "${SOURCE_WORKER}" "${PACKAGE_DIR}/worker.js"

          cat > /tmp/gym-next-7/worker.patch <<'PATCH'
          --- a/worker.js
          +++ b/worker.js
          @@ -1,8 +1,8 @@
           /* ============================================================
          -  STEP GYM-NEXT-6
          +  STEP GYM-NEXT-7
             DPRO パーソナルジム LINE API
             Worker name: dpro-gym-line-api
          -  Worker version: GYM-NEXT-6-WORKER-20260725
          +  Worker version: GYM-NEXT-7-WORKER-20260725
 
             Cloudflare Secrets:
               SUPABASE_URL
          @@ -17,7 +17,7 @@
               ALLOW_DEMO_ADMIN_FALLBACK   false（通常は設定不要）
           ============================================================ */
 
          -const VERSION = 'GYM-NEXT-6-WORKER-20260725';
          +const VERSION = 'GYM-NEXT-7-WORKER-20260725';
           const SERVICE = 'DPRO Personal Gym LINE API';
           const DEFAULT_FACILITY_CODE = 'dpro_gym_demo';
           const DEMO_CONFIRM_TEXT = 'DEMOパーソナルジムだけ実行';
          @@ -402,6 +402,9 @@
                 staff_api: Boolean(env.STAFF_TOKEN),
                 role_separation: true,
                 member_page: true,
          +      member_session_history: Boolean(next4?.session_records),
          +      repeat_booking_prefill: true,
          +      member_private_note_guard: true,
                 system_check: true,
                 demo_prepare: true
               }
          @@ -572,7 +575,10 @@
               demo: url.searchParams.get('demo') === '1'
             });
 
          -  const [reservations, inquiries] = await Promise.all([
          +  // STEP GYM-NEXT-7:
          +  // 会員画面へは共有可能なセッション項目だけを取得する。
          +  // condition_note と trainer_note は select 自体に含めない。
          +  const [reservations, inquiries, sessionRecords] = await Promise.all([
               selectRows(env, TABLES.reservations, {
                 select: '*',
                 facility_code: `eq.${facilityCode}`,
          @@ -586,6 +592,14 @@
                 customer_id: `eq.${customer.id}`,
                 order: 'created_at.desc',
                 limit: '20'
          +    }),
          +    selectRows(env, TABLES.sessionRecords, {
          +      select: 'id,reservation_id,trainer_code,performed_at,record_status,training_summary,next_focus,member_visible_comment,updated_at',
          +      facility_code: `eq.${facilityCode}`,
          +      customer_id: `eq.${customer.id}`,
          +      record_status: 'eq.completed',
          +      order: 'performed_at.desc',
          +      limit: '10'
               })
             ]);
 
          @@ -596,6 +610,24 @@
             const history = reservations
               .filter(row => !upcoming.some(item => item.id === row.id))
               .slice(0, 10);
          +  const reservationMap = Object.fromEntries(
          +    reservations.map(row => [row.id, row])
          +  );
          +  const safeSessionHistory = sessionRecords
          +    .filter(row =>
          +      row.training_summary ||
          +      row.next_focus ||
          +      row.member_visible_comment
          +    )
          +    .map(row => memberSessionRecord(
          +      row,
          +      reservationMap[row.reservation_id]
          +    ));
          +  const repeatSource = reservations.find(
          +    row => row.status === 'completed'
          +  ) || history.find(
          +    row => !['cancelled', 'no_show'].includes(row.status)
          +  );
 
             return {
               ok: true,
          @@ -604,6 +636,18 @@
               next_reservation: upcoming[0] ? memberReservation(upcoming[0]) : null,
               upcoming_reservations: upcoming.map(memberReservation),
               reservation_history: history.map(memberReservation),
          +    session_history: safeSessionHistory,
          +    repeat_booking: repeatSource ? {
          +      source_reservation_id: repeatSource.id,
          +      service_code: repeatSource.service_code,
          +      trainer_code: repeatSource.trainer_code || null,
          +      previous_start_at: repeatSource.start_at
          +    } : null,
          +    privacy: {
          +      trainer_note_exposed: false,
          +      condition_note_exposed: false,
          +      member_visible_fields_only: true
          +    },
               inquiries,
               version: VERSION
             };
          @@ -2594,6 +2638,21 @@
             };
           }
 
          +function memberSessionRecord(row, reservation) {
          +  if (!row) return null;
          +  return {
          +    id: row.id,
          +    reservation_id: row.reservation_id,
          +    service_code: reservation?.service_code || null,
          +    trainer_code: row.trainer_code || reservation?.trainer_code || null,
          +    performed_at: row.performed_at,
          +    training_summary: row.training_summary,
          +    next_focus: row.next_focus,
          +    member_visible_comment: row.member_visible_comment,
          +    updated_at: row.updated_at
          +  };
          +}
          +
           function memberReservation(row) {
             if (!row) return null;
             return {
          PATCH

          (
            cd "${PACKAGE_DIR}"
            patch -p1 --forward --batch               -i /tmp/gym-next-7/worker.patch
          )

          cat > "${PACKAGE_DIR}/manifest.yml" <<'YAML'
          package_version: "GYM-NEXT-7-PREP-20260725"
          system_name: "DPRO パーソナルジム LINE"
          phase: "PREPARED"
          worker_name: "dpro-gym-line-api"
          worker_expected_version: "GYM-NEXT-7-WORKER-20260725"
          supabase_changed: false
          runtime_changed: false
          member_features:
            session_history: true
            repeat_booking_prefill: true
            member_visible_comment: true
            next_focus: true
          privacy:
            trainer_note_exposed: false
            condition_note_exposed: false
            member_visible_fields_only: true
          planned_ui:
            member.html:
              - "前回と同じ内容で予約"
              - "セッション振り返り"
              - "次回の重点"
              - "会員向けコメント"
            index.html:
              - "service_code URL事前選択"
              - "trainer_code URL事前選択"
              - "repeat=1案内"
          safety:
            - "30分予約枠を維持"
            - "過去日時不可を維持"
            - "予約重複防止を維持"
            - "LINE本人確認を維持"
            - "内部メモを会員へ返さない"
          next_action: "Deploy Worker, then run GYM-NEXT-7-VERIFY"
          YAML

          cp "${PACKAGE_DIR}/worker.js" /tmp/gym-next-7/worker.mjs
          node --check /tmp/gym-next-7/worker.mjs
          ruby -e "require 'yaml'; YAML.load_file('${PACKAGE_DIR}/manifest.yml', aliases: true)"

          grep -Fq "const VERSION = '${EXPECTED_WORKER_VERSION}';"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "member_session_history: Boolean(next4?.session_records)"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "repeat_booking_prefill: true"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "trainer_note_exposed: false"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "condition_note_exposed: false"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "session_history: safeSessionHistory"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "repeat_booking: repeatSource ?"             "${PACKAGE_DIR}/worker.js"

          MEMBER_BLOCK="$(
            sed -n               '/function memberSessionRecord/,/function memberReservation/p'               "${PACKAGE_DIR}/worker.js"
          )"
          if printf '%s' "${MEMBER_BLOCK}" | grep -Fq "trainer_note"; then
            echo "::error::Member serializer exposes trainer_note."
            exit 1
          fi
          if printf '%s' "${MEMBER_BLOCK}" | grep -Fq "condition_note"; then
            echo "::error::Member serializer exposes condition_note."
            exit 1
          fi

          for existing in             "/api/public/reservations"             "/api/member/home"             "/api/member/reservations/cancel-request"             "/api/member/reservations/change-request"             "/api/member/inquiries"             "/api/staff/today"             "/api/staff/sessions/complete"             "/api/admin/trial-pipeline"             "/api/admin/customers/admit"             "/api/admin/sessions/complete"
          do
            grep -Fq "${existing}" "${PACKAGE_DIR}/worker.js"
          done

          (
            cd "${PACKAGE_DIR}"
            zip -q GYM-NEXT-7-WORKER.zip worker.js
          )
          sha256sum "${PACKAGE_DIR}/worker.js"             > "${PACKAGE_DIR}/SHA256SUMS.txt"

      - name: Confirm preparation changed no runtime files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_FILES < <(
            git status --porcelain=v1 --untracked-files=all |
              sed -E 's/^.. //' |
              sed 's/^"//;s/"$//' |
              grep -v -F -x "${WORKFLOW_FILE}" |
              sed '/^$/d' || true
          )

          [[ "${#CHANGED_FILES[@]}" -gt 0 ]] || {
            echo "::error::NEXT-7 package was not generated."
            exit 1
          }

          for changed_file in "${CHANGED_FILES[@]}"; do
            case "${changed_file}" in
              "${PACKAGE_DIR}/"*)
                ;;
              *)
                echo "::error::Unexpected file changed: ${changed_file}"
                exit 1
                ;;
            esac
          done

          for file in             "${PACKAGE_DIR}/worker.js"             "${PACKAGE_DIR}/manifest.yml"             "${PACKAGE_DIR}/GYM-NEXT-7-WORKER.zip"             "${PACKAGE_DIR}/SHA256SUMS.txt"
          do
            [[ -s "${file}" ]] || {
              echo "::error::Required file missing or empty: ${file}"
              exit 1
            }
          done

          for file in             config.js index.html member.html dashboard.html             owner-ipad.html staff.html system-check.html
          do
            git diff --quiet -- "${file}" || {
              echo "::error::Runtime file changed during preparation: ${file}"
              exit 1
            }
          done

      - name: Commit NEXT-7 deployment package
        shell: bash
        run: |
          set -euo pipefail
          git add "${PACKAGE_DIR}"
          git diff --cached --check
          git commit -m "Prepare GYM-NEXT-7 member history Worker"
          PACKAGE_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "PACKAGE_COMMIT_SHA=${PACKAGE_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Record prepared state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          PREPARED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          WORKER_SHA256="$(
            sha256sum "${PACKAGE_DIR}/worker.js" |
              awk '{print $1}'
          )"

          cat > "${STEP_DIR}/GYM-NEXT-7-PREPARED.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-7 PREPARED

          - 結果: PREPARED
          - Supabase変更: なし
          - 正式Worker: dpro-gym-line-api
          - 更新後バージョン: ${EXPECTED_WORKER_VERSION}
          - 会員向けセッション履歴: 準備済み
          - 前回と同じ予約情報: 準備済み
          - スタッフ内部メモの会員公開: なし
          - 体調内部記録の会員公開: なし
          - 公開画面: まだ変更なし
          - Worker SHA-256: ${WORKER_SHA256}
          - バックアップタグ: ${BACKUP_TAG}
          - パッケージコミット: ${PACKAGE_COMMIT_SHA}
          - 準備日時: ${PREPARED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-7-PREPARED"
          workflow_revision: "R1"
          next_step: "GYM-NEXT-7-VERIFY"
          next_action: "DEPLOY_WORKER_THEN_VERIFY"
          result: "PREPARED"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          package_commit_sha: "${PACKAGE_COMMIT_SHA}"
          prepared_at: "${PREPARED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          current_worker_version: "${CURRENT_WORKER_VERSION}"
          expected_worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_sha256: "${WORKER_SHA256}"
          supabase_changed: false
          runtime_files_changed: false
          worker_deployed: false
          planned_runtime_files:
            - "index.html"
            - "member.html"
          planned_features:
            member_session_history: true
            repeat_booking_prefill: true
            member_visible_comment: true
            next_focus: true
            trainer_note_exposed: false
            condition_note_exposed: false
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            current_worker_health: "OK"
            next4_preserved: "OK"
            next5_preserved: "OK"
            staff_role_preserved: "OK"
            source_worker_blob: "OK"
            worker_diff_patch: "OK"
            worker_javascript_syntax: "OK"
            member_privacy_guard: "OK"
            existing_api_contract: "OK"
            runtime_unchanged: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-7 prepared state"
          git push origin HEAD:main

      - name: Upload NEXT-7 deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-7-worker-package
          path: |
            dpro-next/gym/deploy/GYM-NEXT-7/
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-7-PREPARED.md
          if-no-files-found: error
          retention-days: 30

      - name: STEP summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-7 PREPARED"
            echo ""
            echo "- Supabase change: false"
            echo "- Runtime UI changed: false"
            echo "- Member-safe history Worker: ready"
            echo "- Repeat booking prefill: ready"
            echo "- Private trainer/condition notes exposed: false"
            echo "- Next: deploy Worker, then GYM-NEXT-7-VERIFY"
          } >> "$GITHUB_STEP_SUMMARY"
