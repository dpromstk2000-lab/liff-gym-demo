      - name: Verify rendered PDF QR codes and exact URLs
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/gym-next-10/verify_qr.py <<'PY'
          from pathlib import Path
          import json

          import cv2
          from PIL import Image, ImageStat

          delivery = Path("deliverables/gym-next-10")
          preview = delivery / (
              "DPRO_GYM_NEXT_operation_experience_sheet_20260726.png"
          )
          layout = json.loads(
              (delivery / "operation-sheet-layout.json")
              .read_text(encoding="utf-8")
          )

          page_image = cv2.imread(str(preview))
          if page_image is None:
              raise SystemExit("Rendered operation sheet PNG cannot be read.")

          page_width_pt = float(layout["page_width_pt"])
          page_height_pt = float(layout["page_height_pt"])
          height_px, width_px = page_image.shape[:2]
          scale_x = width_px / page_width_pt
          scale_y = height_px / page_height_pt

          detector = cv2.QRCodeDetector()

          def decode_candidates(image):
              if image is None or image.size == 0:
                  return "", "empty"

              candidates = [("original", image)]
              gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)
              candidates.append(("gray", gray))

              _, otsu = cv2.threshold(
                  gray,
                  0,
                  255,
                  cv2.THRESH_BINARY + cv2.THRESH_OTSU,
              )
              candidates.append(("otsu", otsu))

              adaptive = cv2.adaptiveThreshold(
                  gray,
                  255,
                  cv2.ADAPTIVE_THRESH_GAUSSIAN_C,
                  cv2.THRESH_BINARY,
                  31,
                  7,
              )
              candidates.append(("adaptive", adaptive))

              base_candidates = list(candidates)
              for label, candidate in base_candidates:
                  for factor in (2, 3):
                      enlarged = cv2.resize(
                          candidate,
                          None,
                          fx=factor,
                          fy=factor,
                          interpolation=cv2.INTER_NEAREST,
                      )
                      candidates.append(
                          (f"{label}-nearest-{factor}x", enlarged)
                      )

              for label, candidate in candidates:
                  bordered = cv2.copyMakeBorder(
                      candidate,
                      48,
                      48,
                      48,
                      48,
                      cv2.BORDER_CONSTANT,
                      value=255,
                  )
                  decoded, points, _ = detector.detectAndDecode(
                      bordered
                  )
                  if decoded:
                      return decoded, label

              return "", "not-decoded"

          results = []

          for item in layout["qr_items"]:
              source_path = delivery / "qr" / f'{item["key"]}.png'
              source_image = cv2.imread(str(source_path))
              source_decoded, source_method = decode_candidates(
                  source_image
              )
              if source_decoded != item["url"]:
                  raise SystemExit(
                      json.dumps(
                          {
                              "key": item["key"],
                              "stage": "source_qr",
                              "expected_url": item["url"],
                              "decoded_url": source_decoded,
                              "method": source_method,
                          },
                          ensure_ascii=False,
                          indent=2,
                      )
                  )

              x_pt = float(item["x_pt"])
              y_pt = float(item["y_pt"])
              size_pt = float(item["size_pt"])

              padding_px = 36
              left = max(
                  0,
                  int(x_pt * scale_x) - padding_px,
              )
              right = min(
                  width_px,
                  int((x_pt + size_pt) * scale_x) + padding_px,
              )
              top = max(
                  0,
                  int(
                      (
                          page_height_pt - y_pt - size_pt
                      ) * scale_y
                  ) - padding_px,
              )
              bottom = min(
                  height_px,
                  int((page_height_pt - y_pt) * scale_y)
                  + padding_px,
              )

              crop = page_image[top:bottom, left:right]
              decoded, method = decode_candidates(crop)

              result = {
                  "key": item["key"],
                  "expected_url": item["url"],
                  "decoded_url": decoded,
                  "ok": decoded == item["url"],
                  "decode_method": method,
                  "source_qr_ok": source_decoded == item["url"],
                  "source_decode_method": source_method,
                  "crop": [left, top, right, bottom],
              }
              results.append(result)

              cv2.imwrite(
                  str(
                      delivery
                      / "qr"
                      / f'{item["key"]}-rendered-crop.png'
                  ),
                  crop,
              )

          expected_count = 6
          assert len(results) == expected_count, results
          failed = [item for item in results if not item["ok"]]
          if failed:
              raise SystemExit(
                  json.dumps(
                      failed,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

          preview_image = Image.open(preview).convert("L")
          standard_deviation = ImageStat.Stat(
              preview_image
          ).stddev[0]
          assert standard_deviation >= 20, standard_deviation

          report = {
              "ok": True,
              "workflow_revision": "R5",
              "qr_physical_size_mm": 23,
              "pdf_render_dpi": 300,
              "expected_count": expected_count,
              "source_qr_decoded_count": sum(
                  1 for item in results
                  if item["source_qr_ok"]
              ),
              "decoded_count": sum(
                  1 for item in results if item["ok"]
              ),
              "exact_url_match_count": sum(
                  1 for item in results if item["ok"]
              ),
              "rendered_preview_stddev": standard_deviation,
              "results": results,
          }

          (delivery / "operation-sheet-qr-check.json").write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

          python3 /tmp/gym-next-10/verify_qr.py

          PAGE_COUNT="$(
            pdfinfo "${DELIVERY_DIR}/${PDF_NAME}" |
              awk -F: '/^Pages:/ {gsub(/[[:space:]]/,"",$2); print $2}'
          )"
          [[ "${PAGE_COUNT}" == "1" ]] || {
            echo "::error::Operation sheet must be one page."
            exit 1
          }

          grep -Fq '"source_qr_decoded_count": 6' \
            "${DELIVERY_DIR}/operation-sheet-qr-check.json"
          grep -Fq '"decoded_count": 6' \
            "${DELIVERY_DIR}/operation-sheet-qr-check.json"
          grep -Fq '"exact_url_match_count": 6' \
            "${DELIVERY_DIR}/operation-sheet-qr-check.json"

          PDF_BYTES="$(wc -c < "${DELIVERY_DIR}/${PDF_NAME}" | tr -d ' ')"
          PNG_BYTES="$(wc -c < "${DELIVERY_DIR}/${PNG_NAME}" | tr -d ' ')"
          [[ "${PDF_BYTES}" -ge 150000 ]] || {
            echo "::error::Generated PDF is unexpectedly small: ${PDF_BYTES}"
            exit 1
          }
          [[ "${PNG_BYTES}" -ge 150000 ]] || {
            echo "::error::Generated preview PNG is unexpectedly small: ${PNG_BYTES}"
            exit 1
          }

      - name: Create final delivery manifest and validate files
        shell: bash
        run: |
          set -euo pipefail

          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          PDF_SHA="$(
            sha256sum "${DELIVERY_DIR}/${PDF_NAME}" |
              awk '{print $1}'
          )"
          PNG_SHA="$(
            sha256sum "${DELIVERY_DIR}/${PNG_NAME}" |
              awk '{print $1}'
          )"

          cat > "${DELIVERY_DIR}/manifest.yml" <<EOF
          schema_version: 1
          system_name: "DPRO パーソナルジム LINE"
          logical_step: "GYM-NEXT-10"
          stage: "OPERATION_SHEET_COMPLETE_PRODUCT_SITE_PENDING"
          generated_at_jst: "${COMPLETED_AT}"
          facility_code: "dpro_gym_demo"
          worker_name: "dpro-gym-line-api"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          public_base: "${PAGE_BASE}"
          product_site_repository: "${PRODUCT_SITE_REPO}"
          product_page_url: "${PRODUCT_PAGE_URL}"
          files:
            pdf: "${PDF_NAME}"
            png: "${PNG_NAME}"
            html: "operation-sheet.html"
            qr_check: "operation-sheet-qr-check.json"
            capture_report: "screens/capture-report.json"
            product_site_content: "product-site-content.json"
            text_normalization: "text-normalization-report.json"
          validation:
            actual_screen_capture_count: 6
            qr_count: 6
            source_qr_decoded_count: 6
            qr_decoded_count: 6
            qr_exact_url_match_count: 6
            pdf_page_count: 1
            pdf_a4_portrait: true
            qr_physical_size_mm: 23
            pdf_render_dpi: 300
            worker_health: true
            integrated_system_check: true
            automatic_line_broadcast: false
          sha256:
            pdf: "${PDF_SHA}"
            png: "${PNG_SHA}"
          next_step: "GYM-NEXT-10B-PRODUCT-SITE"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${DELIVERY_DIR}/manifest.yml', aliases: true)"

          required_files=(
            "${DELIVERY_DIR}/${PDF_NAME}"
            "${DELIVERY_DIR}/${PNG_NAME}"
            "${DELIVERY_DIR}/operation-sheet.html"
            "${DELIVERY_DIR}/operation-sheet-layout.json"
            "${DELIVERY_DIR}/operation-sheet-qr-check.json"
            "${DELIVERY_DIR}/product-site-content.json"
            "${DELIVERY_DIR}/text-normalization-report.json"
            "${DELIVERY_DIR}/manifest.yml"
            "${SCREEN_DIR}/capture-report.json"
          )

          for file in "${required_files[@]}"; do
            [[ -s "${file}" ]] || {
              echo "::error::Required NEXT-10 file is missing: ${file}"
              exit 1
            }
          done

          for key in booking member owner ipad staff system-check; do
            [[ -s "${SCREEN_DIR}/${key}.png" ]] || {
              echo "::error::Screenshot missing: ${key}"
              exit 1
            }
            [[ -s "${QR_DIR}/${key}.png" ]] || {
              echo "::error::QR missing: ${key}"
              exit 1
            }
          done

          python3 <<'PY'
          from pathlib import Path
          import json

          delivery = Path("deliverables/gym-next-10")

          text_extensions = {
              ".html",
              ".json",
              ".yml",
              ".yaml",
              ".csv",
              ".txt",
              ".md",
          }
          normalized_files = []

          for path in sorted(delivery.rglob("*")):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue

              original = path.read_text(encoding="utf-8")
              unix = original.replace("\r\n", "\n").replace(
                  "\r",
                  "\n",
              )
              lines = unix.split("\n")

              while lines and not lines[-1].strip():
                  lines.pop()

              normalized = "\n".join(
                  line.rstrip(" \t")
                  for line in lines
              ) + "\n"

              path.write_text(
                  normalized,
                  encoding="utf-8",
                  newline="\n",
              )
              normalized_files.append(str(path))

          assert normalized_files, "No generated text files normalized."

          for file_name in normalized_files:
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")

              assert text.endswith("\n"), file_name
              assert not text.endswith("\n\n"), file_name

              for line_number, line in enumerate(
                  text.splitlines(),
                  start=1,
              ):
                  assert line == line.rstrip(" \t"), {
                      "file": file_name,
                      "line": line_number,
                      "content": repr(line),
                  }

          (delivery / "text-normalization-report.json").write_text(
              json.dumps(
                  {
                      "ok": True,
                      "workflow_revision": "R5",
                      "normalized_file_count": len(
                          normalized_files
                      ),
                      "normalized_files": normalized_files,
                      "trailing_whitespace_count": 0,
                      "extra_blank_eof_count": 0,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          report = json.loads(
              (delivery / "operation-sheet-qr-check.json")
              .read_text(encoding="utf-8")
          )
          assert report.get("ok") is True, report
          assert report.get("expected_count") == 6, report
          assert report.get("decoded_count") == 6, report
          assert report.get("exact_url_match_count") == 6, report

          product = json.loads(
              (delivery / "product-site-content.json")
              .read_text(encoding="utf-8")
          )
          assert product.get("stage") == (
              "operation_sheet_published_product_site_pending"
          ), product
          assert product.get("catalog", {}).get("code") == "PG", product
          assert product.get("operation_sheet", {}).get("qr_count") == 6, product

          normalization = json.loads(
              (delivery / "text-normalization-report.json")
              .read_text(encoding="utf-8")
          )
          assert normalization.get("ok") is True, normalization
          assert normalization.get(
              "trailing_whitespace_count"
          ) == 0, normalization
          assert normalization.get(
              "extra_blank_eof_count"
          ) == 0, normalization

          for path in sorted(delivery.rglob("*")):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue

              text = path.read_text(encoding="utf-8")
              assert text.endswith("\n"), path
              assert not text.endswith("\n\n"), path

              for line_number, line in enumerate(
                  text.splitlines(),
                  start=1,
              ):
                  assert line == line.rstrip(" \t"), {
                      "file": str(path),
                      "line": line_number,
                      "content": repr(line),
                  }
          PY

          for file in \
            config.js index.html member.html dashboard.html \
            owner-ipad.html staff.html system-check.html
          do
            git diff --quiet -- "${file}" || {
              echo "::error::Runtime file changed during NEXT-10 asset generation: ${file}"
              exit 1
            }
          done

          git diff --check

      - name: Commit final delivery assets
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"trailing_whitespace_count": 0'             "${DELIVERY_DIR}/text-normalization-report.json"
          grep -Fq '"extra_blank_eof_count": 0'             "${DELIVERY_DIR}/text-normalization-report.json"

          git add "${DELIVERY_DIR}"

          WHITESPACE_ERRORS="$(
            git diff --cached --check || true
          )"
          if [[ -n "${WHITESPACE_ERRORS}" ]]; then
            echo "::error::Generated delivery files contain whitespace errors."
            printf '%s\n' "${WHITESPACE_ERRORS}"
            exit 1
          fi
          git commit -m "Build GYM-NEXT-10 operation experience sheet"

          DELIVERY_COMMIT_SHA="$(git rev-parse HEAD)"
          PDF_BLOB="$(git hash-object "${DELIVERY_DIR}/${PDF_NAME}")"
          PNG_BLOB="$(git hash-object "${DELIVERY_DIR}/${PNG_NAME}")"

          echo "DELIVERY_COMMIT_SHA=${DELIVERY_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "PDF_BLOB=${PDF_BLOB}" >> "$GITHUB_ENV"
          echo "PNG_BLOB=${PNG_BLOB}" >> "$GITHUB_ENV"

          git push origin HEAD:main

      - name: Wait for Pages and verify published delivery files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-10/public

          PDF_URL="${PAGE_BASE}/${DELIVERY_DIR}/${PDF_NAME}"
          PNG_URL="${PAGE_BASE}/${DELIVERY_DIR}/${PNG_NAME}"
          HTML_URL="${PAGE_BASE}/${DELIVERY_DIR}/operation-sheet.html"
          QR_REPORT_URL="${PAGE_BASE}/${DELIVERY_DIR}/operation-sheet-qr-check.json"

          for attempt in $(seq 1 24); do
            curl --fail --location --silent --show-error \
              --max-time 30 \
              -o /tmp/gym-next-10/public/qr-check.json \
              "${QR_REPORT_URL}?publish=${GITHUB_RUN_ID}-${attempt}" || true

            if [[ -s /tmp/gym-next-10/public/qr-check.json ]] &&
               grep -Fq '"exact_url_match_count": 6' \
                 /tmp/gym-next-10/public/qr-check.json; then
              break
            fi

            if [[ "${attempt}" == "24" ]]; then
              echo "::error::NEXT-10 delivery files were not published."
              exit 1
            fi
            sleep 10
          done

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10/public/sheet.pdf \
            "${PDF_URL}?publish=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10/public/sheet.png \
            "${PNG_URL}?publish=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10/public/sheet.html \
            "${HTML_URL}?publish=${GITHUB_RUN_ID}"

          [[ "$(pdfinfo /tmp/gym-next-10/public/sheet.pdf |
                awk -F: '/^Pages:/ {gsub(/[[:space:]]/,"",$2); print $2}')" == "1" ]] || {
            echo "::error::Published PDF is not one page."
            exit 1
          }

          grep -Fq 'DPRO パーソナルジム LINE NEXT' \
            /tmp/gym-next-10/public/sheet.html

          LOCAL_PDF_SHA="$(
            sha256sum "${DELIVERY_DIR}/${PDF_NAME}" |
              awk '{print $1}'
          )"
          PUBLIC_PDF_SHA="$(
            sha256sum /tmp/gym-next-10/public/sheet.pdf |
              awk '{print $1}'
          )"
          [[ "${LOCAL_PDF_SHA}" == "${PUBLIC_PDF_SHA}" ]] || {
            echo "::error::Published PDF does not match committed PDF."
            exit 1
          }

          echo "PDF_URL=${PDF_URL}" >> "$GITHUB_ENV"
          echo "PNG_URL=${PNG_URL}" >> "$GITHUB_ENV"
          echo "HTML_URL=${HTML_URL}" >> "$GITHUB_ENV"
          echo "QR_REPORT_URL=${QR_REPORT_URL}" >> "$GITHUB_ENV"

      - name: Record NEXT-10 operation sheet completion and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-10A-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-10A COMPLETE

          - 結果: OK
          - Workflow修正版: R5
          - 復旧内容: 会員QR URL短縮・QR 23mm・300dpi・複数方式読取
          - 実画面スクリーンショット: 6枚
          - A4縦1ページ操作体験シート: OK
          - QRコード: 6個
          - PDF描画後QR読取: 6/6
          - QR URL完全一致: 6/6
          - 公開PDFとCommit済みPDFのSHA一致: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - 最終system-check: OK
          - Worker変更: なし
          - Supabase変更: なし
          - 本体画面変更: なし
          - 製品サイト反映: 次工程
          - PDF: ${PDF_URL}
          - PNG: ${PNG_URL}
          - 操作体験HTML: ${HTML_URL}
          - QR検査結果: ${QR_REPORT_URL}
          - バックアップタグ: ${BACKUP_TAG}
          - 納品素材コミット: ${DELIVERY_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-10A-COMPLETE"
          logical_step: "GYM-NEXT-10"
          workflow_revision: "R5"
          worker_revision: "R2"
          next_step: "GYM-NEXT-10B-PRODUCT-SITE"
          next_repository: "${PRODUCT_SITE_REPO}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          delivery_commit_sha: "${DELIVERY_COMMIT_SHA}"
          pdf_blob: "${PDF_BLOB}"
          png_blob: "${PNG_BLOB}"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_deployed: true
          supabase_changed: false
          runtime_files_changed: false
          product_site_changed: false
          operation_sheet:
            pdf_url: "${PDF_URL}"
            png_url: "${PNG_URL}"
            html_url: "${HTML_URL}"
            qr_report_url: "${QR_REPORT_URL}"
            page_count: 1
            orientation: "A4 portrait"
            qr_physical_size_mm: 23
            pdf_render_dpi: 300
            actual_screen_count: 6
            qr_count: 6
            source_qr_decoded_count: 6
            qr_decoded_count: 6
            qr_exact_url_match_count: 6
            published_pdf_exact_match: true
          product_site:
            repository: "${PRODUCT_SITE_REPO}"
            current_page: "${PRODUCT_PAGE_URL}"
            update_pending: true
          recovery:
            failed_workflow_revisions:
              - "R1"
              - "R2"
              - "R3"
              - "R4"
            failed_run_urls:
              - "https://github.com/dpromstk2000-lab/liff-gym-demo/actions/runs/30163371447"
              - "https://github.com/dpromstk2000-lab/liff-gym-demo/actions/runs/30163983359"
              - "https://github.com/dpromstk2000-lab/liff-gym-demo/actions/runs/30164399121"
              - "https://github.com/dpromstk2000-lab/liff-gym-demo/actions/runs/30164790974"
            failure_reason_r1: "会員マイページ用QRがPDF描画後に読取不能"
            failure_reason_r2: "QR検査Pythonの終了記号PYが二重"
            failure_reason_r3: "開始数の正規表現がファイル名中の文字nを誤除外"
            failure_reason_r4: "生成HTMLの行末空白をgit diff --cached --checkが検出"
            operation_html_dedented: true
            generated_text_normalized: true
            trailing_whitespace_guard: true
            extra_blank_eof_guard: true
            duplicate_python_terminator_removed: true
            heredoc_counter_fixed: true
            heredoc_line_matcher: true
            heredoc_balance_check: true
            member_demo_url_shortened: true
            qr_physical_size_mm: 23
            pdf_render_dpi: 300
            multi_pass_qr_decode: true
            runtime_rewrite_required: false
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            worker_health: "OK"
            integrated_system_check: "OK"
            next4_preserved: "OK"
            next5_preserved: "OK"
            next8_preserved: "OK"
            next9_preserved: "OK"
            role_separation_preserved: "OK"
            member_history_preserved: "OK"
            actual_screen_capture: "OK"
            operation_html_dedented: "OK"
            generated_text_normalized: "OK"
            trailing_whitespace: "OK"
            extra_blank_eof: "OK"
            screenshot_not_blank: "OK"
            pdf_generation: "OK"
            pdf_page_count: "OK"
            qr_source_generation: "OK"
            qr_source_decode: "OK"
            member_demo_url_shortened: "OK"
            qr_23mm: "OK"
            pdf_render_300dpi: "OK"
            qr_multi_pass_decode: "OK"
            qr_rendered_pdf_decode: "OK"
            qr_url_exact_match: "OK"
            public_delivery_files: "OK"
            public_pdf_sha_match: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"

          git add "${LEDGER_FILE}" "${STEP_DIR}/GYM-NEXT-10A-COMPLETE.md"
          if [[ -f "${STALE_WORKFLOW_FILE_R1}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R1}"
          fi
          if [[ -f "${STALE_WORKFLOW_FILE_R2}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R2}"
          fi
          if [[ -f "${STALE_WORKFLOW_FILE_R3}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R3}"
          fi
          if [[ -f "${STALE_WORKFLOW_FILE_R4}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R4}"
          fi
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-10A delivery completion"
          git push origin HEAD:main

      - name: Upload NEXT-10 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-10-R5-operation-sheet-and-screens
          path: |
            deliverables/gym-next-10/
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-10A-COMPLETE.md
            /tmp/gym-next-10/health.json
            /tmp/gym-next-10/system-check.json
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-10A COMPLETE - R5"
            echo ""
            echo "- Workflow revision: R5"
            echo "- Delivery text normalized: true"
            echo "- Trailing whitespace: 0"
            echo "- Extra blank EOF: 0"
            echo "- Duplicate Python terminator removed: true"
            echo "- Heredoc counter fixed: true"
            echo "- Heredoc line matcher: true"
            echo "- Heredoc balance check: 6/6 and 1/1"
            echo "- Member QR URL shortened: true"
            echo "- QR size: 23mm"
            echo "- PDF render: 300dpi"
            echo "- Actual screen captures: 6"
            echo "- A4 portrait PDF: 1 page"
            echo "- QR decode from rendered PDF: 6 / 6"
            echo "- Exact QR URL match: 6 / 6"
            echo "- Runtime UI changed: false"
            echo "- Worker changed: false"
            echo "- Supabase changed: false"
            echo "- Next repository: ${PRODUCT_SITE_REPO}"
            echo "- Next STEP: GYM-NEXT-10B-PRODUCT-SITE"
          } >> "$GITHUB_STEP_SUMMARY"
