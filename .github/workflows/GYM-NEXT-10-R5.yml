name: STEP GYM-NEXT-10-R5 - Normalize Delivery Text and Commit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-10-R5.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-10-r5-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-10
  CURRENT_STEP_REQUIRED: GYM-NEXT-9-COMPLETE
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-10-R5.yml
  STALE_WORKFLOW_FILE_R1: .github/workflows/GYM-NEXT-10.yml
  STALE_WORKFLOW_FILE_R2: .github/workflows/GYM-NEXT-10-R2.yml
  STALE_WORKFLOW_FILE_R3: .github/workflows/GYM-NEXT-10-R3.yml
  STALE_WORKFLOW_FILE_R4: .github/workflows/GYM-NEXT-10-R4.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  DELIVERY_DIR: deliverables/gym-next-10
  SCREEN_DIR: deliverables/gym-next-10/screens
  QR_DIR: deliverables/gym-next-10/qr
  BACKUP_TAG: backup-gym-before-next-10-r5-20260726
  PAGE_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  PRODUCT_SITE_REPO: dpromstk2000-lab/dpro-line-systems-site
  PRODUCT_PAGE_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/gym.html
  EXPECTED_WORKER_VERSION: GYM-NEXT-9-WORKER-R2-20260725
  PDF_NAME: DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf
  PNG_NAME: DPRO_GYM_NEXT_operation_experience_sheet_20260726.png

jobs:
  build-and-publish:
    name: Capture real screens create QR sheet and prepare product site
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-9 completion and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"
          test -f "${STALE_WORKFLOW_FILE_R1}"
          test -f "${STALE_WORKFLOW_FILE_R2}"
          test -f "${STALE_WORKFLOW_FILE_R3}"
          test -f "${STALE_WORKFLOW_FILE_R4}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          WORKER_VERSION="$(
            sed -n 's/^worker_version:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::NEXT-9 result is not OK."
            exit 1
          }
          [[ "${WORKER_VERSION}" == "${EXPECTED_WORKER_VERSION}" ]] || {
            echo "::error::Completed Worker version does not match."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                grep -v -F -x "${STALE_WORKFLOW_FILE_R1}" |
                grep -v -F -x "${STALE_WORKFLOW_FILE_R2}" |
                grep -v -F -x "${STALE_WORKFLOW_FILE_R3}" |
                grep -v -F -x "${STALE_WORKFLOW_FILE_R4}" |
                sed '/^$/d' || true
            )"
            WORKFLOW_ONLY="$(
              printf '%s\n' "${CHANGED}" |
                grep -E '^\.github/workflows/GYM-NEXT-10(-R2|-R3|-R4|-R5)?\.yml$' |
                sed '/^$/d' || true
            )"
            if [[ -n "${WORKFLOW_ONLY}" && -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Validate workflow heredoc delimiters
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/GYM-NEXT-10-R5.yml")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          python_start_pattern = re.compile(
              r"^\s*(?:python3|cat\s+>.+?)\s+<<'PY'\s*$"
          )
          javascript_start_pattern = re.compile(
              r"^\s*cat\s+>.+?\s+<<'JS'\s*$"
          )

          python_start_lines = [
              line for line in lines
              if python_start_pattern.match(line)
          ]
          python_end_lines = [
              line for line in lines
              if line.strip() == "PY"
          ]
          javascript_start_lines = [
              line for line in lines
              if javascript_start_pattern.match(line)
          ]
          javascript_end_lines = [
              line for line in lines
              if line.strip() == "JS"
          ]

          assert len(python_start_lines) == 6, {
              "python_starts": len(python_start_lines),
              "lines": python_start_lines,
          }
          assert len(python_end_lines) == 6, {
              "python_ends": len(python_end_lines),
          }
          assert len(javascript_start_lines) == 1, {
              "javascript_starts": len(javascript_start_lines),
              "lines": javascript_start_lines,
          }
          assert len(javascript_end_lines) == 1, {
              "javascript_ends": len(javascript_end_lines),
          }
          assert len(python_start_lines) == len(python_end_lines)
          assert len(javascript_start_lines) == len(
              javascript_end_lines
          )
          assert "\n          PY\n          PY\n" not in text
          assert "\n          JS\n          JS\n" not in text

          print({
              "python_starts": len(python_start_lines),
              "python_ends": len(python_end_lines),
              "javascript_starts": len(javascript_start_lines),
              "javascript_ends": len(javascript_end_lines),
          })
          PY

      - name: Protect pre-NEXT-10 version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "DPRO パーソナルジム before GYM-NEXT-10"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify final source baselines and live services
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from NEXT-9 completion baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 6ea48136d70e328366a8584ebecaa55562372d20
          check_blob member.html ed7e59d0a1101adfd328e24e1eb09a8f62a41aca
          check_blob dashboard.html cbb1f028442946c0ba2fd69eedc90de844eae68c
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob system-check.html 8d37b43caec090e42593d8ebc088bd9aff06131a
          check_blob dpro-next/gym/deploy/GYM-NEXT-9/worker.js d2c6c6cebfe54592ac1d4f410dd77e20c467a405

          mkdir -p /tmp/gym-next-10

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10/health.json \
            "${WORKER_BASE}/api/health?next10=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Admin-Key: 1234" \
            -o /tmp/gym-next-10/system-check.json \
            "${WORKER_BASE}/api/admin/next-9-system-check?facility_code=dpro_gym_demo&next10=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-10")
          health = json.loads(
              (root / "health.json").read_text(encoding="utf-8")
          )
          assert health.get("ok") is True, health
          assert health.get("version") == "GYM-NEXT-9-WORKER-R2-20260725", health
          assert health.get("next4", {}).get("ok") is True, health
          assert health.get("next5", {}).get("ok") is True, health
          assert health.get("next8", {}).get("ok") is True, health
          assert health.get("next9", {}).get("ok") is True, health

          features = health.get("features", {})
          required = [
              "session_records",
              "atomic_session_completion",
              "plan_master",
              "trial_pipeline",
              "atomic_admission",
              "staff_api",
              "role_separation",
              "member_session_history",
              "repeat_booking_prefill",
              "follow_up_board",
              "follow_up_snooze_guard",
              "follow_up_recent_done_guard",
              "security_headers",
              "query_string_auth_disabled",
              "request_body_limit",
              "integrated_system_check",
          ]
          missing = [key for key in required if features.get(key) is not True]
          assert not missing, missing
          assert features.get("automatic_line_broadcast") is False, health

          system_check = json.loads(
              (root / "system-check.json").read_text(encoding="utf-8")
          )
          assert system_check.get("ok") is True, system_check
          assert system_check.get("elapsed_ms", 999999) <= 5000, system_check
          assert all(
              item.get("ok") is True
              for item in system_check.get("checks", [])
          ), system_check
          PY

          verify_source() {
            local page="$1"
            local marker="$2"
            local output="/tmp/gym-next-10/source-${page}"

            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 30 \
              -o "${output}" \
              "${PAGE_BASE}/${page}?source_check=${GITHUB_RUN_ID}"

            grep -Fq "${marker}" "${output}" || {
              echo "::error::Public ${page} is missing ${marker}"
              exit 1
            }
          }

          verify_source index.html '/api/public/reservations'
          verify_source member.html 'id="sessionHistoryList"'
          verify_source dashboard.html 'id="view-followups"'
          verify_source owner-ipad.html '/api/staff/today'
          verify_source staff.html '/api/staff/today'
          verify_source system-check.html 'GYM-NEXT-9-WORKER-R2-20260725'

      - name: Install screenshot PDF and QR verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            fonts-ipafont-gothic \
            poppler-utils

          python -m pip install --disable-pip-version-check \
            reportlab==4.4.3 \
            qrcode[pil]==8.2 \
            pillow==11.3.0 \
            opencv-python-headless==4.12.0.88

          mkdir -p /tmp/gym-next-10/playwright
          cd /tmp/gym-next-10/playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture six real public screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${SCREEN_DIR}" "${QR_DIR}" /tmp/gym-next-10

          cat > /tmp/gym-next-10/playwright/capture.js <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          const base = process.env.PAGE_BASE.replace(/\/$/, "");
          const output = process.env.SCREEN_DIR;
          fs.mkdirSync(output, { recursive: true });

          const captures = [
            {
              key: "booking",
              title: "無料体験・予約",
              url: `${base}/index.html?demo=1`,
              viewport: { width: 390, height: 844 },
              role: "public"
            },
            {
              key: "member",
              title: "会員マイページ",
              url: `${base}/member.html?demo=1`,
              viewport: { width: 390, height: 844 },
              role: "member"
            },
            {
              key: "owner",
              title: "PC管理・継続フォロー",
              url: `${base}/dashboard.html?demo=1`,
              viewport: { width: 1440, height: 900 },
              role: "admin"
            },
            {
              key: "ipad",
              title: "iPad受付",
              url: `${base}/owner-ipad.html?demo=1`,
              viewport: { width: 1024, height: 768 },
              role: "staff"
            },
            {
              key: "staff",
              title: "スタッフ画面",
              url: `${base}/staff.html?demo=1`,
              viewport: { width: 430, height: 900 },
              role: "staff"
            },
            {
              key: "system-check",
              title: "営業前system-check",
              url: `${base}/system-check.html?demo=1`,
              viewport: { width: 1200, height: 900 },
              role: "system"
            }
          ];

          async function fillFirst(page, selectors, value) {
            for (const selector of selectors) {
              const locator = page.locator(selector).first();
              if (await locator.count()) {
                try {
                  if (await locator.isVisible()) {
                    await locator.fill(value);
                    return selector;
                  }
                } catch (_) {}
              }
            }
            return null;
          }

          async function clickFirst(page, selectors) {
            for (const selector of selectors) {
              const locator = page.locator(selector).first();
              if (await locator.count()) {
                try {
                  if (await locator.isVisible()) {
                    await locator.click({ timeout: 5000 });
                    return selector;
                  }
                } catch (_) {}
              }
            }
            return null;
          }

          async function unlock(page, role) {
            if (role === "admin") {
              await fillFirst(
                page,
                ["#adminCode", "#gateCode", "input[type=password]"],
                "1234"
              );
              await clickFirst(page, [
                ".gate .btn-blue",
                ".gate button[type=submit]",
                "button:has-text('管理画面を開く')",
                "button:has-text('ログイン')",
                "button:has-text('確認')"
              ]);
              await page.waitForTimeout(2800);
              await page.evaluate(() => {
                if (typeof window.showView === "function") {
                  window.showView("followups");
                }
              }).catch(() => {});
              await page.waitForTimeout(1600);
            }

            if (role === "staff") {
              await fillFirst(
                page,
                ["#staffCode", "#gateCode", "input[type=password]"],
                "5678"
              );
              await clickFirst(page, [
                ".gate .btn-blue",
                ".gate button[type=submit]",
                "button:has-text('受付画面を開く')",
                "button:has-text('スタッフ画面を開く')",
                "button:has-text('ログイン')",
                "button:has-text('確認')"
              ]);
              await page.waitForTimeout(2500);
            }

            if (role === "system") {
              await fillFirst(
                page,
                ["#adminCode"],
                "1234"
              );
              await fillFirst(
                page,
                ["#staffCode"],
                "5678"
              );
              const clicked = await clickFirst(page, ["#runAll"]);
              if (clicked) {
                await page.waitForFunction(
                  () => {
                    const button = document.getElementById("runAll");
                    return button && !button.disabled &&
                      button.textContent.includes("一括チェック");
                  },
                  { timeout: 30000 }
                ).catch(() => {});
              }
              await page.waitForTimeout(1000);
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ["--disable-dev-shm-usage"]
            });
            const report = [];

            for (const item of captures) {
              const context = await browser.newContext({
                viewport: item.viewport,
                deviceScaleFactor: 1,
                locale: "ja-JP",
                timezoneId: "Asia/Tokyo",
                reducedMotion: "reduce"
              });
              const page = await context.newPage();

              const consoleErrors = [];
              page.on("console", message => {
                if (message.type() === "error") {
                  consoleErrors.push(message.text());
                }
              });

              let navigationError = "";
              try {
                await page.goto(item.url, {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });
                await page.waitForTimeout(2600);
              } catch (error) {
                navigationError = String(error.message || error);
              }

              await unlock(page, item.role);

              await page.addStyleTag({
                content: `
                  *,*::before,*::after{
                    animation:none!important;
                    transition:none!important;
                    caret-color:transparent!important;
                  }
                `
              }).catch(() => {});

              const gateVisible = await page.locator(".gate").first()
                .isVisible().catch(() => false);

              const screenshotPath = path.join(
                output,
                `${item.key}.png`
              );
              await page.screenshot({
                path: screenshotPath,
                fullPage: false
              });

              const stat = fs.statSync(screenshotPath);
              report.push({
                key: item.key,
                title: item.title,
                url: item.url,
                viewport: item.viewport,
                screenshot: screenshotPath,
                bytes: stat.size,
                page_title: await page.title(),
                gate_visible: gateVisible,
                navigation_error: navigationError,
                console_error_count: consoleErrors.length,
                console_errors: consoleErrors.slice(0, 8)
              });

              await context.close();
            }

            await browser.close();

            fs.writeFileSync(
              path.join(output, "capture-report.json"),
              JSON.stringify(report, null, 2)
            );

            const invalid = report.filter(item =>
              item.bytes < 12000 ||
              item.navigation_error ||
              (
                ["admin", "staff"].includes(
                  captures.find(c => c.key === item.key).role
                ) &&
                item.gate_visible
              )
            );

            if (invalid.length) {
              console.error(JSON.stringify(invalid, null, 2));
              process.exit(1);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

          (
            cd /tmp/gym-next-10/playwright
            PAGE_BASE="${PAGE_BASE}" \
            SCREEN_DIR="${GITHUB_WORKSPACE}/${SCREEN_DIR}" \
              node capture.js
          )

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json

          screen_dir = Path("deliverables/gym-next-10/screens")
          report = json.loads(
              (screen_dir / "capture-report.json")
              .read_text(encoding="utf-8")
          )

          required = {
              "booking",
              "member",
              "owner",
              "ipad",
              "staff",
              "system-check",
          }
          assert {item["key"] for item in report} == required, report

          for item in report:
              path = screen_dir / f'{item["key"]}.png'
              assert path.exists(), path
              assert path.stat().st_size >= 12000, item
              image = Image.open(path).convert("RGB")
              assert image.width >= 380, item
              assert image.height >= 700, item
              grayscale = image.convert("L")
              standard_deviation = ImageStat.Stat(grayscale).stddev[0]
              assert standard_deviation >= 18, {
                  "key": item["key"],
                  "stddev": standard_deviation,
              }
          PY

      - name: Generate A4 operation experience sheet and QR codes
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/gym-next-10/build_sheet.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import textwrap

          import qrcode
          from PIL import Image, ImageOps
          from reportlab.lib.colors import (
              HexColor,
              white,
          )
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfgen import canvas

          delivery = Path("deliverables/gym-next-10")
          screens = delivery / "screens"
          qr_dir = delivery / "qr"
          qr_dir.mkdir(parents=True, exist_ok=True)

          pdf_path = delivery / "DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf"
          layout_path = delivery / "operation-sheet-layout.json"
          manifest_path = delivery / "product-site-content.json"
          html_path = delivery / "operation-sheet.html"

          base = "https://dpromstk2000-lab.github.io/liff-gym-demo"
          items = [
              {
                  "key": "booking",
                  "number": "01",
                  "title": "無料体験・予約",
                  "description": "メニュー・担当・空き時間を選び、30分単位で予約。",
                  "url": f"{base}/index.html?demo=1",
              },
              {
                  "key": "member",
                  "number": "02",
                  "title": "会員マイページ",
                  "description": "残回数・履歴・振り返り・前回と同じ予約を確認。",
                  "url": f"{base}/member.html?demo=1",
              },
              {
                  "key": "owner",
                  "number": "03",
                  "title": "PC管理・継続フォロー",
                  "description": "今日やること、体験入会、会員、期限別フォロー。",
                  "url": f"{base}/dashboard.html?demo=1",
              },
              {
                  "key": "ipad",
                  "number": "04",
                  "title": "iPad受付",
