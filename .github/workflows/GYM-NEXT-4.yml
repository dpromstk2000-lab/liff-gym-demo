name: STEP GYM-NEXT-4 - Prepare Session Records Deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-4.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-4-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-4
  CURRENT_STEP_REQUIRED: GYM-NEXT-3-COMPLETE
  NEXT_ACTION: RUN_SQL_AND_DEPLOY_WORKER
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-4.yml
  STALE_WORKFLOW_FILE: .github/workflows/GYM-NEXT-3.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  PACKAGE_DIR: dpro-next/gym/deploy/GYM-NEXT-4
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-4-20260725
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo

jobs:
  prepare:
    name: Prepare SQL and NEXT gateway without runtime changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-3 completion and safe upload
        shell: bash
        run: |
          set -euo pipefail

          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          if [[ "${CURRENT_STEP}" != "${CURRENT_STEP_REQUIRED}" ]]; then
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          fi
          if [[ "${NEXT_STEP}" != "${STEP_NAME}" ]]; then
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP}"
            exit 1
          fi
          if [[ "${RESULT}" != "OK" ]]; then
            echo "::error::Previous result is not OK."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only GYM-NEXT-4.yml"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-4 version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            if [[ "${EXISTING}" != "${STEP_BASE_SHA}" ]]; then
              echo "::error::Backup tag points to another commit."
              exit 1
            fi
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム LINE before GYM-NEXT-4"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current Worker and public runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-4

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-4/health.json             "${WORKER_BASE}/api/health"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-4/health.json").read_text(encoding="utf-8")
          )
          assert data.get("ok") is True
          assert data.get("version") == (
              "GYM-6-R2-WORKER-DEMO-BULK-INSERT-FIX-20260717"
          )
          assert data.get("features", {}).get("ticket_ledger") is True
          assert data.get("features", {}).get("atomic_overlap_guard") is True
          PY

          for item in             "index.html|無料体験・トレーニング予約"             "member.html?demo=1&line_user_id=demo_gym_line_002|会員マイページ"             "dashboard.html?demo=1|data-dpro-next-step=\"GYM-NEXT-2\""             "owner-ipad.html?demo=1|iPad受付画面"             "system-check.html?demo=1|営業前 system-check"
          do
            PAGE="${item%%|*}"
            MARKER="${item#*|}"
            if [[ "${PAGE}" == *"?"* ]]; then SEP="&"; else SEP="?"; fi
            FILE="/tmp/gym-next-4/$(
              printf '%s' "${PAGE}" | tr '/?&=' '____'
            ).html"

            curl --fail --location --silent --show-error               --retry 3 --retry-delay 2 --max-time 30               --output "${FILE}"               "${PUBLIC_BASE}/${PAGE}${SEP}next4=${GITHUB_RUN_ID}"

            grep -Fq "${MARKER}" "${FILE}"
          done

      - name: Generate NEXT-4 deployment package
        shell: bash
        env:
          B64_WORKER: ""
          B64_SQL: ""
          B64_SQL_TXT: ""
          B64_ROLLBACK: ""
          B64_ROLLBACK_TXT: ""
          B64_DEPLOY: ""
          B64_MANIFEST: ""
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}" "${STEP_DIR}"

          printf '%s' "${B64_WORKER}" | base64 --decode > "${PACKAGE_DIR}/worker.js"
          printf '%s' "${B64_SQL}" | base64 --decode > "${PACKAGE_DIR}/GYM-NEXT-4.sql"
          printf '%s' "${B64_SQL_TXT}" | base64 --decode > "${PACKAGE_DIR}/GYM-NEXT-4.txt"
          printf '%s' "${B64_ROLLBACK}" | base64 --decode > "${PACKAGE_DIR}/GYM-NEXT-4-ROLLBACK.sql"
          printf '%s' "${B64_ROLLBACK_TXT}" | base64 --decode > "${PACKAGE_DIR}/GYM-NEXT-4-ROLLBACK.txt"
          printf '%s' "${B64_DEPLOY}" | base64 --decode > "${PACKAGE_DIR}/DEPLOY.md"
          printf '%s' "${B64_MANIFEST}" | base64 --decode > "${PACKAGE_DIR}/manifest.yml"

          cp "${PACKAGE_DIR}/worker.js" /tmp/gym-next-4/worker.mjs
          node --check /tmp/gym-next-4/worker.mjs
          ruby -e "require 'yaml'; YAML.load_file('${PACKAGE_DIR}/manifest.yml', aliases: true)"

          grep -Fq "gym_session_records" "${PACKAGE_DIR}/GYM-NEXT-4.sql"
          grep -Fq "gym_complete_session_next" "${PACKAGE_DIR}/GYM-NEXT-4.sql"
          grep -Fq "gym_ticket_ledger_completion_once_idx" "${PACKAGE_DIR}/GYM-NEXT-4.sql"
          grep -Fq "LEGACY_WORKER_URL" "${PACKAGE_DIR}/worker.js"
          grep -Fq "proxyLegacy" "${PACKAGE_DIR}/worker.js"

          if grep -Eiq "drop[[:space:]]+table[[:space:]].*gym_(customers|reservations|ticket_ledger)"             "${PACKAGE_DIR}/GYM-NEXT-4.sql"; then
            echo "::error::Migration contains a forbidden DROP TABLE."
            exit 1
          fi

          (
            cd "${PACKAGE_DIR}"
            zip -q GYM-NEXT-4-WORKER.zip worker.js
            zip -q GYM-NEXT-4-SQL.zip               GYM-NEXT-4.sql GYM-NEXT-4.txt               GYM-NEXT-4-ROLLBACK.sql GYM-NEXT-4-ROLLBACK.txt
            zip -q GYM-NEXT-4-DEPLOYMENT-PACKAGE.zip               worker.js GYM-NEXT-4.sql GYM-NEXT-4.txt               GYM-NEXT-4-ROLLBACK.sql GYM-NEXT-4-ROLLBACK.txt               DEPLOY.md manifest.yml
          )

          sha256sum             "${PACKAGE_DIR}/worker.js"             "${PACKAGE_DIR}/GYM-NEXT-4.sql"             "${PACKAGE_DIR}/GYM-NEXT-4-ROLLBACK.sql"             > "${PACKAGE_DIR}/SHA256SUMS.txt"

      - name: Confirm preparation changed no runtime files
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            git status --short |
              awk '{print $2}' |
              grep -v -F -x "${WORKFLOW_FILE}" |
              grep -v -F -x "${STALE_WORKFLOW_FILE}" |
              sed '/^$/d' || true
          )"

          if [[ "${CHANGED}" != "${PACKAGE_DIR}/" ]]; then
            echo "::error::Unexpected files changed during preparation."
            echo "${CHANGED}"
            exit 1
          fi

          for file in config.js index.html member.html dashboard.html owner-ipad.html system-check.html; do
            git diff --quiet -- "${file}" || {
              echo "::error::Runtime file changed: ${file}"
              exit 1
            }
          done

      - name: Commit deployment package
        shell: bash
        run: |
          set -euo pipefail
          git add "${PACKAGE_DIR}"
          git diff --cached --check
          git commit -m "Prepare GYM-NEXT-4 deployment package"
          PACKAGE_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "PACKAGE_COMMIT_SHA=${PACKAGE_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Record prepared state
        shell: bash
        run: |
          set -euo pipefail
          PREPARED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-4-PREPARED.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-4 PREPARED

          - 結果: PREPARED
          - バックアップタグ: ${BACKUP_TAG}
          - パッケージコミット: ${PACKAGE_COMMIT_SHA}
          - 準備日時: ${PREPARED_AT}
          - Actions: ${RUN_URL}

          ## 現行ソース再確認

          - gym_ticket_ledgerは既存
          - gym_update_reservation_status_atomicは既存
          - 完了済み再実行時の減算防止は既存
          - 新規追加対象はセッション記録と追加の一意ガード

          ## 準備済み

          - Supabase通常SQL・TEXT
          - ロールバックSQL・TEXT
          - 新Worker Gateway
          - Worker用ZIP
          - SQL用ZIP
          - 全体Deploy ZIP
          - Deploy手順
          - SHA-256

          ## 現在の公開環境

          変更なし

          ## 次の手動操作

          1. GYM-NEXT-4.sqlをSupabaseで実行
          2. dpro-gym-line-api-nextを新規作成
          3. worker.jsをDeploy
          4. 新Workerの/api/healthを確認
          5. STEP GYM-NEXT-4-VERIFYを依頼
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-4-PREPARED"
          next_step: "GYM-NEXT-4-VERIFY"
          next_action: "${NEXT_ACTION}"
          result: "PREPARED"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          package_commit_sha: "${PACKAGE_COMMIT_SHA}"
          prepared_at: "${PREPARED_AT}"
          workflow_run_url: "${RUN_URL}"
          runtime_files_changed: false
          existing_worker_changed: false
          supabase_executed: false
          new_worker_deployed: false
          new_worker_name: "dpro-gym-line-api-next"
          new_worker_expected_url: "https://dpro-gym-line-api-next.dpromstk2000.workers.dev"
          existing_ticket_ledger_preserved: true
          existing_atomic_status_rpc_preserved: true
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            current_worker_health: "OK"
            current_public_pages: "OK"
            worker_javascript_syntax: "OK"
            migration_static_safety: "OK"
            rollback_present: "OK"
            runtime_unchanged: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          if [[ -f "${STALE_WORKFLOW_FILE}" ]]; then
            git rm "${STALE_WORKFLOW_FILE}"
          fi
          git commit -m "Record GYM-NEXT-4 prepared state"
          git push origin HEAD:main

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-4-deployment-package
          path: |
            dpro-next/gym/deploy/GYM-NEXT-4/
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-4-PREPARED.md
          if-no-files-found: error
          retention-days: 30

      - name: STEP summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-4 PREPARED"
            echo ""
            echo "- Runtime changed: \`false\`"
            echo "- Existing Worker changed: \`false\`"
            echo "- SQL package: ready"
            echo "- NEXT gateway Worker: ready"
            echo "- Next action: run SQL and deploy new Worker"
            echo "- Next request: \`STEP GYM-NEXT-4-VERIFY\`"
          } >> "$GITHUB_STEP_SUMMARY"
