name: STEP GYM-NEXT-7-VERIFY - LINE History and Repeat Booking UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/GYM-NEXT-7-VERIFY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-7-verify-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-7-VERIFY
  CURRENT_STEP_REQUIRED: GYM-NEXT-7-PREPARED
  NEXT_STEP: GYM-NEXT-8
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-7-VERIFY.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-7-verify-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-7-WORKER-20260725
  PATCH_SCRIPT_B64: ""

jobs:
  verify-and-complete:
    name: Verify Worker and publish member history UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" | head -n1 | tr -d '"\r')"
          NEXT_STEP_IN_LEDGER="$(sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" | head -n1 | tr -d '"\r')"
          RESULT="$(sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" | head -n1 | tr -d '"\r')"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"; exit 1;
          }
          [[ "${NEXT_STEP_IN_LEDGER}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP_IN_LEDGER}"; exit 1;
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Prepared result is not PREPARED."; exit 1;
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" | grep -v -F -x "${WORKFLOW_FILE}" | sed '/^$/d' || true)"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"; echo "${UNEXPECTED}"; exit 1;
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then break; fi
            CHANGED="$(git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" | sed '/^$/d' || true)"
            OTHER="$(printf '%s\n' "${CHANGED}" | grep -v -F -x "${WORKFLOW_FILE}" | sed '/^$/d' || true)"
            if printf '%s\n' "${CHANGED}" | grep -F -x -q "${WORKFLOW_FILE}" && [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-VERIFY version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || { echo "::error::Backup tag points elsewhere."; exit 1; }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" -m "DPRO パーソナルジム LINE before GYM-NEXT-7-VERIFY"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected source baselines
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local file="$1" expected="$2" actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."; echo "Expected: ${expected}"; echo "Actual: ${actual}"; exit 1;
            }
          }
          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 90d477523912be87378d71a9e247365771848440
          check_blob member.html 1f5c980c63fbc817d6e99334bfe1290b0229dae4
          check_blob dashboard.html 538199c142e44d4ee03953d29359c1b341c4ca28
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob dpro-next/gym/deploy/GYM-NEXT-7/worker.js 6d485c431c0e49adf4b91a071bc4b4f66ed2f67d

      - name: Verify deployed Worker and member privacy contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-7-verify
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-7-verify/health.json             "${WORKER_BASE}/api/health?verify=${GITHUB_RUN_ID}"

          MEMBER_OK=false
          for line_id in demo_gym_line_002 demo_gym_line_001; do
            status="$(curl --location --silent --show-error --max-time 30               --output /tmp/gym-next-7-verify/member-home-candidate.json               --write-out '%{http_code}'               "${WORKER_BASE}/api/member/home?facility_code=dpro_gym_demo&demo=1&line_user_id=${line_id}&verify=${GITHUB_RUN_ID}")"
            if [[ "${status}" == "200" ]] && python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/gym-next-7-verify/member-home-candidate.json").read_text())
          raise SystemExit(0 if data.get("ok") is True else 1)
          PY
            then
              cp /tmp/gym-next-7-verify/member-home-candidate.json /tmp/gym-next-7-verify/member-home.json
              MEMBER_OK=true
              break
            fi
          done
          [[ "${MEMBER_OK}" == "true" ]] || { echo "::error::No demo member could verify member home."; exit 1; }

          python3 <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/gym-next-7-verify")
          health=json.loads((root/"health.json").read_text())
          assert health.get("ok") is True
          assert health.get("version")=="GYM-NEXT-7-WORKER-20260725"
          f=health.get("features",{})
          assert f.get("member_session_history") is True
          assert f.get("repeat_booking_prefill") is True
          assert f.get("member_private_note_guard") is True
          assert f.get("staff_api") is True and f.get("role_separation") is True
          assert health.get("next4",{}).get("ok") is True
          assert health.get("next5",{}).get("ok") is True

          home=json.loads((root/"member-home.json").read_text())
          assert home.get("ok") is True
          assert isinstance(home.get("session_history"),list)
          assert "repeat_booking" in home
          p=home.get("privacy",{})
          assert p.get("trainer_note_exposed") is False
          assert p.get("condition_note_exposed") is False
          assert p.get("member_visible_fields_only") is True
          for row in home.get("session_history",[]):
              assert "trainer_note" not in row and "condition_note" not in row
          PY

      - name: Apply NEXT-7 member and booking UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-7-verify
          printf '%s' "${PATCH_SCRIPT_B64}" | base64 --decode > /tmp/gym-next-7-verify/apply_patch.py
          python3 -m py_compile /tmp/gym-next-7-verify/apply_patch.py
          python3 /tmp/gym-next-7-verify/apply_patch.py

      - name: Validate HTML JavaScript IDs and safety rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-7-verify/scripts
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          class Parser(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=="id" and v: self.ids.append(v)
              def handle_startendtag(self,tag,attrs): self.handle_starttag(tag,attrs)
          report={}
          for filename in ("index.html","member.html"):
              text=Path(filename).read_text()
              p=Parser(); p.feed(text)
              dup=sorted({v for v in p.ids if p.ids.count(v)>1})
              if dup: raise SystemExit(f"Duplicate IDs in {filename}: {dup}")
              scripts=[s for s in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",text,re.I|re.S) if s.strip()]
              for i,s in enumerate(scripts,1):
                  Path(f"/tmp/gym-next-7-verify/scripts/{Path(filename).stem}-{i}.js").write_text(s)
              report[filename]={"id_count":len(p.ids),"duplicate_ids":dup,"inline_script_count":len(scripts)}
          Path("/tmp/gym-next-7-verify/html-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          find /tmp/gym-next-7-verify/scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' script; do node --check "${script}"; done

          grep -Fq 'data-dpro-next-step="GYM-NEXT-7"' index.html
          grep -Fq 'data-dpro-next-step="GYM-NEXT-7"' member.html
          grep -Fq 'id="repeatNotice"' index.html
          grep -Fq "params.get('service_code')" index.html
          grep -Fq "params.get('trainer_code')" index.html
          grep -Fq 'function applyRepeatPrefill' index.html
          grep -Fq 'id="repeatReserveLink"' member.html
          grep -Fq 'id="sessionHistoryList"' member.html
          grep -Fq 'function renderSessionHistory' member.html
          grep -Fq 'row.training_summary' member.html
          grep -Fq 'row.next_focus' member.html
          grep -Fq 'row.member_visible_comment' member.html
          ! grep -Fq 'row.trainer_note' member.html
          ! grep -Fq 'row.condition_note' member.html

          for marker in '/api/public/facility' '/api/public/availability' '/api/public/reservations' '予約開始時刻は30分単位' 'isValidPhone' 'state.slot'; do grep -Fq "${marker}" index.html; done
          for marker in '/api/member/home' '/api/member/reservations/cancel-request' '/api/member/reservations/change-request' '/api/member/inquiries' 'X-LIFF-Access-Token'; do grep -Fq "${marker}" member.html; done

      - name: Confirm only index and member changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only | sed '/^$/d' | sort)
          EXPECTED="$(printf '%s\n' index.html member.html | sort)"
          [[ "$(printf '%s\n' "${CHANGED[@]}")" == "${EXPECTED}" ]] || { echo "::error::Unexpected application files changed."; printf 'Changed:\n%s\n' "${CHANGED[*]}"; exit 1; }
          for file in config.js dashboard.html owner-ipad.html staff.html system-check.html; do
            git diff --quiet -- "${file}" || { echo "::error::Unexpected runtime change: ${file}"; exit 1; }
          done
          git diff --check

      - name: Commit NEXT-7 LINE member UI
        shell: bash
        run: |
          set -euo pipefail
          git add index.html member.html
          git commit -m "Complete GYM-NEXT-7 member history UI"
          APPLICATION_COMMIT_SHA="$(git rev-parse HEAD)"
          INDEX_BLOB="$(git hash-object index.html)"
          MEMBER_BLOB="$(git hash-object member.html)"
          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "INDEX_BLOB=${INDEX_BLOB}" >> "$GITHUB_ENV"
          echo "MEMBER_BLOB=${MEMBER_BLOB}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify published UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-7-verify/public
          verify_page() {
            local page="$1" marker1="$2" marker2="$3" file="/tmp/gym-next-7-verify/public/$1"
            for attempt in $(seq 1 24); do
              curl --fail --location --silent --show-error --max-time 30                 --output "${file}" "${PUBLIC_BASE}/${page}?verify=${GITHUB_RUN_ID}-${attempt}" || true
              if [[ -s "${file}" ]] && grep -Fq "${marker1}" "${file}" && grep -Fq "${marker2}" "${file}"; then return 0; fi
              sleep 10
            done
            echo "::error::Published page did not reach NEXT-7: ${page}"; exit 1
          }
          verify_page index.html 'data-dpro-next-step="GYM-NEXT-7"' 'function applyRepeatPrefill'
          verify_page member.html 'id="repeatReserveLink"' 'id="sessionHistoryList"'
          ! grep -Fq 'row.trainer_note' /tmp/gym-next-7-verify/public/member.html
          ! grep -Fq 'row.condition_note' /tmp/gym-next-7-verify/public/member.html

      - name: Record GYM-NEXT-7 completion and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          cat > "${STEP_DIR}/GYM-NEXT-7-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-7 COMPLETE
          - 結果: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - Supabase変更: なし
          - 前回と同じ内容で予約: OK
          - メニュー・担当者事前選択: OK
          - 会員向けセッション振り返り: OK
          - 実施内容・次回の重点・会員向けコメント: OK
          - スタッフ内部メモ公開: なし
          - 体調内部記録公開: なし
          - 30分枠・過去日時・重複防止: 維持
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-7-COMPLETE"
          workflow_revision: "R1"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          index_blob: "${INDEX_BLOB}"
          member_blob: "${MEMBER_BLOB}"
          config_blob: "68028432d9177a907e1e91e81c316b47b8845147"
          dashboard_blob: "538199c142e44d4ee03953d29359c1b341c4ca28"
          owner_ipad_blob: "3b94e5221ec26ec74d8e1fe4e4e41285ee27c792"
          staff_blob: "59e66cb480aa5795c646ab99a1ff71070013ad26"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_deployed: true
          supabase_changed: false
          runtime_files_changed: true
          worker_changed: true
          api_changed: true
          changed_files:
            - "index.html"
            - "member.html"
          completed_features:
            member_session_history: true
            repeat_booking_prefill: true
            member_visible_comment: true
            next_focus: true
            trainer_note_exposed: false
            condition_note_exposed: false
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            worker_health: "OK"
            member_home_contract: "OK"
            member_privacy_guard: "OK"
            next4_preserved: "OK"
            next5_preserved: "OK"
            staff_role_preserved: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            booking_30_minute_rule: "OK"
            existing_api_references: "OK"
            public_index: "OK"
            public_member: "OK"
          EOF
          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-7 completion"
          git push origin HEAD:main

      - name: Upload NEXT-7 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-7-completion
          path: |
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-7-COMPLETE.md
            /tmp/gym-next-7-verify/health.json
            /tmp/gym-next-7-verify/member-home.json
            /tmp/gym-next-7-verify/html-report.json
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-7 COMPLETE"
            echo "- Worker: \`${EXPECTED_WORKER_VERSION}\`"
            echo "- Member-safe session history: \`OK\`"
            echo "- Repeat booking prefill: \`OK\`"
            echo "- Private notes exposed: \`false\`"
            echo "- Supabase change: \`false\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
