name: STEP GYM-NEXT-9 - Prepare Performance Security System Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-9.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-9-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-9
  CURRENT_STEP_REQUIRED: GYM-NEXT-8-COMPLETE
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-9.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  SOURCE_WORKER: dpro-next/gym/deploy/GYM-NEXT-8/worker.js
  PACKAGE_DIR: dpro-next/gym/deploy/GYM-NEXT-9
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-9-20260725
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  CURRENT_WORKER_VERSION: GYM-NEXT-8-WORKER-R2-20260725
  EXPECTED_WORKER_VERSION: GYM-NEXT-9-WORKER-20260725
  EXPECTED_WORKER_SHA256: d1f62c3d88b67df0488848ad8d29ba5cc3a0493669993cc386e7ad5d49832dbb

jobs:
  prepare:
    name: Prepare security and integrated system-check Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-8 completion and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::Previous STEP result is not OK."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-9 version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム before GYM-NEXT-9"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current files and deployed Worker
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 6ea48136d70e328366a8584ebecaa55562372d20
          check_blob member.html ed7e59d0a1101adfd328e24e1eb09a8f62a41aca
          check_blob dashboard.html cbb1f028442946c0ba2fd69eedc90de844eae68c
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob system-check.html 278a6e803a87e4e334d2f5d8ad2e33bab080ca0a
          check_blob "${SOURCE_WORKER}" f0a0d7c0645bfc79fcf2756f24f224322ad2000d

          mkdir -p /tmp/gym-next-9
          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-9/health.json             "${WORKER_BASE}/api/health?prepare=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             --output /tmp/gym-next-9/admin-system.json             "${WORKER_BASE}/api/admin/system-check?facility_code=dpro_gym_demo&prepare=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Staff-Key: 5678"             --output /tmp/gym-next-9/staff-health.json             "${WORKER_BASE}/api/staff/health?prepare=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-9")
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          assert health.get("ok") is True, health
          assert health.get("version") == "GYM-NEXT-8-WORKER-R2-20260725", health
          assert health.get("next4", {}).get("ok") is True, health
          assert health.get("next5", {}).get("ok") is True, health
          assert health.get("next8", {}).get("ok") is True, health
          features = health.get("features", {})
          assert features.get("member_session_history") is True, health
          assert features.get("role_separation") is True, health
          assert features.get("follow_up_snooze_guard") is True, health
          assert features.get("automatic_line_broadcast") is False, health

          admin = json.loads(
              (root / "admin-system.json").read_text(encoding="utf-8")
          )
          assert admin.get("ok") is True, admin

          staff = json.loads(
              (root / "staff-health.json").read_text(encoding="utf-8")
          )
          assert staff.get("ok") is True, staff
          assert staff.get("role") == "staff", staff
          PY

      - name: Generate NEXT-9 Worker package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}" /tmp/gym-next-9
          cp "${SOURCE_WORKER}" "${PACKAGE_DIR}/worker.js"

          cat > /tmp/gym-next-9/worker.patch <<'PATCH'
          --- a/worker.js
