name: STEP GYM-NEXT-1 - Baseline Protection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-1-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-1
  SYSTEM_NAME: DPRO パーソナルジム LINE
  FACILITY_CODE: dpro_gym_demo
  BASELINE_CONFIG_VERSION: GYM-6-R2-CONFIG-RESTORE-URL-HEADER-FIX-20260717
  BACKUP_TAG: backup-gym-before-next-20260725
  NEXT_STEP: GYM-NEXT-2
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-1.yml
  LEDGER_DIR: dpro-next/gym
  TARGET_FILES: "config.js index.html member.html dashboard.html owner-ipad.html reserve.html system-check.html"

jobs:
  protect-and-audit:
    name: Protect current version and create baseline ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record STEP metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "step_name=${STEP_NAME}" >> "$GITHUB_ENV"
          echo "started_at=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"
          echo "repository=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Confirm previous STEP and determine protected commit
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::This workflow must run on main."
            exit 1
          fi

          if [[ ! -f "${WORKFLOW_FILE}" ]]; then
            echo "::error::Workflow file is missing: ${WORKFLOW_FILE}"
            exit 1
          fi

          if [[ -f "${LEDGER_DIR}/next-ledger.yml" ]]; then
            CURRENT_STEP="$(sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_DIR}/next-ledger.yml" | head -n 1 | tr -d '\"\r')"
            case "${CURRENT_STEP}" in
              ""|"GYM-NEXT-1"|"GYM-NEXT-1-COMPLETE")
                ;;
              *)
                echo "::error::Unexpected current_step: ${CURRENT_STEP}"
                exit 1
                ;;
            esac
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            BASELINE_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          else
            BASELINE_SHA="$(git rev-parse HEAD)"
          fi

          echo "baseline_sha=${BASELINE_SHA}" >> "$GITHUB_OUTPUT"
          echo "BASELINE_SHA=${BASELINE_SHA}" >> "$GITHUB_ENV"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UNEXPECTED_CHANGED_FILES="$(
              git diff --name-only "${BASELINE_SHA}" "${GITHUB_SHA}" \
                | grep -v -F -x "${WORKFLOW_FILE}" \
                | sed '/^$/d' || true
            )"

            if [[ -n "${UNEXPECTED_CHANGED_FILES}" ]]; then
              echo "::error::NEXT-1 upload commit must contain only the workflow file."
              echo "Unexpected files:"
              echo "${UNEXPECTED_CHANGED_FILES}"
              exit 1
            fi
          fi

          echo "Protected commit: ${BASELINE_SHA}"

      - name: Create or verify backup tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING_SHA="$(git rev-list -n 1 "${BACKUP_TAG}")"
            if [[ "${EXISTING_SHA}" != "${BASELINE_SHA}" ]]; then
              echo "::error::Backup tag already exists on another commit."
              echo "Expected: ${BASELINE_SHA}"
              echo "Existing: ${EXISTING_SHA}"
              exit 1
            fi
            echo "Backup tag already exists and is correct."
          else
            git tag -a "${BACKUP_TAG}" "${BASELINE_SHA}" \
              -m "DPRO パーソナルジム LINE before DPRO NEXT"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify required files and current configuration
        shell: bash
        run: |
          set -euo pipefail

          for file in ${TARGET_FILES}; do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Required file is missing: ${file}"
              exit 1
            fi
          done

          grep -Fq "facilityCode: 'dpro_gym_demo'" config.js
          grep -Fq "slotMinutes: 30" config.js
          grep -Fq "timezone: 'Asia/Tokyo'" config.js
          grep -Fq "dpro-gym-line-api.dpromstk2000.workers.dev" config.js
          grep -Fq "dpromstk2000-lab.github.io/liff-gym-demo/" config.js
          grep -Fq "${BASELINE_CONFIG_VERSION}" config.js

      - name: Verify current public URLs and Worker API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gym-next-tmp

          WORKER_BASE="https://dpro-gym-line-api.dpromstk2000.workers.dev"
          PUBLIC_BASE="https://dpromstk2000-lab.github.io/liff-gym-demo"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            "${WORKER_BASE}/api/health" \
            -o .gym-next-tmp/health.json

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            "${WORKER_BASE}/api/public/facility?facility_code=${FACILITY_CODE}" \
            -o .gym-next-tmp/facility.json

          python3 <<'PY'
          from pathlib import Path
          import json
          import sys

          health = json.loads(Path(".gym-next-tmp/health.json").read_text(encoding="utf-8"))
          facility = json.loads(Path(".gym-next-tmp/facility.json").read_text(encoding="utf-8"))

          errors = []
          if health.get("ok") is not True:
              errors.append("Worker health did not return ok=true")
          if facility.get("ok") is not True:
              errors.append("Public facility API did not return ok=true")

          code = (
              facility.get("facility", {}).get("facility_code")
              or facility.get("facility_code")
              or ""
          )
          if code and code != "dpro_gym_demo":
              errors.append(f"Unexpected facility_code: {code}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Worker and public facility API are reachable.")
          PY

          for path in \
            "/" \
            "/member.html?demo=1&line_user_id=demo_gym_line_002" \
            "/dashboard.html?demo=1" \
            "/owner-ipad.html?demo=1" \
            "/system-check.html?demo=1"
          do
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 30 \
              "${PUBLIC_BASE}${path}" \
              -o /dev/null
          done

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('${WORKFLOW_FILE}', aliases: true); puts 'YAML syntax OK'"

      - name: Validate HTML structure, duplicate IDs and inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gym-next-tmp
          mkdir -p .gym-next-tmp/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re
          import sys

          html_files = [
              "index.html",
              "member.html",
              "dashboard.html",
              "owner-ipad.html",
              "reserve.html",
              "system-check.html",
          ]

          void_tags = {
              "area", "base", "br", "col", "embed", "hr", "img",
              "input", "link", "meta", "param", "source", "track", "wbr",
          }

          class AuditParser(HTMLParser):
              def __init__(self, filename):
                  super().__init__(convert_charrefs=True)
                  self.filename = filename
                  self.ids = {}
                  self.duplicate_ids = []
                  self.stack = []
                  self.structure_errors = []
                  self.inline_scripts = []
                  self.current_script = None
                  self.current_script_attrs = {}

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicate_ids.append(element_id)
                      self.ids[element_id] = self.getpos()

                  if tag == "script":
                      self.current_script_attrs = attrs_dict
                      if not attrs_dict.get("src"):
                          script_type = (attrs_dict.get("type") or "").lower()
                          if script_type in ("", "text/javascript", "module"):
                              self.current_script = []

                  if tag not in void_tags:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicate_ids.append(element_id)
                      self.ids[element_id] = self.getpos()

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "script" and self.current_script is not None:
                      self.inline_scripts.append("\n".join(self.current_script))
                      self.current_script = None
                      self.current_script_attrs = {}

                  if tag in void_tags:
                      return

                  if not self.stack:
                      self.structure_errors.append(f"unexpected closing tag </{tag}>")
                      return

                  if self.stack[-1] == tag:
                      self.stack.pop()
                      return

                  if tag in self.stack:
                      while self.stack and self.stack[-1] != tag:
                          missing = self.stack.pop()
                          self.structure_errors.append(
                              f"missing closing tag </{missing}> before </{tag}>"
                          )
                      if self.stack:
                          self.stack.pop()
                  else:
                      self.structure_errors.append(f"closing tag without opener </{tag}>")

              def handle_data(self, data):
                  if self.current_script is not None:
                      self.current_script.append(data)

          report = {}
          has_error = False
          script_index = 0
          output_dir = Path(".gym-next-tmp/scripts")

          for filename in html_files:
              text = Path(filename).read_text(encoding="utf-8")
              parser = AuditParser(filename)
              parser.feed(text)
              parser.close()

              if parser.stack:
                  parser.structure_errors.extend(
                      f"unclosed tag <{tag}>" for tag in reversed(parser.stack)
                  )

              document_checks = {
                  "doctype": bool(re.search(r"<!doctype\s+html", text, re.I)),
                  "html_tag": bool(re.search(r"<html\b", text, re.I)),
                  "head_tag": bool(re.search(r"<head\b", text, re.I)),
                  "body_tag": bool(re.search(r"<body\b", text, re.I)),
                  "viewport": 'name="viewport"' in text or "name='viewport'" in text,
                  "charset": "charset=" in text.lower(),
              }

              report[filename] = {
                  "duplicate_ids": sorted(set(parser.duplicate_ids)),
                  "structure_errors": parser.structure_errors,
                  "document_checks": document_checks,
                  "inline_script_count": len(parser.inline_scripts),
              }

              if parser.duplicate_ids or parser.structure_errors or not all(document_checks.values()):
                  has_error = True

              for script in parser.inline_scripts:
                  script_index += 1
                  path = output_dir / f"{script_index:03d}-{Path(filename).stem}.js"
                  path.write_text(script, encoding="utf-8")

          Path(".gym-next-tmp/html-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if has_error:
              print(json.dumps(report, ensure_ascii=False, indent=2))
              sys.exit(1)
          PY

          node --check config.js

          shopt -s nullglob
          for script in .gym-next-tmp/scripts/*.js; do
            node --check "${script}"
          done

      - name: Verify existing functions are preserved
        shell: bash
        run: |
          set -euo pipefail

          require_text() {
            local file="$1"
            local text="$2"
            local label="$3"
            if ! grep -Fq "${text}" "${file}"; then
              echo "::error::Missing existing function: ${label} (${file})"
              exit 1
            fi
          }

          require_text index.html "/api/public/facility" "public facility load"
          require_text index.html "/api/public/availability" "availability load"
          require_text index.html "/api/public/reservations" "public reservation creation"
          require_text index.html "initLineIdentity" "LIFF identity"
          require_text index.html "tryLoadMember" "existing member lookup"
          require_text index.html "isValidPhone" "phone validation"
          require_text index.html "todayYmd" "past-date starting guard"

          require_text member.html "/api/member/home" "member home"
          require_text member.html "cancel-request" "cancel request"
          require_text member.html "change-request" "change request"
          require_text member.html "/api/member/inquiries" "member inquiry"
          require_text member.html "reservation_history" "member reservation history"

          require_text dashboard.html "/api/admin/dashboard" "owner dashboard"
          require_text dashboard.html "/api/admin/reservations/status" "reservation status update"
          require_text dashboard.html "/api/admin/customers/upsert" "customer upsert"
          require_text dashboard.html "/api/admin/customers/tickets" "ticket adjustment"
          require_text dashboard.html "/api/admin/settings" "facility settings"
          require_text dashboard.html "/api/admin/activity-logs" "activity logs"
          require_text dashboard.html "clearAdminCode" "admin code delete button"
          require_text dashboard.html "今日やること" "today-first owner screen"

          require_text owner-ipad.html "本日の受付" "iPad today reception"
          require_text owner-ipad.html "'arrived'" "arrival transition"
          require_text owner-ipad.html "'in_session'" "session transition"
          require_text owner-ipad.html "'completed'" "completion transition"

          require_text system-check.html "/api/health" "Worker health check"
          require_text system-check.html "/api/admin/system-check" "admin system check"
          require_text system-check.html "/api/admin/phone-normalize-check" "phone normalization check"
          require_text system-check.html "atomic_reservation_guard" "duplicate reservation check"
          require_text system-check.html "営業前DEMO準備" "demo preparation"

          require_text reserve.html "window.location.replace" "legacy URL redirect"

      - name: Verify personal-gym business logic
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "default_slot_minutes:30" dashboard.html
          grep -Fq "slotMinutes: 30" config.js
          grep -Fq "完了・回数減算" dashboard.html
          grep -Fq "完了・回数減算" owner-ipad.html
          grep -Fq "セッションを完了し、回数券対象メニューは1回減算" dashboard.html
          grep -Fq "セッションを完了し、回数券対象メニューは1回減算" owner-ipad.html

          for status in requested confirmed arrived in_session completed change_requested cancel_requested cancelled no_show; do
            grep -Fq "${status}" dashboard.html
            grep -Fq "${status}" owner-ipad.html
            grep -Fq "${status}" member.html
          done

          grep -Fq "ticket_remaining" dashboard.html
          grep -Fq "ticket_remaining" owner-ipad.html
          grep -Fq "ticket_remaining" member.html
          grep -Fq "next_follow_on" dashboard.html
          grep -Fq "follow_status" dashboard.html
          grep -Fq "precautions" dashboard.html
          grep -Fq "goal" index.html
          grep -Fq "concern" index.html

      - name: Inventory API usage and record baseline hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"

          : > "${LEDGER_DIR}/baseline-files.sha256"
          : > "${LEDGER_DIR}/baseline-file-sizes.tsv"

          for file in ${TARGET_FILES}; do
            sha256sum "${file}" >> "${LEDGER_DIR}/baseline-files.sha256"
            printf '%s\t%s\n' "${file}" "$(stat -c '%s' "${file}")" \
              >> "${LEDGER_DIR}/baseline-file-sizes.tsv"
          done

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              "config.js",
              "index.html",
              "member.html",
              "dashboard.html",
              "owner-ipad.html",
              "reserve.html",
              "system-check.html",
          ]

          found = set()
          pattern = re.compile(r"/api/[A-Za-z0-9_?=&${}./:-]+")
          for filename in files:
              text = Path(filename).read_text(encoding="utf-8")
              for value in pattern.findall(text):
                  value = value.rstrip("`'\"),;]")
                  found.add(f"{filename}\t{value}")

          Path("dpro-next/gym/baseline-api-inventory.tsv").write_text(
              "\n".join(sorted(found)) + "\n",
              encoding="utf-8",
          )
          PY

          cp .gym-next-tmp/html-audit.json "${LEDGER_DIR}/baseline-html-audit.json"

      - name: Confirm Worker, Supabase and API source were not changed
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git diff --name-only "${BASELINE_SHA}" "${GITHUB_SHA}" | sed '/^$/d' || true)"

          WORKER_CHANGED=false
          SUPABASE_CHANGED=false
          API_CHANGED=false

          if echo "${CHANGED_FILES}" | grep -Eiq '(^|/)(worker[^/]*\.js|wrangler\.toml)$'; then
            WORKER_CHANGED=true
          fi
          if echo "${CHANGED_FILES}" | grep -Eiq '(^|/)(supabase|sql|migrations?)(/|$)|\.sql$'; then
            SUPABASE_CHANGED=true
          fi
          if echo "${CHANGED_FILES}" | grep -Eiq '(^|/)(api|functions?)(/|$)'; then
            API_CHANGED=true
          fi

          if [[ "${WORKER_CHANGED}" != "false" || "${SUPABASE_CHANGED}" != "false" || "${API_CHANGED}" != "false" ]]; then
            echo "::error::NEXT-1 must not change Worker, Supabase or API source."
            printf 'Changed files:\n%s\n' "${CHANGED_FILES}"
            exit 1
          fi

          {
            echo "WORKER_CHANGED=${WORKER_CHANGED}"
            echo "SUPABASE_CHANGED=${SUPABASE_CHANGED}"
            echo "API_CHANGED=${API_CHANGED}"
          } >> "$GITHUB_ENV"

      - name: Create baseline report and completion ledger
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${LEDGER_DIR}/baseline-report.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-1 現状基準台帳

          - STEP: ${STEP_NAME}
          - 結果: OK
          - 基準コミット: ${BASELINE_SHA}
          - バックアップタグ: ${BACKUP_TAG}
          - 設定バージョン: ${BASELINE_CONFIG_VERSION}
          - 施設コード: ${FACILITY_CODE}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${run_url}

          ## 保護対象

          ${TARGET_FILES}

          ## 自動検査

          - 公開URL・Worker疎通: OK
          - YAML構文: OK
          - HTML基本構造: OK
          - JavaScript構文: OK
          - HTML ID重複: OK
          - 必須ファイル: OK
          - 既存機能維持: OK
          - パーソナルジム業務ロジック: OK
          - 30分枠: OK
          - 電話番号正規化検査の存在: OK
          - 重複予約防止検査の存在: OK
          - 管理コード削除ボタン: OK
          - Worker変更: ${WORKER_CHANGED}
          - Supabase変更: ${SUPABASE_CHANGED}
          - APIソース変更: ${API_CHANGED}

          ## 次のSTEP

          ${NEXT_STEP}
          EOF

          cat > "${LEDGER_DIR}/next-ledger.yml" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-1-COMPLETE"
          next_step: "${NEXT_STEP}"
          result: "OK"
          baseline_config_version: "${BASELINE_CONFIG_VERSION}"
          facility_code: "${FACILITY_CODE}"
          slot_minutes: 30
          baseline_sha: "${BASELINE_SHA}"
          backup_tag: "${BACKUP_TAG}"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${run_url}"
          worker_changed: ${WORKER_CHANGED}
          supabase_changed: ${SUPABASE_CHANGED}
          api_changed: ${API_CHANGED}
          application_files_changed: false
          checks:
            public_urls_and_worker: "OK"
            yaml_syntax: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            required_files: "OK"
            existing_features: "OK"
            personal_gym_logic: "OK"
            slot_minutes_30: "OK"
            phone_normalization_check: "OK"
            duplicate_reservation_check: "OK"
            admin_code_delete_button: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_DIR}/next-ledger.yml', aliases: true); puts 'Ledger YAML OK'"

      - name: Upload baseline audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-1-baseline-audit
          path: dpro-next/gym/
          if-no-files-found: error
          retention-days: 30

      - name: Commit ledger, delete this workflow and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

          git add "${LEDGER_DIR}"
          git rm "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::error::No completion files were generated."
            exit 1
          fi

          git commit -m "Complete GYM-NEXT-1 baseline protection"
          git push origin HEAD:main

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-1 COMPLETE"
            echo ""
            echo "- Backup tag: \`${BACKUP_TAG}\`"
            echo "- Protected commit: \`${BASELINE_SHA}\`"
            echo "- Ledger: \`${LEDGER_DIR}/next-ledger.yml\`"
            echo "- Worker changed: \`${WORKER_CHANGED}\`"
            echo "- Supabase changed: \`${SUPABASE_CHANGED}\`"
            echo "- API source changed: \`${API_CHANGED}\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
            echo "- Workflow file: deleted after success"
          } >> "$GITHUB_STEP_SUMMARY"
