name: STEP GYM-NEXT-5 - Prepare Trial Admission and Plans

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-5.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-5-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-5
  CURRENT_STEP_REQUIRED: GYM-NEXT-4-COMPLETE
  NEXT_ACTION: RUN_SQL_AND_DEPLOY_WORKER
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-5.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  PACKAGE_DIR: dpro-next/gym/deploy/GYM-NEXT-5
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-5-20260725
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  EXPECTED_CURRENT_WORKER: GYM-NEXT-4-WORKER-20260725
  EXPECTED_NEXT_WORKER: GYM-NEXT-5-WORKER-20260725

jobs:
  prepare:
    name: Prepare trial admission SQL and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-4 completion and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::Previous STEP result is not OK."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only GYM-NEXT-5.yml"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-5 version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム LINE before GYM-NEXT-5"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current UI baselines and Worker
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 94619ddc2fd2dd43b6d3cb99ba2349eef9d1f705
          check_blob dashboard.html 2f69ca0e207c244d9bb671bcd2c6d36b747a14de
          check_blob owner-ipad.html 04b119e1f32a5156f94a64079c6d751253d7dfff

          mkdir -p /tmp/gym-next-5
          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-5/health.json             "${WORKER_BASE}/api/health?prepare=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(
              Path("/tmp/gym-next-5/health.json").read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("version") == "GYM-NEXT-4-WORKER-20260725", data
          assert data.get("next4", {}).get("ok") is True, data
          PY

          for item in             "dashboard.html?demo=1|data-dpro-next-step=\"GYM-NEXT-4\""             "owner-ipad.html?demo=1|data-dpro-next-step=\"GYM-NEXT-4\""             "member.html?demo=1&line_user_id=demo_gym_line_002|会員マイページ"
          do
            PAGE="${item%%|*}"
            MARKER="${item#*|}"
            if [[ "${PAGE}" == *"?"* ]]; then SEP="&"; else SEP="?"; fi
            FILE="/tmp/gym-next-5/$(
              printf '%s' "${PAGE}" | tr '/?&=' '____'
            ).html"
            curl --fail --location --silent --show-error               --retry 3 --retry-delay 2 --max-time 30               --output "${FILE}"               "${PUBLIC_BASE}/${PAGE}${SEP}next5=${GITHUB_RUN_ID}"
            grep -Fq "${MARKER}" "${FILE}"
          done

      - name: Generate NEXT-5 deployment package
        shell: bash
        env:
          B64_WORKER: ""
          B64_SQL: ""
          B64_ROLLBACK: ""
          B64_DEPLOY: ""
          B64_MANIFEST: ""
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}" "${STEP_DIR}"

          printf '%s' "${B64_WORKER}" | base64 --decode > "${PACKAGE_DIR}/worker.js"
          printf '%s' "${B64_SQL}" | base64 --decode > "${PACKAGE_DIR}/GYM-NEXT-5.sql"
          printf '%s' "${B64_ROLLBACK}" | base64 --decode > "${PACKAGE_DIR}/GYM-NEXT-5-ROLLBACK.sql"
          printf '%s' "${B64_DEPLOY}" | base64 --decode > "${PACKAGE_DIR}/DEPLOY.md"
          printf '%s' "${B64_MANIFEST}" | base64 --decode > "${PACKAGE_DIR}/manifest.yml"

          cp "${PACKAGE_DIR}/worker.js" /tmp/gym-next-5/worker.mjs
          node --check /tmp/gym-next-5/worker.mjs
          ruby -e "require 'yaml'; YAML.load_file('${PACKAGE_DIR}/manifest.yml', aliases: true)"

          grep -Fq "gym_plans" "${PACKAGE_DIR}/GYM-NEXT-5.sql"
          grep -Fq "gym_memberships" "${PACKAGE_DIR}/GYM-NEXT-5.sql"
          grep -Fq "gym_trial_decisions" "${PACKAGE_DIR}/GYM-NEXT-5.sql"
          grep -Fq "gym_admit_customer_next" "${PACKAGE_DIR}/GYM-NEXT-5.sql"
          grep -Fq "GYM-NEXT-5-WORKER-20260725" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/admin/trial-pipeline" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/admin/customers/admit" "${PACKAGE_DIR}/worker.js"

          if grep -Eiq "drop[[:space:]]+table[[:space:]].*gym_(customers|reservations|ticket_ledger)"             "${PACKAGE_DIR}/GYM-NEXT-5.sql"; then
            echo "::error::Migration contains forbidden DROP TABLE."
            exit 1
          fi

          (
            cd "${PACKAGE_DIR}"
            zip -q GYM-NEXT-5-WORKER.zip worker.js
            zip -q GYM-NEXT-5-SQL.zip GYM-NEXT-5.sql
            zip -q GYM-NEXT-5-DEPLOYMENT-PACKAGE.zip               worker.js GYM-NEXT-5.sql GYM-NEXT-5-ROLLBACK.sql               DEPLOY.md manifest.yml
          )

          sha256sum             "${PACKAGE_DIR}/worker.js"             "${PACKAGE_DIR}/GYM-NEXT-5.sql"             "${PACKAGE_DIR}/GYM-NEXT-5-ROLLBACK.sql"             > "${PACKAGE_DIR}/SHA256SUMS.txt"

      - name: Confirm preparation changed no runtime files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_FILES < <(
            git status --porcelain=v1 --untracked-files=all |
              sed -E 's/^.. //' |
              sed 's/^"//;s/"$//' |
              grep -v -F -x "${WORKFLOW_FILE}" |
              sed '/^$/d' || true
          )

          [[ "${#CHANGED_FILES[@]}" -gt 0 ]] || {
            echo "::error::Deployment package files were not generated."
            exit 1
          }

          for changed_file in "${CHANGED_FILES[@]}"; do
            case "${changed_file}" in
              "${PACKAGE_DIR}/"*) ;;
              *)
                echo "::error::Unexpected file changed: ${changed_file}"
                exit 1
                ;;
            esac
          done

          for file in config.js index.html member.html dashboard.html owner-ipad.html system-check.html; do
            git diff --quiet -- "${file}" || {
              echo "::error::Runtime file changed: ${file}"
              exit 1
            }
          done

      - name: Commit deployment package
        shell: bash
        run: |
          set -euo pipefail
          git add "${PACKAGE_DIR}"
          git diff --cached --check
          git commit -m "Prepare GYM-NEXT-5 deployment package"
          PACKAGE_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "PACKAGE_COMMIT_SHA=${PACKAGE_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Record prepared state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          PREPARED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-5-PREPARED.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-5 PREPARED

          - 結果: PREPARED
          - 正式Worker: dpro-gym-line-api
          - 現行Worker: ${EXPECTED_CURRENT_WORKER}
          - 更新後Worker: ${EXPECTED_NEXT_WORKER}
          - Supabase SQL: 準備済み
          - ロールバックSQL: 準備済み
          - 公開環境: 変更なし
          - バックアップタグ: ${BACKUP_TAG}
          - パッケージコミット: ${PACKAGE_COMMIT_SHA}
          - 準備日時: ${PREPARED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-5-PREPARED"
          workflow_revision: "R1"
          next_step: "GYM-NEXT-5-VERIFY"
          next_action: "${NEXT_ACTION}"
          result: "PREPARED"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          package_commit_sha: "${PACKAGE_COMMIT_SHA}"
          prepared_at: "${PREPARED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          current_worker_version: "${EXPECTED_CURRENT_WORKER}"
          expected_worker_version: "${EXPECTED_NEXT_WORKER}"
          worker_deployed: false
          supabase_executed: false
          runtime_files_changed: false
          worker_changed: false
          supabase_changed: false
          api_changed: false
          prepared_features:
            plan_master: true
            trial_pipeline: true
            atomic_admission: true
            membership_grant_guard: true
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            current_worker_health: "OK"
            current_public_pages: "OK"
            worker_javascript_syntax: "OK"
            migration_static_safety: "OK"
            rollback_present: "OK"
            runtime_unchanged: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-5 prepared state"
          git push origin HEAD:main

      - name: Upload NEXT-5 deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-5-deployment-package
          path: |
            dpro-next/gym/deploy/GYM-NEXT-5/
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-5-PREPARED.md
          if-no-files-found: error
          retention-days: 30

      - name: STEP summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-5 PREPARED"
            echo ""
            echo "- Runtime changed: false"
            echo "- Formal Worker: dpro-gym-line-api"
            echo "- SQL package: ready"
            echo "- Worker package: ready"
            echo "- Next request after deploy: STEP GYM-NEXT-5-VERIFY"
          } >> "$GITHUB_STEP_SUMMARY"
