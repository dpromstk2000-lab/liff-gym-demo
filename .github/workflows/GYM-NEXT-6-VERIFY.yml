name: STEP GYM-NEXT-6-VERIFY - iPad and Staff Role Separation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-6-VERIFY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-6-verify-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-6-VERIFY
  CURRENT_STEP_REQUIRED: GYM-NEXT-6-PREPARED
  NEXT_STEP: GYM-NEXT-7
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-6-VERIFY.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-6-verify-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-6-WORKER-20260725

jobs:
  verify-and-complete:
    name: Verify Worker and publish role-separated screens
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP_IN_LEDGER="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP_IN_LEDGER}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP_IN_LEDGER}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Prepared result is not PREPARED."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-VERIFY version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "DPRO パーソナルジム LINE before GYM-NEXT-6-VERIFY"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected source baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 94619ddc2fd2dd43b6d3cb99ba2349eef9d1f705
          check_blob dashboard.html 538199c142e44d4ee03953d29359c1b341c4ca28
          check_blob owner-ipad.html 04b119e1f32a5156f94a64079c6d751253d7dfff
          check_blob dpro-next/gym/deploy/GYM-NEXT-6/worker.js 0245b34820fe594195364a66fde80c4bed72d9ca

          if [[ -e staff.html ]]; then
            echo "::error::staff.html already exists unexpectedly."
            exit 1
          fi

      - name: Verify deployed Worker authentication and existing roles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-6-verify

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --output /tmp/gym-next-6-verify/health.json \
            "${WORKER_BASE}/api/health?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Staff-Key: 5678" \
            --output /tmp/gym-next-6-verify/staff-health.json \
            "${WORKER_BASE}/api/staff/health?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Staff-Key: 5678" \
            --output /tmp/gym-next-6-verify/staff-today.json \
            "${WORKER_BASE}/api/staff/today?facility_code=dpro_gym_demo&date=$(TZ=Asia/Tokyo date +%F)&verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Admin-Key: 1234" \
            --output /tmp/gym-next-6-verify/admin-dashboard.json \
            "${WORKER_BASE}/api/admin/dashboard?facility_code=dpro_gym_demo&date=$(TZ=Asia/Tokyo date +%F)&verify=${GITHUB_RUN_ID}"

          NO_KEY_STATUS="$(
            curl --location --silent \
              --output /tmp/gym-next-6-verify/no-key.json \
              --write-out '%{http_code}' \
              "${WORKER_BASE}/api/staff/health?no_key=${GITHUB_RUN_ID}"
          )"
          ADMIN_AS_STAFF_STATUS="$(
            curl --location --silent \
              --output /tmp/gym-next-6-verify/admin-as-staff.json \
              --write-out '%{http_code}' \
              -H "X-Staff-Key: 1234" \
              "${WORKER_BASE}/api/staff/health?wrong_role=${GITHUB_RUN_ID}"
          )"

          [[ "${NO_KEY_STATUS}" == "401" ]] || {
            echo "::error::Staff API without key returned ${NO_KEY_STATUS}, expected 401."
            exit 1
          }
          [[ "${ADMIN_AS_STAFF_STATUS}" == "401" ]] || {
            echo "::error::Admin code was accepted as staff code."
            exit 1
          }

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-6-verify")
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          assert health.get("ok") is True, health
          assert health.get("version") == "GYM-NEXT-6-WORKER-20260725", health
          assert health.get("staff_token_configured") is True, health
          features = health.get("features", {})
          assert features.get("staff_page") is True, health
          assert features.get("staff_api") is True, health
          assert features.get("role_separation") is True, health
          assert health.get("next4", {}).get("ok") is True, health
          assert health.get("next5", {}).get("ok") is True, health

          staff_health = json.loads(
              (root / "staff-health.json").read_text(encoding="utf-8")
          )
          assert staff_health.get("ok") is True, staff_health
          assert staff_health.get("role") == "staff", staff_health

          staff_today = json.loads(
              (root / "staff-today.json").read_text(encoding="utf-8")
          )
          assert staff_today.get("ok") is True, staff_today
          assert staff_today.get("role") == "staff", staff_today
          assert isinstance(staff_today.get("reservations"), list), staff_today

          admin = json.loads(
              (root / "admin-dashboard.json").read_text(encoding="utf-8")
          )
          assert admin.get("ok") is True, admin
          PY

      - name: Generate role-separated browser files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payloads = {
              "config.js": "",
              "owner-ipad.html": "",
              "staff.html": "",
          }
          for filename, encoded in payloads.items():
              Path(filename).write_bytes(
                  gzip.decompress(base64.b64decode(encoded))
              )
          PY

      - name: Validate HTML JavaScript IDs and role boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-6-verify/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          report = {}
          for filename in ("owner-ipad.html", "staff.html"):
              text = Path(filename).read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)
              duplicates = sorted({
                  value for value in parser.ids
                  if parser.ids.count(value) > 1
              })
              if duplicates:
                  raise SystemExit(f"Duplicate IDs in {filename}: {duplicates}")

              scripts = re.findall(
                  r"<script(?:\s[^>]*)?>(.*?)</script>",
                  text,
                  flags=re.I | re.S,
              )
              inline = [script for script in scripts if script.strip()]
              for index, script in enumerate(inline, 1):
                  Path(
                      f"/tmp/gym-next-6-verify/scripts/"
                      f"{Path(filename).stem}-{index}.js"
                  ).write_text(script, encoding="utf-8")

              report[filename] = {
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "inline_script_count": len(inline),
              }

          Path("/tmp/gym-next-6-verify/html-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          find /tmp/gym-next-6-verify/scripts -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do
              node --check "${script}"
            done

          grep -Fq "demoStaffCode: '5678'" config.js
          grep -Fq "staffPageUrl: 'staff.html'" config.js
          grep -Fq "ownerIpadPageUrl: 'owner-ipad.html'" config.js
          grep -Fq 'data-dpro-role="reception"' owner-ipad.html
          grep -Fq 'data-dpro-role="staff"' staff.html
          grep -Fq '/api/staff/today' owner-ipad.html
          grep -Fq '/api/staff/reservations/status' owner-ipad.html
          grep -Fq '/api/staff/session-records/upsert' staff.html
          grep -Fq '/api/staff/sessions/complete' staff.html
          grep -Fq 'X-Staff-Key' owner-ipad.html
          grep -Fq 'X-Staff-Key' staff.html

          for file in owner-ipad.html staff.html; do
            if grep -Fq '/api/admin/' "${file}"; then
              echo "::error::Admin API reference remains in ${file}"
              exit 1
            fi
            if grep -Fq 'X-Admin-Key' "${file}"; then
              echo "::error::Admin authentication remains in ${file}"
              exit 1
            fi
          done

          if grep -Fq '/api/staff/session-records' owner-ipad.html; then
            echo "::error::Reception page must not edit session records."
            exit 1
          fi
          if grep -Fq 'changeTickets' owner-ipad.html; then
            echo "::error::Reception page must not adjust tickets."
            exit 1
          fi
          if grep -Fq 'prepareDemo' owner-ipad.html; then
            echo "::error::Reception page must not prepare demo data."
            exit 1
          fi

          for marker in \
            '/api/admin/dashboard' \
            '/api/admin/trial-pipeline' \
            '/api/admin/customers/admit' \
            '/api/admin/sessions/complete'
          do
            grep -Fq "${marker}" dashboard.html
          done

      - name: Confirm only intended runtime files changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git status --porcelain=v1 --untracked-files=all |
              sed -E 's/^.. //' |
              sed 's/^"//;s/"$//' |
              grep -v -F -x "${WORKFLOW_FILE}" |
              sed '/^$/d' |
              sort
          )

          EXPECTED=(
            "config.js"
            "owner-ipad.html"
            "staff.html"
          )
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          if [[ "$(printf '%s\n' "${CHANGED[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]]; then
            echo "::error::Unexpected runtime files changed."
            printf 'Changed:\n%s\n' "${CHANGED[*]}"
            exit 1
          fi

          git diff --quiet -- dashboard.html || {
            echo "::error::dashboard.html must remain unchanged."
            exit 1
          }
          git diff --check

      - name: Commit NEXT-6 role-separated screens
        shell: bash
        run: |
          set -euo pipefail
          git add config.js owner-ipad.html staff.html
          git commit -m "Complete GYM-NEXT-6 role-separated screens"

          APPLICATION_COMMIT_SHA="$(git rev-parse HEAD)"
          CONFIG_BLOB="$(git hash-object config.js)"
          IPAD_BLOB="$(git hash-object owner-ipad.html)"
          STAFF_BLOB="$(git hash-object staff.html)"

          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "CONFIG_BLOB=${CONFIG_BLOB}" >> "$GITHUB_ENV"
          echo "IPAD_BLOB=${IPAD_BLOB}" >> "$GITHUB_ENV"
          echo "STAFF_BLOB=${STAFF_BLOB}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify published screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-6-verify/public

          verify_page() {
            local page="$1"
            local marker1="$2"
            local marker2="$3"
            local file="/tmp/gym-next-6-verify/public/${page}"

            for attempt in $(seq 1 24); do
              curl --fail --location --silent --show-error \
                --max-time 30 \
                --output "${file}" \
                "${PUBLIC_BASE}/${page}?verify=${GITHUB_RUN_ID}-${attempt}" || true

              if [[ -s "${file}" ]] &&
                 grep -Fq "${marker1}" "${file}" &&
                 grep -Fq "${marker2}" "${file}"; then
                return 0
              fi
              sleep 10
            done

            echo "::error::Published page did not reach NEXT-6: ${page}"
            exit 1
          }

          verify_page \
            owner-ipad.html \
            'data-dpro-role="reception"' \
            '/api/staff/reservations/status'

          verify_page \
            staff.html \
            'data-dpro-role="staff"' \
            '/api/staff/sessions/complete'

          verify_page \
            config.js \
            "demoStaffCode: '5678'" \
            "staffPageUrl: 'staff.html'"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Staff-Key: 5678" \
            --output /tmp/gym-next-6-verify/public/staff-health.json \
            "${WORKER_BASE}/api/staff/health?public_verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-6-verify/public/staff-health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True
          assert data.get("version") == "GYM-NEXT-6-WORKER-20260725"
          assert data.get("role") == "staff"
          PY

      - name: Record GYM-NEXT-6 completion and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-6-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-6 COMPLETE

          - 結果: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - Supabase変更: なし
          - オーナーPC: 管理コード1234・全体管理
          - iPad受付: スタッフコード5678・受付専用
          - スタッフ画面: スタッフコード5678・セッション専用
          - 会員LINE: 既存機能維持
          - スタッフAPI認証: OK
          - 管理コードとスタッフコードの分離: OK
          - 電話番号・LINE ID・内部管理情報のスタッフ表示: なし
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-6-COMPLETE"
          workflow_revision: "R1"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          config_blob: "${CONFIG_BLOB}"
          dashboard_blob: "538199c142e44d4ee03953d29359c1b341c4ca28"
          owner_ipad_blob: "${IPAD_BLOB}"
          staff_blob: "${STAFF_BLOB}"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_deployed: true
          supabase_changed: false
          runtime_files_changed: true
          worker_changed: true
          api_changed: true
          changed_files:
            - "config.js"
            - "owner-ipad.html"
            - "staff.html"
          roles:
            owner_pc:
              authentication: "ADMIN_TOKEN / 1234 demo"
              purpose: "全体管理・設定・入会・プラン"
            owner_ipad:
              authentication: "STAFF_TOKEN / 5678 demo"
              purpose: "来店受付・予約進行・簡易会員確認"
            staff:
              authentication: "STAFF_TOKEN / 5678 demo"
              purpose: "担当セッション・注意事項・記録・完了"
            member_line:
              authentication: "LINE"
              purpose: "予約・変更依頼・履歴"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            worker_health: "OK"
            staff_token: "OK"
            staff_api_authorized: "OK"
            staff_api_no_key_rejected: "OK"
            admin_code_as_staff_rejected: "OK"
            admin_api_preserved: "OK"
            next4_preserved: "OK"
            next5_preserved: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            role_boundary: "OK"
            public_ipad: "OK"
            public_staff: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-6 completion"
          git push origin HEAD:main

      - name: Upload NEXT-6 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-6-completion
          path: |
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-6-COMPLETE.md
            /tmp/gym-next-6-verify/health.json
            /tmp/gym-next-6-verify/staff-health.json
            /tmp/gym-next-6-verify/staff-today.json
            /tmp/gym-next-6-verify/html-report.json
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-6 COMPLETE"
            echo ""
            echo "- Worker: \`${EXPECTED_WORKER_VERSION}\`"
            echo "- iPad reception role: \`OK\`"
            echo "- Staff screen: \`OK\`"
            echo "- Admin/staff authentication separation: \`OK\`"
            echo "- Supabase change: \`false\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
