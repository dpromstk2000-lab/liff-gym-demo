name: STEP GYM-NEXT-8-VERIFY - Retention Follow-up Board UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-8-VERIFY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-8-verify-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-8-VERIFY
  CURRENT_STEP_REQUIRED: GYM-NEXT-8-PREPARED
  NEXT_STEP: GYM-NEXT-9
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-8-VERIFY.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-8-verify-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-8-WORKER-R2-20260725
  PATCH_SCRIPT_B64: ""

jobs:
  verify-and-complete:
    name: Verify R2 Worker and publish follow-up board
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm R2 prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP_IN_LEDGER="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          REVISION="$(
            sed -n 's/^workflow_revision:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP_IN_LEDGER}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP_IN_LEDGER}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Expected PREPARED, got ${RESULT}"
            exit 1
          }
          [[ "${REVISION}" == "R2" ]] || {
            echo "::error::Expected Worker preparation revision R2."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-VERIFY version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム before GYM-NEXT-8-VERIFY"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected runtime and package baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 6ea48136d70e328366a8584ebecaa55562372d20
          check_blob member.html ed7e59d0a1101adfd328e24e1eb09a8f62a41aca
          check_blob dashboard.html 538199c142e44d4ee03953d29359c1b341c4ca28
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob dpro-next/gym/deploy/GYM-NEXT-8/worker.js f0a0d7c0645bfc79fcf2756f24f224322ad2000d

      - name: Verify deployed R2 Worker and follow-up API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-8-verify

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-8-verify/health.json             "${WORKER_BASE}/api/health?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             --output /tmp/gym-next-8-verify/follow-ups.json             "${WORKER_BASE}/api/admin/follow-ups?facility_code=dpro_gym_demo&date=$(TZ=Asia/Tokyo date +%F)&verify=${GITHUB_RUN_ID}"

          INVALID_STATUS="$(
            curl --location --silent --show-error               --max-time 30               --output /tmp/gym-next-8-verify/invalid-action.json               --write-out '%{http_code}'               -H "Content-Type: application/json"               -H "X-Admin-Key: 1234"               --data '{"facility_code":"dpro_gym_demo"}'               "${WORKER_BASE}/api/admin/follow-ups/action"
          )"
          [[ "${INVALID_STATUS}" == "400" ]] || {
            echo "::error::Invalid follow-up action returned ${INVALID_STATUS}, expected 400."
            exit 1
          }

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-8-verify")
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          assert health.get("ok") is True, health
          assert health.get("version") == "GYM-NEXT-8-WORKER-R2-20260725", health
          assert health.get("next4", {}).get("ok") is True, health
          assert health.get("next5", {}).get("ok") is True, health
          next8 = health.get("next8", {})
          assert next8.get("ok") is True, health
          assert next8.get("snooze_guard") is True, health
          assert next8.get("recent_done_guard") is True, health
          features = health.get("features", {})
          assert features.get("follow_up_board") is True, health
          assert features.get("follow_up_prioritization") is True, health
          assert features.get("follow_up_action_log") is True, health
          assert features.get("follow_up_message_copy_only") is True, health
          assert features.get("follow_up_snooze_guard") is True, health
          assert features.get("follow_up_recent_done_guard") is True, health
          assert features.get("automatic_line_broadcast") is False, health
          assert features.get("member_session_history") is True, health
          assert features.get("role_separation") is True, health

          follow = json.loads(
              (root / "follow-ups.json").read_text(encoding="utf-8")
          )
          assert follow.get("ok") is True, follow
          assert isinstance(follow.get("follow_ups"), list), follow
          assert isinstance(follow.get("counts"), dict), follow
          assert follow.get("automatic_line_send") is False, follow
          assert follow.get("message_delivery") == "copy_only", follow

          for row in follow.get("follow_ups", []):
              assert row.get("priority") in {"urgent", "today", "follow"}, row
              assert isinstance(row.get("reasons"), list), row
              assert row.get("message_delivery") == "copy_only", row
          PY

      - name: Apply NEXT-8 follow-up board UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-8-verify
          printf '%s' "${PATCH_SCRIPT_B64}" |
            base64 --decode > /tmp/gym-next-8-verify/apply_patch.py
          python3 -m py_compile /tmp/gym-next-8-verify/apply_patch.py
          python3 /tmp/gym-next-8-verify/apply_patch.py

      - name: Validate dashboard HTML JavaScript and safety rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-8-verify/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          text = Path("dashboard.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(text)
          duplicates = sorted({
              value for value in parser.ids
              if parser.ids.count(value) > 1
          })
          if duplicates:
              raise SystemExit(f"Duplicate IDs: {duplicates}")

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.I | re.S,
          )
          inline = [script for script in scripts if script.strip()]
          for index, script in enumerate(inline, 1):
              Path(
                  f"/tmp/gym-next-8-verify/scripts/dashboard-{index}.js"
              ).write_text(script, encoding="utf-8")

          Path("/tmp/gym-next-8-verify/html-report.json").write_text(
              json.dumps({
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "inline_script_count": len(inline),
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          find /tmp/gym-next-8-verify/scripts             -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do
              node --check "${script}"
            done

          require_text() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq -- "${marker}" dashboard.html; then
              echo "::error file=dashboard.html::Missing ${label}: ${marker}"
              exit 1
            fi
          }

          forbid_text() {
            local marker="$1"
            local label="$2"
            if grep -Fq -- "${marker}" dashboard.html; then
              echo "::error file=dashboard.html::Forbidden ${label}: ${marker}"
              exit 1
            fi
          }

          require_text 'data-dpro-next-step="GYM-NEXT-8"'             "NEXT-8 body marker"
          require_text 'data-view="followups"'             "follow-up navigation"
          require_text 'id="view-followups"'             "follow-up view"
          require_text 'id="followUpQuery"'             "follow-up search"
          require_text 'id="followUpReason"'             "reason filter"
          require_text 'id="followUpPriority"'             "priority filter"
          require_text 'function loadFollowUps'             "follow-up loader"
          require_text 'function followUpCard'             "follow-up card renderer"
          require_text 'function openFollowMessage'             "copy-only LINE message"
          require_text 'function followUpAction'             "follow-up action recorder"
          require_text '/api/admin/follow-ups?'             "follow-up list API"
          require_text '/api/admin/follow-ups/action'             "follow-up action API"
          require_text "action==='done'"             "completed confirmation"
          require_text "'snooze_3'"             "three-day snooze"
          require_text "'snooze_7'"             "seven-day snooze"
          require_text "data.automatic_line_send!==false"             "automatic send safety check"
          require_text 'copyMessageText()'             "existing copy function"

          forbid_text '/api/admin/line/broadcast'             "LINE broadcast endpoint"
          forbid_text '/api/admin/line/push'             "LINE push endpoint"
          forbid_text 'sendLineBroadcast('             "LINE broadcast function"
          forbid_text 'sendLinePush('             "LINE push function"

          for marker in             '/api/admin/dashboard'             '/api/admin/reservations'             '/api/admin/customers'             '/api/admin/trial-pipeline'             '/api/admin/customers/admit'             '/api/admin/sessions/complete'             '/api/admin/settings'             '/api/admin/activity-logs'
          do
            require_text "${marker}" "existing owner API"
          done

      - name: Confirm only dashboard changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only |
              sed '/^$/d' |
              sort
          )

          [[ "$(printf '%s\n' "${CHANGED[@]}")" == "dashboard.html" ]] || {
            echo "::error::Unexpected application files changed."
            printf 'Changed:\n%s\n' "${CHANGED[*]}"
            exit 1
          }

          for file in             config.js index.html member.html owner-ipad.html             staff.html system-check.html
          do
            git diff --quiet -- "${file}" || {
              echo "::error::Unexpected runtime change: ${file}"
              exit 1
            }
          done
          git diff --check

      - name: Commit NEXT-8 follow-up board
        shell: bash
        run: |
          set -euo pipefail
          git add dashboard.html
          git commit -m "Complete GYM-NEXT-8 retention follow-up board"

          APPLICATION_COMMIT_SHA="$(git rev-parse HEAD)"
          DASHBOARD_BLOB="$(git hash-object dashboard.html)"

          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "DASHBOARD_BLOB=${DASHBOARD_BLOB}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify published board
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-8-verify/public
          FILE=/tmp/gym-next-8-verify/public/dashboard.html

          for attempt in $(seq 1 24); do
            curl --fail --location --silent --show-error               --max-time 30               --output "${FILE}"               "${PUBLIC_BASE}/dashboard.html?verify=${GITHUB_RUN_ID}-${attempt}" || true

            if [[ -s "${FILE}" ]] &&
               grep -Fq 'data-dpro-next-step="GYM-NEXT-8"' "${FILE}" &&
               grep -Fq 'id="view-followups"' "${FILE}" &&
               grep -Fq '/api/admin/follow-ups/action' "${FILE}"; then
              break
            fi

            if [[ "${attempt}" == "24" ]]; then
              echo "::error::Published dashboard did not reach NEXT-8."
              exit 1
            fi
            sleep 10
          done

          if grep -Fq '/api/admin/line/broadcast' "${FILE}" ||
             grep -Fq '/api/admin/line/push' "${FILE}"; then
            echo "::error::Published dashboard contains automatic LINE API."
            exit 1
          fi

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             --output /tmp/gym-next-8-verify/public/follow-ups.json             "${WORKER_BASE}/api/admin/follow-ups?facility_code=dpro_gym_demo&date=$(TZ=Asia/Tokyo date +%F)&public_verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-8-verify/public/follow-ups.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("automatic_line_send") is False, data
          assert data.get("message_delivery") == "copy_only", data
          PY

      - name: Record GYM-NEXT-8 completion and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-8-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-8 COMPLETE

          - 結果: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - Worker修正版: R2
          - Supabase変更: なし
          - 継続フォロー専用画面: OK
          - 緊急・本日・今後の優先表示: OK
          - 理由・優先度・会員検索: OK
          - 個別LINE文面コピー: OK
          - 3日後・7日後の延期: OK
          - 対応済み履歴: OK
          - 延期中の再表示防止: OK
          - 対応済み後7日間の再表示防止: OK
          - LINE自動送信・一斉送信: なし
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-8-COMPLETE"
          workflow_revision: "R2"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          dashboard_blob: "${DASHBOARD_BLOB}"
          config_blob: "68028432d9177a907e1e91e81c316b47b8845147"
          index_blob: "6ea48136d70e328366a8584ebecaa55562372d20"
          member_blob: "ed7e59d0a1101adfd328e24e1eb09a8f62a41aca"
          owner_ipad_blob: "3b94e5221ec26ec74d8e1fe4e4e41285ee27c792"
          staff_blob: "59e66cb480aa5795c646ab99a1ff71070013ad26"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_deployed: true
          supabase_changed: false
          runtime_files_changed: true
          worker_changed: true
          api_changed: true
          changed_files:
            - "dashboard.html"
          completed_features:
            follow_up_board: true
            follow_up_prioritization: true
            follow_up_action_log: true
            follow_up_message_copy_only: true
            follow_up_snooze_guard: true
            follow_up_recent_done_guard: true
            automatic_line_broadcast: false
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            worker_health: "OK"
            follow_up_api: "OK"
            invalid_action_guard: "OK"
            next4_preserved: "OK"
            next5_preserved: "OK"
            member_history_preserved: "OK"
            role_separation_preserved: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            existing_owner_api: "OK"
            automatic_line_send_absent: "OK"
            public_dashboard: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-8 completion"
          git push origin HEAD:main

      - name: Upload NEXT-8 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-8-completion
          path: |
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-8-COMPLETE.md
            /tmp/gym-next-8-verify/health.json
            /tmp/gym-next-8-verify/follow-ups.json
            /tmp/gym-next-8-verify/html-report.json
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-8 COMPLETE"
            echo ""
            echo "- Worker: \`${EXPECTED_WORKER_VERSION}\`"
            echo "- Retention follow-up board: \`OK\`"
            echo "- Snooze and recent-done guards: \`OK\`"
            echo "- LINE delivery: \`copy_only\`"
            echo "- Automatic/bulk LINE send: \`false\`"
            echo "- Supabase change: \`false\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
