name: STEP GYM-NEXT-9-VERIFY-R3 - Recover Public File Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-9-VERIFY-R3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-9-verify-r3-main
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-9-VERIFY-R3.yml
  STALE_WORKFLOW_FILE: .github/workflows/GYM-NEXT-9-VERIFY-R2.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-9-verify-r3-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-9-WORKER-R2-20260725
  EXPECTED_WORKER_SHA256: 9405f4c300f2d73cdf77606dcb33dfa8b5c9afb7e5ca247a445e0b25d4d2439f

jobs:
  recover-and-complete:
    name: Verify corrected iPad marker and complete NEXT-9
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm recoverable NEXT-9 state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"
          test -f "${STALE_WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          REVISION="$(
            sed -n 's/^workflow_revision:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          EXPECTED_VERSION_IN_LEDGER="$(
            sed -n 's/^expected_worker_version:[[:space:]]*//p' \
              "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "GYM-NEXT-9-PREPARED" ]] || {
            echo "::error::Expected GYM-NEXT-9-PREPARED, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "GYM-NEXT-9-VERIFY-R2" ]] || {
            echo "::error::Expected failed VERIFY-R2 state, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Expected PREPARED, got ${RESULT}"
            exit 1
          }
          [[ "${REVISION}" == "R2" ]] || {
            echo "::error::Expected Worker revision R2."
            exit 1
          }
          [[ "${EXPECTED_VERSION_IN_LEDGER}" == "${EXPECTED_WORKER_VERSION}" ]] || {
            echo "::error::Prepared Worker version does not match R2."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          echo "STEP_BASE_SHA=${UPLOAD_PARENT}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect current recovery point
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "DPRO パーソナルジム before NEXT-9 VERIFY R3 recovery"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify committed runtime and R2 Worker baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 6ea48136d70e328366a8584ebecaa55562372d20
          check_blob member.html ed7e59d0a1101adfd328e24e1eb09a8f62a41aca
          check_blob dashboard.html cbb1f028442946c0ba2fd69eedc90de844eae68c
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob system-check.html 8d37b43caec090e42593d8ebc088bd9aff06131a
          check_blob dpro-next/gym/deploy/GYM-NEXT-9/worker.js d2c6c6cebfe54592ac1d4f410dd77e20c467a405

          ACTUAL_WORKER_SHA="$(
            sha256sum dpro-next/gym/deploy/GYM-NEXT-9/worker.js |
              awk '{print $1}'
          )"
          [[ "${ACTUAL_WORKER_SHA}" == "${EXPECTED_WORKER_SHA256}" ]] || {
            echo "::error::Stored Worker SHA-256 mismatch."
            exit 1
          }

          grep -Fq 'data-dpro-next-step="GYM-NEXT-9"' system-check.html
          grep -Fq 'GYM-NEXT-9-WORKER-R2-20260725' system-check.html
          grep -Fq '/api/admin/next-9-system-check' system-check.html
          grep -Fq 'adminQueryStatus === 401' system-check.html
          grep -Fq 'staffQueryStatus === 401' system-check.html
          grep -Fq 'plainTextStatus === 415' system-check.html
          grep -Fq 'oversizedStatus === 413' system-check.html

          # iPad受付はNEXT-6以降スタッフ権限。管理APIを要求しない。
          grep -Fq 'data-dpro-role="reception"' owner-ipad.html
          grep -Fq '/api/staff/today' owner-ipad.html
          if grep -Fq '/api/admin/reservations' owner-ipad.html; then
            echo "::error::owner-ipad.html unexpectedly uses the admin reservation API."
            exit 1
          fi

          APPLICATION_COMMIT_SHA="$(
            git log -1 --format=%H -- system-check.html
          )"
          SYSTEM_CHECK_BLOB="$(git hash-object system-check.html)"
          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "SYSTEM_CHECK_BLOB=${SYSTEM_CHECK_BLOB}" >> "$GITHUB_ENV"

      - name: Reverify deployed R2 Worker and security contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-9-r3

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -D /tmp/gym-next-9-r3/health-headers.txt \
            -o /tmp/gym-next-9-r3/health.json \
            "${WORKER_BASE}/api/health?r3=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Admin-Key: 1234" \
            -o /tmp/gym-next-9-r3/next9.json \
            "${WORKER_BASE}/api/admin/next-9-system-check?facility_code=dpro_gym_demo&r3=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-Staff-Key: 5678" \
            -o /tmp/gym-next-9-r3/staff-health.json \
            "${WORKER_BASE}/api/staff/health?r3=${GITHUB_RUN_ID}"

          ADMIN_QUERY_STATUS="$(
            curl --location --silent --show-error \
              --max-time 30 \
              -o /tmp/gym-next-9-r3/admin-query.json \
              -w '%{http_code}' \
              "${WORKER_BASE}/api/admin/next-9-system-check?facility_code=dpro_gym_demo&admin_key=1234"
          )"
          [[ "${ADMIN_QUERY_STATUS}" == "401" ]] || {
            echo "::error::URL admin authentication returned ${ADMIN_QUERY_STATUS}, expected 401."
            exit 1
          }

          STAFF_QUERY_STATUS="$(
            curl --location --silent --show-error \
              --max-time 30 \
              -o /tmp/gym-next-9-r3/staff-query.json \
              -w '%{http_code}' \
              "${WORKER_BASE}/api/staff/health?staff_key=5678"
          )"
          [[ "${STAFF_QUERY_STATUS}" == "401" ]] || {
            echo "::error::URL staff authentication returned ${STAFF_QUERY_STATUS}, expected 401."
            exit 1
          }

          PLAIN_STATUS="$(
            curl --location --silent --show-error \
              --max-time 30 \
              -o /tmp/gym-next-9-r3/plain.json \
              -w '%{http_code}' \
              -H "X-Admin-Key: 1234" \
              -H "Content-Type: text/plain" \
              --data '{}' \
              "${WORKER_BASE}/api/admin/follow-ups/action"
          )"
          [[ "${PLAIN_STATUS}" == "415" ]] || {
            echo "::error::Non-JSON request returned ${PLAIN_STATUS}, expected 415."
            exit 1
          }

          python3 <<'PY'
          import json
          from pathlib import Path

          Path("/tmp/gym-next-9-r3/oversized.json").write_text(
              json.dumps({"padding": "x" * (70 * 1024)}),
              encoding="utf-8",
          )
          PY

          OVERSIZE_STATUS="$(
            curl --location --silent --show-error \
              --max-time 30 \
              -o /tmp/gym-next-9-r3/oversize-response.json \
              -w '%{http_code}' \
              -H "X-Admin-Key: 1234" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/gym-next-9-r3/oversized.json \
              "${WORKER_BASE}/api/admin/follow-ups/action"
          )"
          [[ "${OVERSIZE_STATUS}" == "413" ]] || {
            echo "::error::Oversized request returned ${OVERSIZE_STATUS}, expected 413."
            exit 1
          }

          tr -d '\r' < /tmp/gym-next-9-r3/health-headers.txt \
            > /tmp/gym-next-9-r3/health-headers-normalized.txt

          require_header() {
            local pattern="$1"
            local label="$2"
            if ! grep -Eiq "${pattern}" \
                 /tmp/gym-next-9-r3/health-headers-normalized.txt; then
              echo "::error::Missing security header: ${label}"
              exit 1
            fi
          }

          require_header '^cache-control:.*no-store' 'Cache-Control no-store'
          require_header '^x-content-type-options:[[:space:]]*nosniff' 'X-Content-Type-Options nosniff'
          require_header '^x-frame-options:[[:space:]]*DENY' 'X-Frame-Options DENY'
          require_header '^referrer-policy:[[:space:]]*no-referrer' 'Referrer-Policy no-referrer'
          require_header '^strict-transport-security:' 'Strict-Transport-Security'

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-9-r3")

          health_text = (root / "health.json").read_text(encoding="utf-8")
          assert "\n" not in health_text, "Health JSON is not compact."
          assert len(health_text.encode("utf-8")) < 12000, len(health_text)

          health = json.loads(health_text)
          assert health.get("ok") is True, health
          assert health.get("version") == "GYM-NEXT-9-WORKER-R2-20260725", health
          assert health.get("next4", {}).get("ok") is True, health
          assert health.get("next5", {}).get("ok") is True, health
          assert health.get("next8", {}).get("ok") is True, health
          next9 = health.get("next9", {})
          assert next9.get("ok") is True, health
          assert next9.get("resilient_optional_probes") is True, health
          assert next9.get("max_json_body_bytes") == 65536, health

          features = health.get("features", {})
          assert features.get("security_headers") is True, health
          assert features.get("query_string_auth_disabled") is True, health
          assert features.get("request_body_limit") is True, health
          assert features.get("compact_json_payload") is True, health
          assert features.get("integrated_system_check") is True, health
          assert features.get("resilient_optional_system_probes") is True, health
          assert features.get("automatic_line_broadcast") is False, health
          assert features.get("member_session_history") is True, health
          assert features.get("role_separation") is True, health

          integrated = json.loads(
              (root / "next9.json").read_text(encoding="utf-8")
          )
          assert integrated.get("ok") is True, integrated
          assert integrated.get("elapsed_ms", 999999) <= 5000, integrated
          assert all(
              item.get("ok") is True
              for item in integrated.get("checks", [])
          ), integrated

          activity = next(
              (
                  item for item in integrated.get("checks", [])
                  if item.get("id") == "next9_activity_log"
              ),
              None,
          )
          assert activity and activity.get("ok") is True, integrated
          assert "action_type" not in str(activity.get("detail", "")), integrated

          parallel = next(
              (
                  item for item in integrated.get("checks", [])
                  if item.get("id") == "next9_database_parallel"
              ),
              None,
          )
          assert parallel and parallel.get("ok") is True, integrated
          assert "重要6系統" in str(parallel.get("detail", "")), integrated

          performance = integrated.get("performance", {})
          assert performance.get("public_payload_bytes", 999999999) <= 131072, integrated

          staff = json.loads(
              (root / "staff-health.json").read_text(encoding="utf-8")
          )
          assert staff.get("ok") is True, staff
          assert staff.get("role") == "staff", staff
          PY

      - name: Validate committed system-check HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-9-r3/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          text = Path("system-check.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(text)

          duplicates = sorted({
              value for value in parser.ids
              if parser.ids.count(value) > 1
          })
          if duplicates:
              raise SystemExit(f"Duplicate IDs: {duplicates}")

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.I | re.S,
          )
          inline = [script for script in scripts if script.strip()]
          for index, script in enumerate(inline, 1):
              Path(
                  f"/tmp/gym-next-9-r3/scripts/system-check-{index}.js"
              ).write_text(script, encoding="utf-8")

          Path("/tmp/gym-next-9-r3/html-report.json").write_text(
              json.dumps({
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "inline_script_count": len(inline),
                  "file_bytes": len(text.encode("utf-8")),
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          find /tmp/gym-next-9-r3/scripts \
            -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do
              node --check "${script}"
            done

          FILE_BYTES="$(wc -c < system-check.html | tr -d ' ')"
          [[ "${FILE_BYTES}" -le 120000 ]] || {
            echo "::error::system-check.html exceeds 120KB: ${FILE_BYTES}"
            exit 1
          }

          git diff --quiet -- config.js
          git diff --quiet -- index.html
          git diff --quiet -- member.html
          git diff --quiet -- dashboard.html
          git diff --quiet -- owner-ipad.html
          git diff --quiet -- staff.html
          git diff --quiet -- system-check.html
          git diff --check

      - name: Verify GitHub Pages with corrected role markers
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR=/tmp/gym-next-9-r3/public
          mkdir -p "${PUBLIC_DIR}"
          : > "${PUBLIC_DIR}/file-sizes.csv"

          SYSTEM_FILE="${PUBLIC_DIR}/system-check.html"
          for attempt in $(seq 1 18); do
            curl --fail --location --silent --show-error \
              --max-time 30 \
              -o "${SYSTEM_FILE}" \
              "${PUBLIC_BASE}/system-check.html?r3=${GITHUB_RUN_ID}-${attempt}" || true

            if [[ -s "${SYSTEM_FILE}" ]] &&
               grep -Fq 'data-dpro-next-step="GYM-NEXT-9"' "${SYSTEM_FILE}" &&
               grep -Fq 'GYM-NEXT-9-WORKER-R2-20260725' "${SYSTEM_FILE}"; then
              break
            fi

            if [[ "${attempt}" == "18" ]]; then
              echo "::error::Published system-check.html did not reach NEXT-9 R2."
              exit 1
            fi
            sleep 8
          done

          download_page() {
            local page="$1"
            local max_bytes="$2"
            local file="${PUBLIC_DIR}/${page}"

            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 30 \
              -o "${file}" \
              "${PUBLIC_BASE}/${page}?r3=${GITHUB_RUN_ID}"

            local bytes
            bytes="$(wc -c < "${file}" | tr -d ' ')"
            [[ "${bytes}" -le "${max_bytes}" ]] || {
              echo "::error::${page} exceeds ${max_bytes} bytes: ${bytes}"
              exit 1
            }
            printf '%s,%s\n' "${page}" "${bytes}" \
              >> "${PUBLIC_DIR}/file-sizes.csv"
          }

          download_page index.html 120000
          download_page member.html 120000
          download_page dashboard.html 160000
          download_page owner-ipad.html 120000
          download_page staff.html 120000
          download_page config.js 20000

          grep -Fq '/api/public/reservations' "${PUBLIC_DIR}/index.html"
          grep -Fq 'id="sessionHistoryList"' "${PUBLIC_DIR}/member.html"
          grep -Fq 'id="view-followups"' "${PUBLIC_DIR}/dashboard.html"

          # Correct role-separated iPad contract.
          grep -Fq 'data-dpro-role="reception"' "${PUBLIC_DIR}/owner-ipad.html"
          grep -Fq '/api/staff/today' "${PUBLIC_DIR}/owner-ipad.html"
          if grep -Fq '/api/admin/reservations' "${PUBLIC_DIR}/owner-ipad.html"; then
            echo "::error::Published owner-ipad.html still uses an admin reservation API."
            exit 1
          fi

          grep -Fq '/api/staff/today' "${PUBLIC_DIR}/staff.html"
          grep -Fq 'GYM-NEXT-6-CONFIG-ROLE-SEPARATION-20260725' \
            "${PUBLIC_DIR}/config.js"

          SYSTEM_BYTES="$(wc -c < "${SYSTEM_FILE}" | tr -d ' ')"
          [[ "${SYSTEM_BYTES}" -le 120000 ]] || {
            echo "::error::system-check.html exceeds 120000 bytes: ${SYSTEM_BYTES}"
            exit 1
          }
          printf 'system-check.html,%s\n' "${SYSTEM_BYTES}" \
            >> "${PUBLIC_DIR}/file-sizes.csv"

      - name: Create NEXT-9 completion records
        shell: bash
        run: |
          set -euo pipefail
          export COMPLETED_AT="$(
            TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z'
          )"

          cat > "${STEP_DIR}/GYM-NEXT-9-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-9 COMPLETE

          - 結果: OK
          - VERIFY修正版: R3
          - Worker修正版: R2
          - Worker: ${EXPECTED_WORKER_VERSION}
          - system-check.html公開: OK
          - iPad受付の正しい公開確認: /api/staff/today
          - 誤った管理API確認条件: 削除
          - 操作履歴列action: OK
          - 補助ログ検査の分離: OK
          - 管理・スタッフ認証: HTTPヘッダー限定
          - URL認証: 401で拒否
          - JSON以外: 415で拒否
          - 64KB超過: 413で拒否
          - セキュリティヘッダー: OK
          - compact JSON: OK
          - 統合system-check: OK
          - 公開ファイル容量: OK
          - NEXT-4・5・8維持: OK
          - LINE自動・一斉送信: なし
          - Supabase変更: なし
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-9-COMPLETE"
          workflow_revision: "R3"
          worker_revision: "R2"
          next_step: "GYM-NEXT-10"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          system_check_blob: "${SYSTEM_CHECK_BLOB}"
          config_blob: "68028432d9177a907e1e91e81c316b47b8845147"
          index_blob: "6ea48136d70e328366a8584ebecaa55562372d20"
          member_blob: "ed7e59d0a1101adfd328e24e1eb09a8f62a41aca"
          dashboard_blob: "cbb1f028442946c0ba2fd69eedc90de844eae68c"
          owner_ipad_blob: "3b94e5221ec26ec74d8e1fe4e4e41285ee27c792"
          staff_blob: "59e66cb480aa5795c646ab99a1ff71070013ad26"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_sha256: "${EXPECTED_WORKER_SHA256}"
          worker_deployed: true
          supabase_changed: false
          runtime_files_changed: true
          worker_changed: true
          api_changed: true
          changed_files:
            - "system-check.html"
          completed_features:
            security_headers: true
            query_string_auth_disabled: true
            request_body_limit: true
            json_content_type_required: true
            compact_json_payload: true
            integrated_system_check: true
            resilient_optional_system_probes: true
            performance_budget_check: true
            public_payload_budget_check: true
            automatic_line_broadcast: false
          recovery:
            failed_verify_revision: "R2"
            failed_run_url: "https://github.com/dpromstk2000-lab/liff-gym-demo/actions/runs/30162210349"
            failure_reason: "owner-ipad.htmlを旧管理API文字列で確認していた"
