name: STEP GYM-NEXT-9-VERIFY - Security Performance System Check UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-9-VERIFY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-9-verify-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-9-VERIFY
  CURRENT_STEP_REQUIRED: GYM-NEXT-9-PREPARED
  NEXT_STEP: GYM-NEXT-10
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-9-VERIFY.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-9-verify-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-9-WORKER-20260725
  EXPECTED_WORKER_SHA256: d1f62c3d88b67df0488848ad8d29ba5cc3a0493669993cc386e7ad5d49832dbb

jobs:
  verify-and-complete:
    name: Verify security Worker and publish integrated system-check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-9 prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP_IN_LEDGER="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          EXPECTED_VERSION_IN_LEDGER="$(
            sed -n 's/^expected_worker_version:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP_IN_LEDGER}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP_IN_LEDGER}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Expected PREPARED, got ${RESULT}"
            exit 1
          }
          [[ "${EXPECTED_VERSION_IN_LEDGER}" == "${EXPECTED_WORKER_VERSION}" ]] || {
            echo "::error::Prepared Worker version does not match."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-VERIFY version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム before GYM-NEXT-9-VERIFY"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected runtime and Worker baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 68028432d9177a907e1e91e81c316b47b8845147
          check_blob index.html 6ea48136d70e328366a8584ebecaa55562372d20
          check_blob member.html ed7e59d0a1101adfd328e24e1eb09a8f62a41aca
          check_blob dashboard.html cbb1f028442946c0ba2fd69eedc90de844eae68c
          check_blob owner-ipad.html 3b94e5221ec26ec74d8e1fe4e4e41285ee27c792
          check_blob staff.html 59e66cb480aa5795c646ab99a1ff71070013ad26
          check_blob system-check.html 278a6e803a87e4e334d2f5d8ad2e33bab080ca0a
          check_blob dpro-next/gym/deploy/GYM-NEXT-9/worker.js 328624a9bfc3d85d9d8d962eb9d59aa9f156afcd

          ACTUAL_WORKER_SHA="$(
            sha256sum dpro-next/gym/deploy/GYM-NEXT-9/worker.js |
              awk '{print $1}'
          )"
          [[ "${ACTUAL_WORKER_SHA}" == "${EXPECTED_WORKER_SHA256}" ]] || {
            echo "::error::Stored Worker SHA-256 mismatch."
            exit 1
          }

      - name: Verify deployed Worker security and integrated system-check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-9-verify

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -D /tmp/gym-next-9-verify/health-headers.txt             -o /tmp/gym-next-9-verify/health.json             "${WORKER_BASE}/api/health?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             -o /tmp/gym-next-9-verify/next9.json             "${WORKER_BASE}/api/admin/next-9-system-check?facility_code=dpro_gym_demo&verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             -o /tmp/gym-next-9-verify/legacy-system.json             "${WORKER_BASE}/api/admin/system-check?facility_code=dpro_gym_demo&verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Staff-Key: 5678"             -o /tmp/gym-next-9-verify/staff-health.json             "${WORKER_BASE}/api/staff/health?verify=${GITHUB_RUN_ID}"

          ADMIN_QUERY_STATUS="$(
            curl --location --silent --show-error               --max-time 30               -o /tmp/gym-next-9-verify/admin-query.json               -w '%{http_code}'               "${WORKER_BASE}/api/admin/next-9-system-check?facility_code=dpro_gym_demo&admin_key=1234"
          )"
          [[ "${ADMIN_QUERY_STATUS}" == "401" ]] || {
            echo "::error::URL admin authentication returned ${ADMIN_QUERY_STATUS}, expected 401."
            exit 1
          }

          STAFF_QUERY_STATUS="$(
            curl --location --silent --show-error               --max-time 30               -o /tmp/gym-next-9-verify/staff-query.json               -w '%{http_code}'               "${WORKER_BASE}/api/staff/health?staff_key=5678"
          )"
          [[ "${STAFF_QUERY_STATUS}" == "401" ]] || {
            echo "::error::URL staff authentication returned ${STAFF_QUERY_STATUS}, expected 401."
            exit 1
          }

          PLAIN_STATUS="$(
            curl --location --silent --show-error               --max-time 30               -o /tmp/gym-next-9-verify/plain.json               -w '%{http_code}'               -H "X-Admin-Key: 1234"               -H "Content-Type: text/plain"               --data '{}'               "${WORKER_BASE}/api/admin/follow-ups/action"
          )"
          [[ "${PLAIN_STATUS}" == "415" ]] || {
            echo "::error::Non-JSON request returned ${PLAIN_STATUS}, expected 415."
            exit 1
          }

          python3 <<'PY'
          import json
          from pathlib import Path

          Path("/tmp/gym-next-9-verify/oversized.json").write_text(
              json.dumps({"padding": "x" * (70 * 1024)}),
              encoding="utf-8",
          )
          PY

          OVERSIZE_STATUS="$(
            curl --location --silent --show-error               --max-time 30               -o /tmp/gym-next-9-verify/oversize-response.json               -w '%{http_code}'               -H "X-Admin-Key: 1234"               -H "Content-Type: application/json"               --data-binary @/tmp/gym-next-9-verify/oversized.json               "${WORKER_BASE}/api/admin/follow-ups/action"
          )"
          [[ "${OVERSIZE_STATUS}" == "413" ]] || {
            echo "::error::Oversized request returned ${OVERSIZE_STATUS}, expected 413."
            exit 1
          }

          tr -d '\r' < /tmp/gym-next-9-verify/health-headers.txt             > /tmp/gym-next-9-verify/health-headers-normalized.txt

          require_header() {
            local pattern="$1"
            local label="$2"
            if ! grep -Eiq "${pattern}"                  /tmp/gym-next-9-verify/health-headers-normalized.txt; then
              echo "::error::Missing security header: ${label}"
              exit 1
            fi
          }

          require_header '^cache-control:.*no-store' 'Cache-Control no-store'
          require_header '^x-content-type-options:[[:space:]]*nosniff' 'X-Content-Type-Options nosniff'
          require_header '^x-frame-options:[[:space:]]*DENY' 'X-Frame-Options DENY'
          require_header '^referrer-policy:[[:space:]]*no-referrer' 'Referrer-Policy no-referrer'
          require_header '^strict-transport-security:' 'Strict-Transport-Security'

          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/gym-next-9-verify")

          health_text = (root / "health.json").read_text(encoding="utf-8")
          assert "\n" not in health_text, "Health JSON is not compact."
          assert len(health_text.encode("utf-8")) < 12000, len(health_text)

          health = json.loads(health_text)
          assert health.get("ok") is True, health
          assert health.get("version") == "GYM-NEXT-9-WORKER-20260725", health
          assert health.get("next4", {}).get("ok") is True, health
          assert health.get("next5", {}).get("ok") is True, health
          assert health.get("next8", {}).get("ok") is True, health
          next9 = health.get("next9", {})
          assert next9.get("ok") is True, health
          assert next9.get("security_headers") is True, health
          assert next9.get("query_auth_disabled") is True, health
          assert next9.get("request_body_limit") is True, health
          assert next9.get("compact_json") is True, health
          assert next9.get("integrated_system_check") is True, health
          assert next9.get("max_json_body_bytes") == 65536, health

          features = health.get("features", {})
          assert features.get("security_headers") is True, health
          assert features.get("query_string_auth_disabled") is True, health
          assert features.get("request_body_limit") is True, health
          assert features.get("compact_json_payload") is True, health
          assert features.get("integrated_system_check") is True, health
          assert features.get("automatic_line_broadcast") is False, health
          assert features.get("member_session_history") is True, health
          assert features.get("role_separation") is True, health

          integrated = json.loads(
              (root / "next9.json").read_text(encoding="utf-8")
          )
          assert integrated.get("ok") is True, integrated
          assert integrated.get("version") == "GYM-NEXT-9-WORKER-20260725", integrated
          assert integrated.get("elapsed_ms", 999999) <= 5000, integrated
          assert all(
              item.get("ok") is True
              for item in integrated.get("checks", [])
          ), integrated
          security = integrated.get("security", {})
          assert security.get("admin_header_only") is True, integrated
          assert security.get("staff_header_only") is True, integrated
          assert security.get("query_string_auth_disabled") is True, integrated
          assert security.get("max_json_body_bytes") == 65536, integrated
          assert security.get("service_role_exposed") is False, integrated
          assert security.get("automatic_line_broadcast") is False, integrated

          performance = integrated.get("performance", {})
          assert performance.get("compact_json") is True, integrated
          assert performance.get("critical_queries_parallel") is True, integrated
          assert performance.get("public_payload_bytes", 999999999) <= 131072, integrated

          legacy = json.loads(
              (root / "legacy-system.json").read_text(encoding="utf-8")
          )
          assert legacy.get("ok") is True, legacy

          staff = json.loads(
              (root / "staff-health.json").read_text(encoding="utf-8")
          )
          assert staff.get("ok") is True, staff
          assert staff.get("role") == "staff", staff
          PY

      - name: Publish NEXT-9 integrated system-check UI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          content = base64.b64decode(
              """"""
          )
          Path("system-check.html").write_bytes(content)
          PY

      - name: Validate HTML JavaScript IDs and existing operations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-9-verify/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          text = Path("system-check.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(text)

          duplicates = sorted({
              value for value in parser.ids
              if parser.ids.count(value) > 1
          })
          if duplicates:
              raise SystemExit(f"Duplicate IDs: {duplicates}")

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.I | re.S,
          )
          inline = [script for script in scripts if script.strip()]
          for index, script in enumerate(inline, 1):
              Path(
                  f"/tmp/gym-next-9-verify/scripts/system-check-{index}.js"
              ).write_text(script, encoding="utf-8")

          Path("/tmp/gym-next-9-verify/html-report.json").write_text(
              json.dumps({
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "inline_script_count": len(inline),
                  "file_bytes": len(text.encode("utf-8")),
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          find /tmp/gym-next-9-verify/scripts             -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do
              node --check "${script}"
            done

          require_text() {
            local marker="$1"
            local label="$2"
            if ! grep -Fq -- "${marker}" system-check.html; then
              echo "::error file=system-check.html::Missing ${label}: ${marker}"
              exit 1
            fi
          }

          require_text 'data-dpro-next-step="GYM-NEXT-9"' 'NEXT-9 marker'
          require_text 'id="clearAdminCode"' 'admin delete button'
          require_text 'id="clearStaffCode"' 'staff delete button'
          require_text 'id="runAll"' 'one-click system check'
          require_text 'id="prepareDemo"' 'demo prepare'
          require_text '/api/admin/next-9-system-check' 'integrated API'
          require_text '/api/admin/system-check' 'legacy system check'
          require_text '/api/admin/phone-normalize-check' 'phone normalization'
          require_text '/api/admin/demo-prepare' 'demo prepare API'
          require_text '/api/staff/health' 'staff role check'
          require_text "adminQueryStatus === 401" 'query admin rejection'
          require_text "staffQueryStatus === 401" 'query staff rejection'
          require_text "plainTextStatus === 415" 'JSON content type guard'
          require_text "oversizedStatus === 413" 'request size guard'
          require_text 'NEXT-4 セッション記録' 'NEXT-4 preservation'
          require_text 'NEXT-5 体験・入会' 'NEXT-5 preservation'
          require_text 'NEXT-8 継続フォロー' 'NEXT-8 preservation'
          require_text 'LINE一斉送信' 'LINE broadcast disabled display'
          require_text 'dpro_gym_system_check_manual_next9' 'manual check storage'
          require_text 'staff.html' 'staff page URL'
          require_text 'dashboard.html?demo=1' 'owner page URL'
          require_text 'member.html?demo=1' 'member page URL'

          if grep -Eq             'dashboard\.html\?[^"[:space:]]*(admin_key|admin_code)|staff\.html\?[^"[:space:]]*staff_key'             system-check.html; then
            echo "::error::Authentication information was included in a page URL."
            exit 1
          fi

          FILE_BYTES="$(wc -c < system-check.html | tr -d ' ')"
          [[ "${FILE_BYTES}" -le 120000 ]] || {
            echo "::error::system-check.html exceeds 120KB: ${FILE_BYTES}"
            exit 1
          }

      - name: Confirm only system-check changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only |
              sed '/^$/d' |
              sort
          )

          [[ "$(printf '%s\n' "${CHANGED[@]}")" == "system-check.html" ]] || {
            echo "::error::Unexpected application files changed."
            printf 'Changed:\n%s\n' "${CHANGED[*]}"
            exit 1
          }

          for file in             config.js index.html member.html dashboard.html             owner-ipad.html staff.html
          do
            git diff --quiet -- "${file}" || {
              echo "::error::Unexpected runtime change: ${file}"
              exit 1
            }
          done
          git diff --check

      - name: Commit NEXT-9 integrated system-check
        shell: bash
        run: |
          set -euo pipefail
          git add system-check.html
          git commit -m "Complete GYM-NEXT-9 integrated system-check"

          APPLICATION_COMMIT_SHA="$(git rev-parse HEAD)"
          SYSTEM_CHECK_BLOB="$(git hash-object system-check.html)"

          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "SYSTEM_CHECK_BLOB=${SYSTEM_CHECK_BLOB}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify public file budgets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-9-verify/public

          verify_page() {
            local page="$1"
            local marker="$2"
            local max_bytes="$3"
            local file="/tmp/gym-next-9-verify/public/${page}"

            for attempt in $(seq 1 24); do
              curl --fail --location --silent --show-error                 --max-time 30                 -o "${file}"                 "${PUBLIC_BASE}/${page}?verify=${GITHUB_RUN_ID}-${attempt}" || true

              if [[ -s "${file}" ]] &&
                 grep -Fq "${marker}" "${file}"; then
                break
              fi

              if [[ "${attempt}" == "24" ]]; then
                echo "::error::Published file did not reach expected version: ${page}"
                exit 1
              fi
              sleep 10
            done

            local bytes
            bytes="$(wc -c < "${file}" | tr -d ' ')"
            [[ "${bytes}" -le "${max_bytes}" ]] || {
              echo "::error::${page} exceeds ${max_bytes} bytes: ${bytes}"
              exit 1
            }

            printf '%s,%s\n' "${page}" "${bytes}"               >> /tmp/gym-next-9-verify/public-file-sizes.csv
          }

          verify_page system-check.html             'data-dpro-next-step="GYM-NEXT-9"' 120000
          verify_page index.html             '/api/public/reservations' 120000
          verify_page member.html             'id="sessionHistoryList"' 120000
          verify_page dashboard.html             'id="view-followups"' 160000
          verify_page owner-ipad.html             '/api/admin/reservations' 120000
          verify_page staff.html             '/api/staff/today' 120000
          verify_page config.js             'GYM-NEXT-6-CONFIG-ROLE-SEPARATION-20260725' 20000

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             -o /tmp/gym-next-9-verify/public-next9.json             "${WORKER_BASE}/api/admin/next-9-system-check?facility_code=dpro_gym_demo&public_verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-9-verify/public-next9.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("elapsed_ms", 999999) <= 5000, data
          assert data.get("performance", {}).get(
              "public_payload_bytes",
              999999999,
          ) <= 131072, data
          PY

      - name: Record GYM-NEXT-9 completion and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-9-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-9 COMPLETE

          - 結果: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - Supabase変更: なし
          - 管理・スタッフ認証: HTTPヘッダー限定
          - URL認証: 401で拒否
          - JSON以外: 415で拒否
          - 64KB超過: 413で拒否
          - セキュリティヘッダー: OK
          - compact JSON: OK
          - 統合system-check: OK
          - 応答時間上限: 5000ms以内
          - 公開データ上限: 131072bytes以内
          - NEXT-4・5・8維持: OK
          - PC・iPad・スタッフ・会員画面: 維持
          - LINE自動・一斉送信: なし
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-9-COMPLETE"
          workflow_revision: "R1"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          system_check_blob: "${SYSTEM_CHECK_BLOB}"
          config_blob: "68028432d9177a907e1e91e81c316b47b8845147"
