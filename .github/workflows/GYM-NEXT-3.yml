name: STEP GYM-NEXT-3 - Data Contract and Change Decision

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-3-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-3
  SYSTEM_NAME: DPRO パーソナルジム LINE
  FACILITY_CODE: dpro_gym_demo
  CURRENT_STEP_REQUIRED: GYM-NEXT-2-COMPLETE
  NEXT_STEP: GYM-NEXT-4
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-3.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  CONTRACT_FILE: dpro-next/gym/data-contract.yml
  AUDIT_FILE: dpro-next/gym/data-audit.json
  DECISION_FILE: dpro-next/gym/next-4-change-decision.yml
  BACKUP_TAG: backup-gym-before-next-3-20260725
  TARGET_FILES: "config.js index.html member.html dashboard.html owner-ipad.html system-check.html"
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev

jobs:
  data-contract:
    name: Audit current data flow and define NEXT contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Record STEP metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "STARTED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Confirm NEXT-2 completion and safe upload commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${LEDGER_FILE}" ]]; then
            echo "::error::Completion ledger is missing: ${LEDGER_FILE}"
            exit 1
          fi

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"
          LEDGER_NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"
          LEDGER_RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"

          if [[ "${CURRENT_STEP}" != "${CURRENT_STEP_REQUIRED}" ]]; then
            echo "::error::Previous STEP is not complete: ${CURRENT_STEP}"
            exit 1
          fi
          if [[ "${LEDGER_NEXT_STEP}" != "${STEP_NAME}" ]]; then
            echo "::error::Ledger next_step is not ${STEP_NAME}: ${LEDGER_NEXT_STEP}"
            exit 1
          fi
          if [[ "${LEDGER_RESULT}" != "OK" ]]; then
            echo "::error::Previous STEP result is not OK: ${LEDGER_RESULT}"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::This workflow must run on main."
            exit 1
          fi
          if [[ ! -f "${WORKFLOW_FILE}" ]]; then
            echo "::error::Workflow file is missing: ${WORKFLOW_FILE}"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" \
                | grep -v -F -x "${WORKFLOW_FILE}" \
                | sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}."
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi

            CANDIDATE_CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" \
                | sed '/^$/d' || true
            )"
            CANDIDATE_UNEXPECTED="$(
              printf '%s\n' "${CANDIDATE_CHANGED}" \
                | grep -v -F -x "${WORKFLOW_FILE}" \
                | sed '/^$/d' || true
            )"

            if printf '%s\n' "${CANDIDATE_CHANGED}" | grep -F -x -q "${WORKFLOW_FILE}" \
              && [[ -z "${CANDIDATE_UNEXPECTED}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "UPLOAD_PARENT=${UPLOAD_PARENT}" >> "$GITHUB_ENV"
          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-3 version with backup tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING_SHA="$(git rev-list -n 1 "${BACKUP_TAG}")"
            if [[ "${EXISTING_SHA}" != "${STEP_BASE_SHA}" ]]; then
              echo "::error::Backup tag already points to another commit."
              echo "Expected: ${STEP_BASE_SHA}"
              echo "Existing: ${EXISTING_SHA}"
              exit 1
            fi
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "DPRO パーソナルジム LINE before GYM-NEXT-3"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected runtime file baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"

            if [[ ! -f "${file}" ]]; then
              echo "::error::Required file is missing: ${file}"
              exit 1
            fi

            local actual
            actual="$(git hash-object "${file}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::${file} differs from the inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            fi
          }

          check_blob config.js 94619ddc2fd2dd43b6d3cb99ba2349eef9d1f705
          check_blob index.html 90d477523912be87378d71a9e247365771848440
          check_blob member.html 1f5c980c63fbc817d6e99334bfe1290b0229dae4
          check_blob dashboard.html 83485110de3f2964897f2d6f6804abb53853bb21
          check_blob owner-ipad.html 2e61368938b6f3f55dd84c9012ea2bc8c94401e9
          check_blob system-check.html 278a6e803a87e4e334d2f5d8ad2e33bab080ca0a

          mkdir -p /tmp/gym-next-3
          : > /tmp/gym-next-3/runtime-files.sha256
          : > /tmp/gym-next-3/runtime-file-sizes.tsv

          for file in ${TARGET_FILES}; do
            sha256sum "${file}" >> /tmp/gym-next-3/runtime-files.sha256
            printf '%s\t%s\n' "${file}" "$(stat -c '%s' "${file}")" \
              >> /tmp/gym-next-3/runtime-file-sizes.tsv
          done

      - name: Validate workflow YAML HTML IDs and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          ruby -e "require 'yaml'; YAML.load_file('${WORKFLOW_FILE}', aliases: true); puts 'Workflow YAML OK'"

          mkdir -p /tmp/gym-next-3/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import sys

          html_files = [
              "index.html",
              "member.html",
              "dashboard.html",
              "owner-ipad.html",
              "system-check.html",
          ]

          class AuditParser(HTMLParser):
              void_tags = {
                  "area", "base", "br", "col", "embed", "hr", "img",
                  "input", "link", "meta", "param", "source", "track", "wbr",
              }

              def __init__(self, filename):
                  super().__init__(convert_charrefs=True)
                  self.filename = filename
                  self.ids = set()
                  self.duplicates = []
                  self.stack = []
                  self.errors = []
                  self.scripts = []
                  self.current_script = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicates.append(element_id)
                      self.ids.add(element_id)

                  if tag == "script" and not attrs_dict.get("src"):
                      script_type = (attrs_dict.get("type") or "").lower()
                      if script_type in ("", "text/javascript", "module"):
                          self.current_script = []

                  if tag not in self.void_tags:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicates.append(element_id)
                      self.ids.add(element_id)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "script" and self.current_script is not None:
                      self.scripts.append("\n".join(self.current_script))
                      self.current_script = None

                  if tag in self.void_tags:
                      return
                  if not self.stack:
                      self.errors.append(f"unexpected closing tag </{tag}>")
                      return
                  if self.stack[-1] == tag:
                      self.stack.pop()
                      return
                  if tag in self.stack:
                      while self.stack and self.stack[-1] != tag:
                          self.errors.append(
                              f"missing closing tag </{self.stack.pop()}>"
                          )
                      if self.stack:
                          self.stack.pop()
                  else:
                      self.errors.append(f"closing tag without opener </{tag}>")

              def handle_data(self, data):
                  if self.current_script is not None:
                      self.current_script.append(data)

          report = {}
          failed = False
          script_number = 0

          for filename in html_files:
              text = Path(filename).read_text(encoding="utf-8")
              parser = AuditParser(filename)
              parser.feed(text)
              parser.close()

              if parser.stack:
                  parser.errors.extend(
                      f"unclosed tag <{tag}>" for tag in reversed(parser.stack)
                  )

              report[filename] = {
                  "duplicate_ids": sorted(set(parser.duplicates)),
                  "structure_errors": parser.errors,
                  "id_count": len(parser.ids),
                  "inline_script_count": len(parser.scripts),
              }

              if parser.duplicates or parser.errors:
                  failed = True

              for script in parser.scripts:
                  script_number += 1
                  Path(
                      f"/tmp/gym-next-3/scripts/{script_number:03d}-{Path(filename).stem}.js"
                  ).write_text(script, encoding="utf-8")

          Path("/tmp/gym-next-3/html-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if failed:
              print(json.dumps(report, ensure_ascii=False, indent=2))
              sys.exit(1)
          PY

          node --check config.js
          shopt -s nullglob
          for script in /tmp/gym-next-3/scripts/*.js; do
            node --check "${script}"
          done

      - name: Audit live Worker and current public pages
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          mkdir -p /tmp/gym-next-3/live

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --output /tmp/gym-next-3/live/health.json \
            "${WORKER_BASE}/api/health"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --output /tmp/gym-next-3/live/facility.json \
            "${WORKER_BASE}/api/public/facility?facility_code=${FACILITY_CODE}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --header "X-Admin-Key: 1234" \
            --output /tmp/gym-next-3/live/dashboard.json \
            "${WORKER_BASE}/api/admin/dashboard?facility_code=${FACILITY_CODE}&date=${TODAY}"

          python3 <<'PY'
          from pathlib import Path
          import json
          import sys

          checks = {
              "health": Path("/tmp/gym-next-3/live/health.json"),
              "facility": Path("/tmp/gym-next-3/live/facility.json"),
              "dashboard": Path("/tmp/gym-next-3/live/dashboard.json"),
          }

          report = {}
          errors = []

          for name, path in checks.items():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as error:
                  errors.append(f"{name}: invalid JSON: {error}")
                  continue

              report[name] = {
                  "ok": data.get("ok"),
                  "keys": sorted(data.keys()),
              }

              if data.get("ok") is not True:
                  errors.append(f"{name}: ok is not true")

          dashboard = json.loads(
              checks["dashboard"].read_text(encoding="utf-8")
          )
          for key in ("facility", "counts", "reservations", "priority_tasks"):
              if key not in dashboard:
                  errors.append(f"dashboard: missing {key}")

          Path("/tmp/gym-next-3/live-api-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY

          for page in \
            "index.html?dpro_next=${GITHUB_RUN_ID}" \
            "member.html?demo=1&line_user_id=demo_gym_line_002&dpro_next=${GITHUB_RUN_ID}" \
            "dashboard.html?demo=1&dpro_next=${GITHUB_RUN_ID}" \
            "owner-ipad.html?demo=1&dpro_next=${GITHUB_RUN_ID}" \
            "system-check.html?demo=1&dpro_next=${GITHUB_RUN_ID}"
          do
            filename="$(
              printf '%s' "${page}" \
                | tr '/?&=' '____'
            )"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 30 \
              --output "/tmp/gym-next-3/live/${filename}.html" \
              "${PUBLIC_BASE}/${page}"
          done

      - name: Generate unified data contract and NEXT-4 change decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CONTRACT_FILE}")" "${STEP_DIR}"

          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          files = [
              "config.js",
              "index.html",
              "member.html",
              "dashboard.html",
              "owner-ipad.html",
              "system-check.html",
          ]

          texts = {
              filename: Path(filename).read_text(encoding="utf-8")
              for filename in files
          }

          endpoint_pattern = re.compile(r"/api/[A-Za-z0-9_?=&${}./:-]+")
          endpoints_by_file = {}

          for filename, text in texts.items():
              endpoints = {
                  value.rstrip("`'\"),;]")
                  for value in endpoint_pattern.findall(text)
              }
              endpoints_by_file[filename] = sorted(endpoints)

          required_endpoints = {
              "/api/public/facility",
              "/api/public/availability",
              "/api/public/reservations",
              "/api/member/home",
              "/api/member/inquiries",
              "/api/admin/dashboard",
              "/api/admin/reservations",
              "/api/admin/reservations/status",
              "/api/admin/customers",
              "/api/admin/customers/upsert",
              "/api/admin/customers/tickets",
              "/api/admin/inquiries",
              "/api/admin/inquiries/status",
              "/api/admin/settings",
              "/api/admin/activity-logs",
              "/api/admin/system-check",
              "/api/admin/demo-prepare",
          }

          all_endpoints = {
              endpoint
              for endpoints in endpoints_by_file.values()
              for endpoint in endpoints
          }

          missing_endpoints = sorted(
              endpoint
              for endpoint in required_endpoints
              if not any(
                  value.startswith(endpoint)
                  for value in all_endpoints
              )
          )

          statuses = [
              "requested",
              "confirmed",
              "arrived",
              "in_session",
              "completed",
              "change_requested",
              "cancel_requested",
              "cancelled",
              "no_show",
          ]

          status_presence = {
              status: {
                  filename: status in text
                  for filename, text in texts.items()
              }
              for status in statuses
          }

          required_status_files = {
              "dashboard.html",
              "owner-ipad.html",
              "member.html",
          }
          missing_statuses = []

          for status, presence in status_presence.items():
              for filename in required_status_files:
                  if not presence.get(filename):
                      missing_statuses.append(
                          f"{status} missing from {filename}"
                      )

          field_markers = {
              "customer": [
                  "customer_no",
                  "full_name",
                  "phone",
                  "status",
                  "plan_name",
                  "ticket_remaining",
                  "ticket_expires_on",
                  "visit_count",
                  "last_visit_on",
                  "goal",
                  "concern",
                  "precautions",
                  "follow_status",
                  "next_follow_on",
              ],
              "reservation": [
                  "reservation_no",
                  "customer_id",
                  "service_code",
                  "trainer_code",
                  "start_at",
                  "status",
              ],
              "inquiry": [
                  "inquiry_type",
                  "message",
                  "status",
                  "created_at",
              ],
          }

          combined_runtime = "\n".join(texts.values())
          missing_fields = {
              entity: [
                  field
                  for field in fields
                  if field not in combined_runtime
              ]
              for entity, fields in field_markers.items()
          }

          missing_fields = {
              entity: fields
              for entity, fields in missing_fields.items()
              if fields
          }

          current_session_api = sorted(
              endpoint
              for endpoint in all_endpoints
              if "session-record" in endpoint
              or "session_record" in endpoint
              or "/sessions" in endpoint
          )
          current_ticket_ledger_api = sorted(
              endpoint
              for endpoint in all_endpoints
              if "ticket-ledger" in endpoint
              or "ticket_ledger" in endpoint
              or "ticket-history" in endpoint
          )

          audit = {
              "system_name": "DPRO パーソナルジム LINE",
              "step": "GYM-NEXT-3",
              "facility_code": "dpro_gym_demo",
              "runtime_files_changed": False,
              "endpoints_by_file": endpoints_by_file,
              "required_endpoints": sorted(required_endpoints),
              "missing_required_endpoints": missing_endpoints,
              "reservation_status_presence": status_presence,
              "missing_required_statuses": missing_statuses,
              "field_markers": field_markers,
              "missing_field_markers": missing_fields,
              "current_session_record_api_references": current_session_api,
              "current_ticket_ledger_api_references": current_ticket_ledger_api,
              "worker_changed": False,
              "supabase_changed": False,
              "api_changed": False,
          }

          Path("dpro-next/gym/data-audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if missing_endpoints or missing_statuses or missing_fields:
              print(json.dumps(audit, ensure_ascii=False, indent=2))
              sys.exit(1)
          PY

          cat > "${CONTRACT_FILE}" <<'EOF'
          contract_version: "GYM-NEXT-3"
          system_name: "DPRO パーソナルジム LINE"
          facility_code: "dpro_gym_demo"
          timezone: "Asia/Tokyo"
          slot_minutes: 30
          purpose: "予約・会員・回数券・相談・将来のセッション記録を同じ業務単位で扱うためのDPRO NEXTデータ契約"
          runtime_change_in_this_step: false

          data_ownership:
            customer:
              master: "customer"
              key: "customer.id"
              public_identifier: "customer.customer_no"
              personal_data:
                - "full_name"
                - "full_name_kana"
                - "phone"
              owner_only_data:
                - "owner_note"
                - "precautions"
              member_visible_data:
                - "full_name"
                - "customer_no"
                - "status"
                - "plan_name"
                - "ticket_remaining"
                - "ticket_expires_on"
                - "visit_count"
                - "last_visit_on"
                - "goal"
                - "concern"

            reservation:
              master: "reservation"
              key: "reservation.id"
              links:
                customer: "reservation.customer_id -> customer.id"
                service: "reservation.service_code"
                trainer: "reservation.trainer_code"
              time_fields:
                start_at: "ISO-8601 / Asia-Tokyo表示"
                slot_rule: "開始時刻30分単位"
              current_fields:
                - "reservation_no"
                - "customer_id"
                - "service_code"
                - "trainer_code"
                - "start_at"
                - "status"
                - "memo"
              status_flow:
                requested:
                  label: "承認待ち"
                  next:
                    - "confirmed"
                    - "cancelled"
                confirmed:
                  label: "予約確定"
                  next:
                    - "arrived"
                    - "no_show"
                    - "change_requested"
                    - "cancel_requested"
                arrived:
                  label: "来店済み"
                  next:
                    - "in_session"
                in_session:
                  label: "トレーニング中"
                  next:
                    - "completed"
                completed:
                  label: "完了"
                  terminal: true
                change_requested:
                  label: "変更希望"
                  next:
                    - "confirmed"
                    - "cancelled"
                cancel_requested:
                  label: "キャンセル希望"
                  next:
                    - "confirmed"
                    - "cancelled"
                cancelled:
                  label: "キャンセル"
                  terminal: true
                no_show:
                  label: "未来店"
                  terminal: true

            inquiry:
              master: "inquiry"
              key: "inquiry.id"
              links:
                customer: "inquiry.customer_id -> customer.id"
              types:
                - "general"
                - "reservation"
                - "health"
                - "continuation"
                - "other"
              statuses:
                - "open"
                - "in_progress"
                - "closed"

            ticket_balance:
              current_master: "customer.ticket_remaining"
              expiry: "customer.ticket_expires_on"
              current_update_api: "/api/admin/customers/tickets"
              completion_link: "予約をcompletedへ更新した時、回数券対象メニューは1回減算"
              next_required_master: "ticket_ledger"
              reason: "現在残数だけでは増減理由・操作者・対象予約・二重減算を完全監査できない"

            session_record:
              current_state: "予約status=completedと来店回数・最終来店日で完了実績を表現"
              next_required_master: "gym_session_records"
              required_fields:
                - "id"
                - "facility_code"
                - "reservation_id"
                - "customer_id"
                - "trainer_code"
                - "performed_at"
                - "condition_note"
                - "training_summary"
                - "trainer_note"
                - "next_focus"
                - "member_visible_comment"
                - "created_by"
                - "created_at"
                - "updated_at"
              visibility:
                owner:
                  - "all fields"
                staff:
                  - "担当予約と安全上必要な項目"
                member:
                  - "member_visible_comment"
                  - "performed_at"
                  - "training_summary"

          screen_roles:
            index.html:
              role: "お客様予約受付"
              reads:
                - "facility"
                - "service"
                - "trainer"
                - "availability"
                - "existing member"
              writes:
                - "reservation"
                - "new or linked customer"

            dashboard.html:
              role: "オーナーPC"
              reads:
                - "dashboard"
                - "reservation"
                - "customer"
                - "inquiry"
                - "settings"
                - "activity_log"
              writes:
                - "reservation status"
                - "customer"
                - "ticket balance"
                - "inquiry status"
                - "settings"

            owner-ipad.html:
              role: "当日受付・現場進行"
              reads:
                - "today reservation"
                - "customer summary"
                - "inquiry"
              writes:
                - "reservation status"
                - "ticket balance current adjustment"
                - "inquiry status"

            member.html:
              role: "LINE会員マイページ"
              reads:
                - "customer member-visible fields"
                - "next reservation"
                - "upcoming reservations"
                - "reservation history"
              writes:
                - "change request"
                - "cancel request"
                - "inquiry"

          classification:
            required_now:
              - "customer master"
              - "reservation master and status flow"
              - "inquiry master"
              - "ticket current balance"
              - "activity log"
              - "30-minute slot guard"
              - "phone normalization"
              - "duplicate reservation guard"

            required_next_step:
              - "persistent session record"
              - "ticket ledger"
              - "atomic completed reservation + ticket deduction + session record guard"

            good_to_have_later:
              - "plan change history"
              - "member-visible trainer comment"
              - "next recommended date"

            unnecessary_now:
              - "automatic training prescription"
              - "detailed calorie management"
              - "automatic bulk LINE delivery"
              - "full accounting and payroll"

            future:
              - "progress photos"
              - "body measurement trend"
              - "electronic contract"
              - "payment integration"
              - "multi-location management"

          safety_rules:
            - "管理用情報を会員画面へ表示しない"
            - "電話番号は正規化して照合する"
            - "過去日時の予約を禁止する"
            - "同一枠・同一担当の重複予約を防ぐ"
            - "completedの再実行で回数券を二重減算しない"
            - "一括自動LINE配信は行わず個別確認する"
            - "全履歴を初期表示で一括取得しない"

          current_api_contract:
            public:
              - "/api/health"
              - "/api/public/facility"
              - "/api/public/availability"
              - "/api/public/member"
              - "/api/public/reservations"
            member:
              - "/api/member/home"
              - "/api/member/reservations/change-request"
              - "/api/member/reservations/cancel-request"
              - "/api/member/inquiries"
            admin:
              - "/api/admin/dashboard"
              - "/api/admin/reservations"
              - "/api/admin/reservations/status"
              - "/api/admin/customers"
              - "/api/admin/customers/upsert"
              - "/api/admin/customers/tickets"
              - "/api/admin/inquiries"
              - "/api/admin/inquiries/status"
              - "/api/admin/settings"
              - "/api/admin/activity-logs"
              - "/api/admin/system-check"
              - "/api/admin/demo-prepare"

          next_step: "GYM-NEXT-4"
          EOF

          cat > "${DECISION_FILE}" <<'EOF'
          decision_version: "GYM-NEXT-3"
          next_step: "GYM-NEXT-4"
          decision: "Worker・Supabase変更が必要"
          confidence: "high for persistent session records and auditable ticket ledger"
          current_runtime_changed: false
          worker_changed_in_next_3: false
          supabase_changed_in_next_3: false
          api_changed_in_next_3: false

          reasons:
            - "現在の画面契約では予約完了と回数券残数は扱えるが、1回ごとのトレーニング内容を永続保存するAPI参照がない"
            - "現在残数だけでは、回数券の増減理由・操作者・対象予約・二重減算防止を履歴単位で監査できない"
            - "予約完了、回数券減算、セッション記録を安全に一体処理するにはサーバー側の原子性が必要"

          proposed_supabase:
            tables:
              gym_session_records:
                purpose: "1予約1セッションの実施記録"
                unique_guard:
                  - "facility_code + reservation_id"
              gym_ticket_ledger:
                purpose: "回数券増減履歴"
                unique_guard:
                  - "facility_code + reservation_id + transaction_type for completion deduction"
            migration_requirements:
              - "既存予約・顧客テーブルを削除しない"
              - "既存ticket_remainingを維持する"
              - "新テーブル追加方式"
              - "RLSと管理API経由アクセス"
              - "ロールバックSQLを用意"

          proposed_worker:
            new_or_extended_routes:
              - "GET /api/admin/customers/{customer_id}/session-records"
              - "POST /api/admin/session-records/upsert"
              - "GET /api/admin/customers/{customer_id}/ticket-ledger"
              - "既存POST /api/admin/reservations/status のcompleted処理を原子的に強化"
              - "GET /api/member/session-history は会員公開項目だけ返す"
            safety_guards:
              - "completed再実行の冪等性"
              - "予約と顧客と施設コードの一致"
              - "回数券対象メニューだけ減算"
              - "残数を0未満にしない"
              - "owner_noteとtrainer_noteを会員APIへ返さない"
              - "activity_logを維持"

          before_implementation_checks:
            - "Cloudflare Worker現行ソースを取得して既存隠しAPI・既存テーブルの有無を再確認"
            - "Supabase現行スキーマをSQLで確認"
            - "既存completed処理のトランザクションと二重実行ガードを確認"
            - "既存デモデータを壊さない移行SQLを作成"

          deliverables_required_in_next_4:
            - "Worker差し替えファイル"
            - "Worker用ZIP"
            - "SQL通常版"
            - "SQL TEXT版"
            - "ロールバックSQL"
            - "自動検査"
            - "Worker Deploy手順"
            - "Supabase SQL実行手順"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${CONTRACT_FILE}', aliases: true); YAML.load_file('${DECISION_FILE}', aliases: true); puts 'Generated YAML files OK'"

      - name: Verify existing gym business rules remain intact
        shell: bash
        run: |
          set -euo pipefail

          require_text() {
            local file="$1"
            local text="$2"
            local label="$3"
            if ! grep -Fq "${text}" "${file}"; then
              echo "::error::Missing ${label}: ${file}"
              exit 1
            fi
          }

          require_text config.js "slotMinutes: 30" "30-minute config"
          require_text index.html "予約開始時刻は30分単位" "customer 30-minute guidance"
          require_text index.html "todayYmd" "past-date guard basis"
          require_text index.html "isValidPhone" "phone validation"
          require_text system-check.html "/api/admin/phone-normalize-check" "phone normalization check"
          require_text system-check.html "atomic_reservation_guard" "duplicate reservation guard"

          require_text dashboard.html "data-dpro-next-step=\"GYM-NEXT-2\"" "NEXT-2 dashboard"
          require_text dashboard.html "/api/admin/reservations/status" "PC status update"
          require_text dashboard.html "/api/admin/customers/tickets" "PC ticket update"
          require_text dashboard.html "完了・回数減算" "PC completion logic"

          require_text owner-ipad.html "/api/admin/reservations/status" "iPad status update"
          require_text owner-ipad.html "/api/admin/customers/tickets" "iPad ticket update"
          require_text owner-ipad.html "created_by:'ipad'" "iPad operator record"
          require_text owner-ipad.html "完了・回数減算" "iPad completion logic"

          require_text member.html "/api/member/home" "member home"
          require_text member.html "reservation_history" "member reservation history"
          require_text member.html "change-request" "member change request"
          require_text member.html "cancel-request" "member cancel request"
          require_text member.html "/api/member/inquiries" "member inquiry"

          if grep -Eiq '/api/.+(session-record|session_record|ticket-ledger|ticket_ledger|ticket-history)' \
            index.html member.html dashboard.html owner-ipad.html system-check.html; then
            echo "::error::Unexpected session-record or ticket-ledger API was found. Reassess NEXT-4 decision."
            exit 1
          fi

      - name: Confirm runtime Worker Supabase and API files were not changed
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            git status --short \
              | awk '{print $2}' \
              | grep -v -F -x "${WORKFLOW_FILE}" \
              | sed '/^$/d' || true
          )"

          EXPECTED="$(
            printf '%s\n' \
              "${AUDIT_FILE}" \
              "${CONTRACT_FILE}" \
              "${DECISION_FILE}" \
              | sort
          )"
          ACTUAL="$(printf '%s\n' "${CHANGED}" | sort)"

          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::Unexpected files changed during NEXT-3."
            echo "Expected:"
            echo "${EXPECTED}"
            echo "Actual:"
            echo "${ACTUAL}"
            exit 1
          fi

          WORKER_CHANGED=false
          SUPABASE_CHANGED=false
          API_CHANGED=false

          if printf '%s\n' "${CHANGED}" | grep -Eiq '(^|/)(worker[^/]*\.js|wrangler\.toml)$'; then
            WORKER_CHANGED=true
          fi
          if printf '%s\n' "${CHANGED}" | grep -Eiq '(^|/)(supabase|sql|migrations?)(/|$)|\.sql$'; then
            SUPABASE_CHANGED=true
          fi
          if printf '%s\n' "${CHANGED}" | grep -Eiq '(^|/)(api|functions?)(/|$)'; then
            API_CHANGED=true
          fi

          if [[ "${WORKER_CHANGED}" != "false" || "${SUPABASE_CHANGED}" != "false" || "${API_CHANGED}" != "false" ]]; then
            echo "::error::NEXT-3 must not change runtime Worker, Supabase or API source."
            exit 1
          fi

          {
            echo "WORKER_CHANGED=false"
            echo "SUPABASE_CHANGED=false"
            echo "API_CHANGED=false"
          } >> "$GITHUB_ENV"

      - name: Commit data contract and audit records
        shell: bash
        run: |
          set -euo pipefail

          git add "${CONTRACT_FILE}" "${AUDIT_FILE}" "${DECISION_FILE}"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::No data contract files were generated."
            exit 1
          fi

          git commit -m "Complete GYM-NEXT-3 data contract"
          DATA_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "DATA_COMMIT_SHA=${DATA_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Reconfirm public runtime after non-runtime commit
        shell: bash
        run: |
          set -euo pipefail

          for item in \
            "index.html|無料体験・トレーニング予約" \
            "member.html?demo=1&line_user_id=demo_gym_line_002|会員マイページ" \
            "dashboard.html?demo=1|data-dpro-next-step=\"GYM-NEXT-2\"" \
            "owner-ipad.html?demo=1|iPad受付画面" \
            "system-check.html?demo=1|営業前 system-check"
          do
            page="${item%%|*}"
            marker="${item#*|}"
            output="/tmp/gym-next-3/recheck-$(
              printf '%s' "${page}" | tr '/?&=' '____'
            ).html"

            if [[ "${page}" == *"?"* ]]; then
              separator="&"
            else
              separator="?"
            fi

            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 30 \
              --output "${output}" \
              "${PUBLIC_BASE}/${page}${separator}dpro_next_run=${GITHUB_RUN_ID}"

            if ! grep -Fq "${marker}" "${output}"; then
              echo "::error::Public page marker missing: ${page} / ${marker}"
              exit 1
            fi
          done

          echo "PUBLIC_VERIFIED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"

      - name: Create NEXT-3 completion report and update ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STEP_DIR}"
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cp /tmp/gym-next-3/html-audit.json "${STEP_DIR}/GYM-NEXT-3-html-audit.json"
          cp /tmp/gym-next-3/live-api-audit.json "${STEP_DIR}/GYM-NEXT-3-live-api-audit.json"
          cp /tmp/gym-next-3/runtime-files.sha256 "${STEP_DIR}/GYM-NEXT-3-runtime-files.sha256"
          cp /tmp/gym-next-3/runtime-file-sizes.tsv "${STEP_DIR}/GYM-NEXT-3-runtime-file-sizes.tsv"

          cat > "${STEP_DIR}/GYM-NEXT-3.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-3

          - 結果: OK
          - STEP目的: 予約・会員・回数券・相談・セッション記録のデータ契約整理
          - 変更前バックアップタグ: ${BACKUP_TAG}
          - データ契約コミット: ${DATA_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - 公開再確認日時: ${PUBLIC_VERIFIED_AT}
          - Actions: ${RUN_URL}

          ## 実施内容

          - 現在の予約・会員・回数券・相談APIを画面横断で棚卸し
          - 予約状態9種類と遷移を統一契約として記録
          - PC、iPad、LINE会員、予約画面のデータ責任を整理
          - 会員公開項目と管理専用項目を分離
          - 現在のticket_remainingと将来のticket_ledgerを分離
          - NEXT-4のセッション記録に必要な項目と公開範囲を確定
          - Worker・Supabase変更要否を正式判定

          ## NEXT-4変更判定

          - Worker変更: 必要
          - Supabase変更: 必要
          - 理由: セッション記録の永続化、回数券増減履歴、完了処理の原子性・冪等性
          - NEXT-3ではWorker・Supabase・APIを変更していない

          ## 自動検査

          - NEXT-2完了台帳: OK
          - バックアップタグ: OK
          - 現行ファイルblob一致: OK
          - Workflow YML構文: OK
          - 生成YML構文: OK
          - HTML構造: OK
          - JavaScript構文: OK
          - HTML ID重複: OK
          - Worker health: OK
          - 公開施設API: OK
          - 管理ダッシュボードAPI: OK
          - 公開5画面: OK
          - 必須API参照: OK
          - 予約状態9種類: OK
          - 主要データ項目: OK
          - 30分枠: OK
          - 電話番号正規化検査: OK
          - 重複予約検査: OK
          - 既存機能維持: OK
          - Runtimeファイル変更: なし
          - Worker変更: なし
          - Supabase変更: なし
          - API変更: なし

          ## 次のSTEP

          ${NEXT_STEP}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-3-COMPLETE"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "${FACILITY_CODE}"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          data_commit_sha: "${DATA_COMMIT_SHA}"
          completed_at: "${COMPLETED_AT}"
          public_verified_at: "${PUBLIC_VERIFIED_AT}"
          workflow_run_url: "${RUN_URL}"
          runtime_files_changed: false
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_4_worker_change_required: true
          next_4_supabase_change_required: true
          next_4_reason:
            - "persistent session records"
            - "auditable ticket ledger"
            - "atomic and idempotent completion processing"
          changed_files:
            - "${CONTRACT_FILE}"
            - "${AUDIT_FILE}"
            - "${DECISION_FILE}"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            runtime_blob_baselines: "OK"
            workflow_yaml_syntax: "OK"
            generated_yaml_syntax: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            worker_health: "OK"
            public_facility_api: "OK"
            admin_dashboard_api: "OK"
            public_pages: "OK"
            required_api_references: "OK"
            reservation_status_contract: "OK"
            core_data_fields: "OK"
            slot_minutes_30: "OK"
            phone_normalization_check: "OK"
            duplicate_reservation_check: "OK"
            existing_features: "OK"
            runtime_unchanged: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true); puts 'Completion ledger YAML OK'"

      - name: Upload NEXT-3 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-3-data-contract-audit
          path: |
            dpro-next/gym/data-contract.yml
            dpro-next/gym/data-audit.json
            dpro-next/gym/next-4-change-decision.yml
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-3*
          if-no-files-found: error
          retention-days: 30

      - name: Commit completion ledger delete workflow and push
        shell: bash
        run: |
          set -euo pipefail

          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::error::No completion records were generated."
            exit 1
          fi

          git commit -m "Record GYM-NEXT-3 completion"
          git push origin HEAD:main

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-3 COMPLETE"
            echo ""
            echo "- Runtime files changed: \`false\`"
            echo "- Data contract: \`${CONTRACT_FILE}\`"
            echo "- Data audit: \`${AUDIT_FILE}\`"
            echo "- NEXT-4 decision: \`${DECISION_FILE}\`"
            echo "- Worker changed in NEXT-3: \`false\`"
            echo "- Supabase changed in NEXT-3: \`false\`"
            echo "- API changed in NEXT-3: \`false\`"
            echo "- Worker change required in NEXT-4: \`true\`"
            echo "- Supabase change required in NEXT-4: \`true\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
            echo "- Workflow file: deleted after success"
          } >> "$GITHUB_STEP_SUMMARY"
