name: STEP GYM-NEXT-2-R3 - Recovery and Completion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-2-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-2
  WORKFLOW_REVISION: R3
  SYSTEM_NAME: DPRO パーソナルジム LINE
  FACILITY_CODE: dpro_gym_demo
  CURRENT_STEP_REQUIRED: GYM-NEXT-1-COMPLETE
  NEXT_STEP: GYM-NEXT-3
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-2.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  TARGET_FILE: dashboard.html
  BASELINE_DASHBOARD_BLOB: 2d7d98012eb581068bdd040bf487884cf19dbdb1
  NEXT2_DASHBOARD_BLOB: 83485110de3f2964897f2d6f6804abb53853bb21
  BACKUP_TAG: backup-gym-before-next-2-20260725
  PUBLIC_DASHBOARD_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/dashboard.html?demo=1

jobs:
  recover-and-complete:
    name: Verify existing NEXT-2 update and complete ledger
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Record STEP metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "STARTED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Confirm previous STEP and safe R3 upload
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${LEDGER_FILE}" ]]; then
            echo "::error::Completion ledger is missing: ${LEDGER_FILE}"
            exit 1
          fi

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"
          LEDGER_NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"
          LEDGER_RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"

          case "${CURRENT_STEP}" in
            "${CURRENT_STEP_REQUIRED}")
              ;;
            "GYM-NEXT-2-COMPLETE")
              echo "::notice::GYM-NEXT-2 is already complete. R3 will verify and refresh the completion record."
              ;;
            *)
              echo "::error::Unexpected current_step: ${CURRENT_STEP}"
              exit 1
              ;;
          esac

          if [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" && "${LEDGER_NEXT_STEP}" != "${STEP_NAME}" ]]; then
            echo "::error::Ledger next_step is not ${STEP_NAME}: ${LEDGER_NEXT_STEP}"
            exit 1
          fi
          if [[ "${LEDGER_RESULT}" != "OK" ]]; then
            echo "::error::Previous ledger result is not OK: ${LEDGER_RESULT}"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::This workflow must run on main."
            exit 1
          fi
          if [[ ! -f "${WORKFLOW_FILE}" ]]; then
            echo "::error::Workflow file is missing: ${WORKFLOW_FILE}"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" \
                | grep -v -F -x "${WORKFLOW_FILE}" \
                | sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::R3 upload commit must contain only ${WORKFLOW_FILE}."
              echo "${UNEXPECTED}"
              exit 1
            fi
          fi

      - name: Verify existing NEXT-2 backup tag and application commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if ! git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            echo "::error::NEXT-2 backup tag is missing: ${BACKUP_TAG}"
            exit 1
          fi

          TAG_SHA="$(git rev-list -n 1 "${BACKUP_TAG}")"
          APP_COMMIT_SHA="$(git log -1 --format=%H -- "${TARGET_FILE}")"

          if [[ -z "${APP_COMMIT_SHA}" ]]; then
            echo "::error::Could not identify the dashboard application commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG_SHA}" "${APP_COMMIT_SHA}"; then
            echo "::error::Dashboard application commit is not based on the protected tag."
            exit 1
          fi

          BASELINE_BLOB="$(git rev-parse "${BACKUP_TAG}:${TARGET_FILE}")"
          if [[ "${BASELINE_BLOB}" != "${BASELINE_DASHBOARD_BLOB}" ]]; then
            echo "::error::Protected dashboard blob does not match the inspected baseline."
            echo "Expected: ${BASELINE_DASHBOARD_BLOB}"
            echo "Actual:   ${BASELINE_BLOB}"
            exit 1
          fi

          CHANGED_FROM_TAG="$(
            git diff --name-only "${BACKUP_TAG}" "${APP_COMMIT_SHA}" \
              | grep -v -F -x "${WORKFLOW_FILE}" \
              | sed '/^$/d' || true
          )"
          if [[ "${CHANGED_FROM_TAG}" != "${TARGET_FILE}" ]]; then
            echo "::error::Unexpected application files changed during NEXT-2."
            echo "${CHANGED_FROM_TAG}"
            exit 1
          fi

          echo "TAG_SHA=${TAG_SHA}" >> "$GITHUB_ENV"
          echo "APP_COMMIT_SHA=${APP_COMMIT_SHA}" >> "$GITHUB_ENV"

      - name: Verify NEXT-2 dashboard is already applied
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${TARGET_FILE}" ]]; then
            echo "::error::Missing target file: ${TARGET_FILE}"
            exit 1
          fi

          CURRENT_BLOB="$(git hash-object "${TARGET_FILE}")"
          if [[ "${CURRENT_BLOB}" != "${NEXT2_DASHBOARD_BLOB}" ]]; then
            echo "::error::Current dashboard is not the validated NEXT-2 application version."
            echo "Expected: ${NEXT2_DASHBOARD_BLOB}"
            echo "Actual:   ${CURRENT_BLOB}"
            exit 1
          fi

          grep -Fq 'data-dpro-next-step="GYM-NEXT-2"' "${TARGET_FILE}"
          grep -Fq '今すぐ対応' "${TARGET_FILE}"
          grep -Fq '本日の予約' "${TARGET_FILE}"
          grep -Fq '今日中の対応' "${TARGET_FILE}"
          grep -Fq '次回案内候補' "${TARGET_FILE}"
          grep -Fq 'buildTodayGroups' "${TARGET_FILE}"
          grep -Fq 'showSettingPanel' "${TARGET_FILE}"
          grep -Fq 'settings-menu' "${TARGET_FILE}"
          grep -Fq 'html { font-size:18px; }' "${TARGET_FILE}"
          grep -Fq 'html{font-size:17px}' "${TARGET_FILE}"

          echo "AFTER_SHA256=$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AFTER_SIZE=$(stat -c '%s' "${TARGET_FILE}")" >> "$GITHUB_ENV"
          echo "NEXT2_BLOB=${CURRENT_BLOB}" >> "$GITHUB_ENV"

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('${WORKFLOW_FILE}', aliases: true); puts 'YAML syntax OK'"

      - name: Validate HTML structure duplicate IDs and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gym-next-2-r3
          mkdir -p /tmp/gym-next-2-r3/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import sys

          class AuditParser(HTMLParser):
              void_tags = {
                  "area", "base", "br", "col", "embed", "hr", "img",
                  "input", "link", "meta", "param", "source", "track", "wbr",
              }

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.duplicates = []
                  self.stack = []
                  self.errors = []
                  self.scripts = []
                  self.current_script = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicates.append(element_id)
                      self.ids.add(element_id)

                  if tag == "script" and not attrs_dict.get("src"):
                      script_type = (attrs_dict.get("type") or "").lower()
                      if script_type in ("", "text/javascript", "module"):
                          self.current_script = []

                  if tag not in self.void_tags:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicates.append(element_id)
                      self.ids.add(element_id)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "script" and self.current_script is not None:
                      self.scripts.append("\n".join(self.current_script))
                      self.current_script = None

                  if tag in self.void_tags:
                      return
                  if not self.stack:
                      self.errors.append(f"unexpected closing tag </{tag}>")
                      return
                  if self.stack[-1] == tag:
                      self.stack.pop()
                      return
                  if tag in self.stack:
                      while self.stack and self.stack[-1] != tag:
                          self.errors.append(
                              f"missing closing tag </{self.stack.pop()}>"
                          )
                      if self.stack:
                          self.stack.pop()
                  else:
                      self.errors.append(f"closing tag without opener </{tag}>")

              def handle_data(self, data):
                  if self.current_script is not None:
                      self.current_script.append(data)

          text = Path("dashboard.html").read_text(encoding="utf-8")
          parser = AuditParser()
          parser.feed(text)
          parser.close()
          if parser.stack:
              parser.errors.extend(
                  f"unclosed tag <{tag}>" for tag in reversed(parser.stack)
              )

          report = {
              "workflow_revision": "R3",
              "duplicate_ids": sorted(set(parser.duplicates)),
              "structure_errors": parser.errors,
              "inline_script_count": len(parser.scripts),
              "id_count": len(parser.ids),
          }
          Path("/tmp/gym-next-2-r3/html-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if report["duplicate_ids"] or report["structure_errors"]:
              print(json.dumps(report, ensure_ascii=False, indent=2))
              sys.exit(1)

          for index, script in enumerate(parser.scripts, 1):
              Path(
                  f"/tmp/gym-next-2-r3/scripts/{index:02d}-dashboard.js"
              ).write_text(script, encoding="utf-8")
          PY

          node --check config.js
          shopt -s nullglob
          for script in /tmp/gym-next-2-r3/scripts/*.js; do
            node --check "${script}"
          done

      - name: Confirm existing API usage and owner functions are preserved
        shell: bash
        run: |
          set -euo pipefail

          git show "${BACKUP_TAG}:${TARGET_FILE}" > /tmp/gym-next-2-r3/dashboard-baseline.html

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r"/api/[A-Za-z0-9_?=&${}./:-]+")

          def endpoints(path):
              text = Path(path).read_text(encoding="utf-8")
              return {
                  value.rstrip("`'\"),;]")
                  for value in pattern.findall(text)
              }

          before = endpoints("/tmp/gym-next-2-r3/dashboard-baseline.html")
          after = endpoints("dashboard.html")

          if before != after:
              print("Removed API references:", sorted(before - after))
              print("Added API references:", sorted(after - before))
              sys.exit(1)

          print(f"API reference set unchanged: {len(after)} entries")
          PY

          require_text() {
            local text="$1"
            local label="$2"
            if ! grep -Fq "${text}" "${TARGET_FILE}"; then
              echo "::error::Missing ${label}"
              exit 1
            fi
          }

          require_text "管理コード削除" "admin code delete"
          require_text "clearAdminCode" "admin code clear function"
          require_text "電話・店頭予約" "phone and store booking"
          require_text "/api/admin/dashboard" "dashboard API"
          require_text "/api/admin/reservations/status" "status update API"
          require_text "/api/admin/customers/upsert" "customer save API"
          require_text "/api/admin/customers/tickets" "ticket API"
          require_text "/api/admin/settings" "settings API"
          require_text "/api/admin/activity-logs" "activity log API"
          require_text "default_slot_minutes:30" "30-minute slot rule"
          require_text "完了・回数減算" "completion and ticket deduction"
          require_text "requested" "requested status"
          require_text "confirmed" "confirmed status"
          require_text "arrived" "arrived status"
          require_text "in_session" "in-session status"
          require_text "completed" "completed status"
          require_text "cancel_requested" "cancel request status"
          require_text "change_requested" "change request status"
          require_text "no_show" "no-show status"

          if grep -Fq 'id="priorityTasks"' "${TARGET_FILE}"; then
            echo "::error::Legacy mixed-priority container remains."
            exit 1
          fi

          if [[ "$(stat -c '%s' "${TARGET_FILE}")" -gt 150000 ]]; then
            echo "::error::dashboard.html exceeds the 150 KB safety limit."
            exit 1
          fi

      - name: Confirm Worker Supabase and API source were not changed
        shell: bash
        run: |
          set -euo pipefail

          ALL_CHANGED="$(
            git diff --name-only "${BACKUP_TAG}" HEAD \
              | grep -v -F -x "${WORKFLOW_FILE}" \
              | sed '/^$/d' || true
          )"

          WORKER_CHANGED=false
          SUPABASE_CHANGED=false
          API_CHANGED=false

          if printf '%s\n' "${ALL_CHANGED}" | grep -Eiq '(^|/)(worker[^/]*\.js|wrangler\.toml)$'; then
            WORKER_CHANGED=true
          fi
          if printf '%s\n' "${ALL_CHANGED}" | grep -Eiq '(^|/)(supabase|sql|migrations?)(/|$)|\.sql$'; then
            SUPABASE_CHANGED=true
          fi
          if printf '%s\n' "${ALL_CHANGED}" | grep -Eiq '(^|/)(api|functions?)(/|$)'; then
            API_CHANGED=true
          fi

          if [[ "${WORKER_CHANGED}" != "false" || "${SUPABASE_CHANGED}" != "false" || "${API_CHANGED}" != "false" ]]; then
            echo "::error::NEXT-2 unexpectedly changed Worker, Supabase or API source."
            printf '%s\n' "${ALL_CHANGED}"
            exit 1
          fi

          {
            echo "WORKER_CHANGED=false"
            echo "SUPABASE_CHANGED=false"
            echo "API_CHANGED=false"
          } >> "$GITHUB_ENV"

      - name: Verify GitHub Pages published NEXT-2 dashboard safely
        shell: bash
        run: |
          set -euo pipefail

          PUBLIC_FILE="/tmp/gym-next-2-r3/public-dashboard.html"
          VERIFIED=false

          for attempt in $(seq 1 18); do
            CHECK_URL="${PUBLIC_DASHBOARD_URL}&dpro_next_run=${GITHUB_RUN_ID}-${attempt}"

            rm -f "${PUBLIC_FILE}"
            if curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 2 --max-time 30 \
              --output "${PUBLIC_FILE}" \
              "${CHECK_URL}"; then
              if grep -Fq 'data-dpro-next-step="GYM-NEXT-2"' "${PUBLIC_FILE}" \
                && grep -Fq '今すぐ対応' "${PUBLIC_FILE}" \
                && grep -Fq '次回案内候補' "${PUBLIC_FILE}" \
                && grep -Fq 'settings-menu' "${PUBLIC_FILE}"; then
                VERIFIED=true
                break
              fi
            fi

            sleep 10
          done

          if [[ "${VERIFIED}" != "true" ]]; then
            echo "::error::GitHub Pages did not return the complete NEXT-2 dashboard in time."
            exit 1
          fi

          echo "PUBLIC_SIZE=$(stat -c '%s' "${PUBLIC_FILE}")" >> "$GITHUB_ENV"
          echo "PUBLIC_SHA256=$(sha256sum "${PUBLIC_FILE}" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "PUBLIC_VERIFIED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"

      - name: Create NEXT-2 R3 completion report and update ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STEP_DIR}"
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-2.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-2-R3

          - 結果: OK
          - 実行方式: R2で反映済みの画面を再変更せず検査・完成処理
          - 対象ファイル: dashboard.html
          - 変更前バックアップタグ: ${BACKUP_TAG}
          - バックアップコミット: ${TAG_SHA}
          - アプリ変更コミット: ${APP_COMMIT_SHA}
          - NEXT-2 dashboard blob: ${NEXT2_BLOB}
          - 完了日時: ${COMPLETED_AT}
          - 公開確認日時: ${PUBLIC_VERIFIED_AT}
          - Actions: ${RUN_URL}

          ## R3修正

          - curlとgrepをパイプ接続せず、公開HTMLを一時ファイルへ完全保存してから検査
          - curlエラー23の誤判定を解消
          - 既に反映済みのdashboard.htmlを再適用しない回復モード
          - バックアップタグから現在版までの変更範囲を再検査

          ## 完成内容

          - 今日やることを「今すぐ対応」「本日の予約」「今日中の対応」「次回案内候補」に分離
          - 電話・店頭予約、予約確認、会員確認を主要操作として上部に配置
          - 施設設定を左メニューと内容切替へ変更
          - PC文字サイズ18px、スマホ17px
          - スマホ表示の横はみ出し対策
          - 管理コード削除、予約、会員、回数券、設定、操作履歴を維持

          ## 自動検査

          - 前STEP完了確認: OK
          - バックアップタグ: OK
          - NEXT-2適用済み版: OK
          - YAML構文: OK
          - HTML構造: OK
          - JavaScript構文: OK
          - HTML ID重複: OK
          - 既存API参照一致: OK
          - 既存機能維持: OK
          - パーソナルジム業務ロジック: OK
          - 30分枠維持: OK
          - ファイル容量ガード: OK
          - GitHub Pages公開反映: OK
          - Worker変更: なし
          - Supabase変更: なし
          - API変更: なし

          ## 次のSTEP

          ${NEXT_STEP}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-2-COMPLETE"
          workflow_revision: "R3"
          recovery_mode: true
          next_step: "${NEXT_STEP}"
          result: "OK"
          baseline_config_version: "GYM-6-R2-CONFIG-RESTORE-URL-HEADER-FIX-20260717"
          facility_code: "${FACILITY_CODE}"
          slot_minutes: 30
          next_1_baseline_sha: "d6306daed290cb2abac8603d425885cbeeb40a4f"
          next_1_backup_tag: "backup-gym-before-next-20260725"
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${TAG_SHA}"
          application_commit_sha: "${APP_COMMIT_SHA}"
          dashboard_blob: "${NEXT2_BLOB}"
          completed_at: "${COMPLETED_AT}"
          public_verified_at: "${PUBLIC_VERIFIED_AT}"
          public_file_size: ${PUBLIC_SIZE}
          public_file_sha256: "${PUBLIC_SHA256}"
          workflow_run_url: "${RUN_URL}"
          worker_changed: false
          supabase_changed: false
          api_changed: false
          application_files_changed: true
          changed_files:
            - "dashboard.html"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            next_2_applied_version: "OK"
            public_pages: "OK"
            yaml_syntax: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            existing_api_references: "OK"
            existing_features: "OK"
            personal_gym_logic: "OK"
            slot_minutes_30: "OK"
            file_size_guard: "OK"
            responsive_layout_rules: "OK"
            safe_public_download_check: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true); puts 'Ledger YAML OK'"

          cp /tmp/gym-next-2-r3/html-audit.json "${STEP_DIR}/GYM-NEXT-2-html-audit.json"
          {
            echo "workflow_revision=R3"
            echo "recovery_mode=true"
            echo "baseline_blob=${BASELINE_DASHBOARD_BLOB}"
            echo "next2_blob=${NEXT2_BLOB}"
            echo "after_sha256=${AFTER_SHA256}"
            echo "after_size=${AFTER_SIZE}"
            echo "public_sha256=${PUBLIC_SHA256}"
            echo "public_size=${PUBLIC_SIZE}"
            echo "application_commit_sha=${APP_COMMIT_SHA}"
          } > "${STEP_DIR}/GYM-NEXT-2-file-record.txt"

      - name: Upload NEXT-2 R3 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-2-R3-completion-audit
          path: |
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-2*
          if-no-files-found: error
          retention-days: 30

      - name: Commit completion ledger delete workflow and push
        shell: bash
        run: |
          set -euo pipefail

          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::error::No completion records were generated."
            exit 1
          fi

          git commit -m "Complete GYM-NEXT-2 with R3 verification"
          git push origin HEAD:main

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-2-R3 COMPLETE"
            echo ""
            echo "- Recovery mode: \`true\`"
            echo "- Changed application file: \`dashboard.html\`"
            echo "- Backup tag: \`${BACKUP_TAG}\`"
            echo "- Application commit: \`${APP_COMMIT_SHA}\`"
            echo "- Public dashboard: ${PUBLIC_DASHBOARD_URL}"
            echo "- Worker changed: \`false\`"
            echo "- Supabase changed: \`false\`"
            echo "- API changed: \`false\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
            echo "- Workflow file: deleted after success"
          } >> "$GITHUB_STEP_SUMMARY"
