                        <section class="settings-panel" data-settings-panel="booking"><h3>予約ルール</h3><p class="sub">何日先まで、何時間前まで予約できるかを設定します。</p><div class="settings-grid"><div><label for="settingMaxDays">予約可能日数</label><input id="settingMaxDays" type="number" min="1" max="365"></div><div><label for="settingLead">予約までの最低時間</label><input id="settingLead" type="number" min="0" max="168"></div><div><label for="settingCancel">キャンセル期限（時間前）</label><input id="settingCancel" type="number" min="0" max="336"></div></div></section>
                        <section class="settings-panel" data-settings-panel="closed"><h3>定休日・臨時休業</h3><p class="sub">毎週の休みと、日付指定の休業日を設定します。</p><div class="settings-grid"><div class="span-2"><label>定休日</label><div class="checkbox-row" id="weekdayChecks"></div></div><div class="span-2"><label for="settingClosedDates">臨時休業日（1行に1日・YYYY-MM-DD）</label><textarea id="settingClosedDates"></textarea></div></div></section>
                        <section class="settings-panel" data-settings-panel="notice"><h3>予約画面のお知らせ</h3><p class="sub">お客様の予約画面に表示する案内です。管理情報は入力しないでください。</p><div class="settings-grid"><div class="span-2"><label for="settingNotice">表示するお知らせ</label><textarea id="settingNotice"></textarea></div></div></section>
                        <div class="settings-save"><p class="sub">変更した項目をまとめて保存します。</p><button class="btn btn-blue" type="button" onclick="saveSettings()">設定を保存</button></div>
                      </div>
                    </div>
                  </section>"""
          replace_once(old_settings, new_settings, "settings section")

          old_render = "    function renderDashboard(d){document.getElementById('todayLabel').textContent=`${formatDate(d.date)}の予約と優先対応`;const c=d.counts||{};setText('countReservations',c.reservations);setText('countPending',c.pending);setText('countInquiries',c.open_inquiries);setText('countFollow',c.follow_due);setText('countLowTickets',c.low_tickets);setText('navToday',(c.pending||0)+(c.open_inquiries||0)+(c.follow_due||0));setText('navReservations',c.reservations);setText('navInquiries',c.open_inquiries);document.getElementById('todayReservations').innerHTML=d.reservations?.length?d.reservations.map(reservationCard).join(''):empty('この日の予約はありません。');document.getElementById('priorityTasks').innerHTML=d.priority_tasks?.length?d.priority_tasks.map(taskCard).join(''):empty('優先対応はありません。');}"
          new_render = """    function renderDashboard(d){document.getElementById('todayLabel').textContent=`${formatDate(d.date)}｜今すぐ必要な操作から表示`;const c=d.counts||{},groups=buildTodayGroups(d),reservations=d.reservations||[];setText('countReservations',c.reservations);setText('countPending',c.pending);setText('countInquiries',c.open_inquiries);setText('countFollow',c.follow_due);setText('countLowTickets',c.low_tickets);setText('urgentTaskCount',groups.urgent.length);setText('todayReservationCount',reservations.length);setText('todayTaskCount',groups.today.length);setText('followTaskCount',groups.follow.length);setText('navToday',groups.urgent.length+groups.today.length+groups.follow.length);setText('navReservations',c.reservations);setText('navInquiries',c.open_inquiries);document.getElementById('urgentTasks').innerHTML=groups.urgent.length?groups.urgent.map(taskCard).join(''):empty('今すぐ対応が必要な項目はありません。');document.getElementById('todayReservations').innerHTML=reservations.length?reservations.map(reservationCard).join(''):empty('この日の予約はありません。');document.getElementById('todayTasks').innerHTML=groups.today.length?groups.today.map(taskCard).join(''):empty('今日中の対応はありません。');document.getElementById('followTasks').innerHTML=groups.follow.length?groups.follow.map(taskCard).join(''):empty('次回案内候補はありません。');}
              function buildTodayGroups(d){const groups={urgent:[],today:[],follow:[]},seenReservations=new Set();(d.priority_tasks||[]).forEach(task=>{if(task.type==='reservation_pending'){if(task.reservation?.id)seenReservations.add(task.reservation.id);groups.urgent.push(task);}else if(task.type==='inquiry'){groups.urgent.push(task);}else if(task.type==='low_tickets'){groups.follow.push(task);}else{groups.today.push(task);}});(d.reservations||[]).forEach(reservation=>{if(['requested','cancel_requested','change_requested'].includes(reservation.status)&&!seenReservations.has(reservation.id)){groups.urgent.push({type:'reservation_pending',reservation});}});return groups;}"""
          replace_once(old_render, new_render, "dashboard renderer")

          old_weekdays = "    function renderWeekdays(){document.getElementById('weekdayChecks').innerHTML=['日','月','火','水','木','金','土'].map((n,i)=>`<label class=\"check-label\"><input type=\"checkbox\" value=\"${i}\">${n}</label>`).join('');}"
          new_weekdays = """    function renderWeekdays(){document.getElementById('weekdayChecks').innerHTML=['日','月','火','水','木','金','土'].map((n,i)=>`<label class="check-label"><input type="checkbox" value="${i}">${n}</label>`).join('');}
              function showSettingPanel(panel){document.querySelectorAll('.settings-panel').forEach(item=>item.classList.toggle('active',item.dataset.settingsPanel===panel));document.querySelectorAll('.settings-menu-btn').forEach(item=>item.classList.toggle('active',item.dataset.settingsTab===panel));}"""
          replace_once(old_weekdays, new_weekdays, "settings panel function")

          if text.count('data-dpro-next-step="GYM-NEXT-2"') != 1:
              raise SystemExit("NEXT marker count is invalid")
          if 'id="priorityTasks"' in text:
              raise SystemExit("Legacy priorityTasks container still exists")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          echo "AFTER_SHA256=$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AFTER_SIZE=$(stat -c '%s' "${TARGET_FILE}")" >> "$GITHUB_ENV"

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('${WORKFLOW_FILE}', aliases: true); puts 'YAML syntax OK'"

      - name: Validate HTML structure duplicate IDs and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gym-next-2-tmp
          mkdir -p .gym-next-2-tmp/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import sys

          class AuditParser(HTMLParser):
              void_tags = {
                  "area", "base", "br", "col", "embed", "hr", "img",
                  "input", "link", "meta", "param", "source", "track", "wbr",
              }

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.duplicates = []
                  self.stack = []
                  self.errors = []
                  self.scripts = []
                  self.current_script = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicates.append(element_id)
                      self.ids.add(element_id)

                  if tag == "script" and not attrs_dict.get("src"):
                      script_type = (attrs_dict.get("type") or "").lower()
                      if script_type in ("", "text/javascript", "module"):
                          self.current_script = []

                  if tag not in self.void_tags:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  element_id = attrs_dict.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicates.append(element_id)
                      self.ids.add(element_id)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "script" and self.current_script is not None:
                      self.scripts.append("\n".join(self.current_script))
                      self.current_script = None

                  if tag in self.void_tags:
                      return
                  if not self.stack:
                      self.errors.append(f"unexpected closing tag </{tag}>")
                      return
                  if self.stack[-1] == tag:
                      self.stack.pop()
                      return
                  if tag in self.stack:
                      while self.stack and self.stack[-1] != tag:
                          self.errors.append(
                              f"missing closing tag </{self.stack.pop()}>"
                          )
                      if self.stack:
                          self.stack.pop()
                  else:
                      self.errors.append(f"closing tag without opener </{tag}>")

              def handle_data(self, data):
                  if self.current_script is not None:
                      self.current_script.append(data)

          text = Path("dashboard.html").read_text(encoding="utf-8")
          parser = AuditParser()
          parser.feed(text)
          parser.close()
          if parser.stack:
              parser.errors.extend(
                  f"unclosed tag <{tag}>" for tag in reversed(parser.stack)
              )

          report = {
              "duplicate_ids": sorted(set(parser.duplicates)),
              "structure_errors": parser.errors,
              "inline_script_count": len(parser.scripts),
              "id_count": len(parser.ids),
          }
          Path(".gym-next-2-tmp/html-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if report["duplicate_ids"] or report["structure_errors"]:
              print(json.dumps(report, ensure_ascii=False, indent=2))
              sys.exit(1)

          for index, script in enumerate(parser.scripts, 1):
              Path(
                  f".gym-next-2-tmp/scripts/{index:02d}-dashboard.js"
              ).write_text(script, encoding="utf-8")
          PY

          node --check config.js
          shopt -s nullglob
          for script in .gym-next-2-tmp/scripts/*.js; do
            node --check "${script}"
          done

      - name: Confirm existing API usage is unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r"/api/[A-Za-z0-9_?=&${}./:-]+")

          def endpoints(path):
              text = Path(path).read_text(encoding="utf-8")
              return {
                  value.rstrip("`'\"),;]")
                  for value in pattern.findall(text)
              }

          before = endpoints("/tmp/dashboard-before-next-2.html")
          after = endpoints("dashboard.html")

          if before != after:
              print("Removed API references:", sorted(before - after))
              print("Added API references:", sorted(after - before))
              sys.exit(1)

          print(f"API reference set unchanged: {len(after)} entries")
          PY

      - name: Verify existing owner functions and NEXT-2 behavior
        shell: bash
        run: |
          set -euo pipefail

          require_text() {
            local text="$1"
            local label="$2"
            if ! grep -Fq "${text}" "${TARGET_FILE}"; then
              echo "::error::Missing ${label}"
              exit 1
            fi
          }

          require_text "data-dpro-next-step=\"GYM-NEXT-2\"" "NEXT-2 marker"
          require_text "今すぐ対応" "urgent section"
          require_text "今日中の対応" "today task section"
          require_text "次回案内候補" "follow section"
          require_text "buildTodayGroups" "client-side task grouping"
          require_text "showSettingPanel" "settings content switch"
          require_text "settings-menu" "settings left menu"
          require_text "html { font-size:18px; }" "funeral-standard desktop font"
          require_text "html{font-size:17px}" "readable mobile font"
          require_text "管理コード削除" "admin code delete"
          require_text "clearAdminCode" "admin code clear function"
          require_text "電話・店頭予約" "phone and store booking"
          require_text "/api/admin/dashboard" "dashboard API"
          require_text "/api/admin/reservations/status" "status update API"
          require_text "/api/admin/customers/upsert" "customer save API"
          require_text "/api/admin/customers/tickets" "ticket API"
          require_text "/api/admin/settings" "settings API"
          require_text "/api/admin/activity-logs" "activity log API"
          require_text "default_slot_minutes:30" "30-minute slot rule"
          require_text "完了・回数減算" "completion and ticket deduction"
          require_text "requested" "requested status"
          require_text "confirmed" "confirmed status"
          require_text "arrived" "arrived status"
          require_text "in_session" "in-session status"
          require_text "completed" "completed status"
          require_text "cancel_requested" "cancel request status"
          require_text "change_requested" "change request status"
          require_text "no_show" "no-show status"

          if grep -Fq 'id="priorityTasks"' "${TARGET_FILE}"; then
            echo "::error::Legacy mixed-priority container remains."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import sys

          before_size = Path("/tmp/dashboard-before-next-2.html").stat().st_size
          after_size = Path("dashboard.html").stat().st_size

          if after_size > 150_000:
              raise SystemExit(f"dashboard.html is too large: {after_size} bytes")
          if after_size > before_size * 1.45:
              raise SystemExit(
                  f"dashboard.html grew too much: {before_size} -> {after_size}"
              )

          print(f"File size guard OK: {before_size} -> {after_size} bytes")
          PY

      - name: Confirm only dashboard changed before application commit
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(
            git status --short \
              | awk '{print $2}' \
              | grep -v -F -x "${WORKFLOW_FILE}" \
              | sed '/^$/d' || true
          )"

          if [[ "${CHANGED}" != "${TARGET_FILE}" ]]; then
            echo "::error::Unexpected files changed before application commit."
            echo "${CHANGED}"
            exit 1
          fi

          if git diff --quiet -- "${TARGET_FILE}"; then
            echo "::error::dashboard.html did not change."
            exit 1
          fi

          git diff --check -- "${TARGET_FILE}"

      - name: Commit and push owner screen update
        shell: bash
        run: |
          set -euo pipefail

          git add "${TARGET_FILE}"
          git commit -m "Complete GYM-NEXT-2 owner today UX"
          APP_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "APP_COMMIT_SHA=${APP_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Verify GitHub Pages published NEXT-2 dashboard
        shell: bash
        run: |
          set -euo pipefail

          VERIFIED=false
          for attempt in $(seq 1 24); do
            CHECK_URL="${PUBLIC_DASHBOARD_URL}&dpro_next_run=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --location --silent --show-error \
              --max-time 30 "${CHECK_URL}" \
              | grep -Fq 'data-dpro-next-step="GYM-NEXT-2"'; then
              VERIFIED=true
              break
            fi
            sleep 10
          done

          if [[ "${VERIFIED}" != "true" ]]; then
            echo "::error::GitHub Pages did not publish the NEXT-2 marker in time."
            exit 1
          fi

          echo "PUBLIC_VERIFIED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"

      - name: Create NEXT-2 completion report and update ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STEP_DIR}"
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-2.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-2

          - 結果: OK
          - 対象ファイル: dashboard.html
          - 変更前バックアップタグ: ${BACKUP_TAG}
          - アプリ変更コミット: ${APP_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - 公開確認日時: ${PUBLIC_VERIFIED_AT}
          - Actions: ${RUN_URL}

          ## 実施した変更

          - 今日やることを「今すぐ対応」「本日の予約」「今日中の対応」「次回案内候補」に分離
          - 既存ダッシュボード応答をブラウザ側だけで分類
          - 電話・店頭予約、予約確認、会員確認を主要操作として上部に配置
          - 施設設定を左メニューと内容切替へ変更
          - PC文字サイズを18px、スマホを17pxへ調整
          - スマホのヘッダー、カード、設定メニューの横はみ出し対策
          - 管理コード削除、電話予約、会員検索、設定保存など既存機能を維持

          ## 自動検査

          - 前STEP完了確認: OK
          - YAML構文: OK
          - HTML構造: OK
          - JavaScript構文: OK
          - HTML ID重複: OK
          - 既存API参照一致: OK
          - 既存機能維持: OK
          - パーソナルジム業務ロジック: OK
          - 30分枠維持: OK
          - ファイル容量ガード: OK
          - GitHub Pages公開反映: OK
          - Worker変更: なし
          - Supabase変更: なし
          - API変更: なし

          ## 次のSTEP

          ${NEXT_STEP}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-2-COMPLETE"
          next_step: "${NEXT_STEP}"
          result: "OK"
          baseline_config_version: "GYM-6-R2-CONFIG-RESTORE-URL-HEADER-FIX-20260717"
          facility_code: "${FACILITY_CODE}"
          slot_minutes: 30
          next_1_baseline_sha: "d6306daed290cb2abac8603d425885cbeeb40a4f"
          next_1_backup_tag: "backup-gym-before-next-20260725"
          step_backup_tag: "${BACKUP_TAG}"
          application_commit_sha: "${APP_COMMIT_SHA}"
          completed_at: "${COMPLETED_AT}"
          public_verified_at: "${PUBLIC_VERIFIED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_changed: false
          supabase_changed: false
          api_changed: false
          application_files_changed: true
          changed_files:
            - "dashboard.html"
          checks:
            previous_step: "OK"
            public_pages: "OK"
            yaml_syntax: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            existing_api_references: "OK"
            existing_features: "OK"
            personal_gym_logic: "OK"
            slot_minutes_30: "OK"
            file_size_guard: "OK"
            responsive_layout_rules: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true); puts 'Ledger YAML OK'"

          cp .gym-next-2-tmp/html-audit.json "${STEP_DIR}/GYM-NEXT-2-html-audit.json"
          {
            echo "before_sha256=${BEFORE_SHA256}"
            echo "after_sha256=${AFTER_SHA256}"
            echo "before_size=${BEFORE_SIZE}"
            echo "after_size=${AFTER_SIZE}"
            echo "application_commit_sha=${APP_COMMIT_SHA}"
          } > "${STEP_DIR}/GYM-NEXT-2-file-record.txt"

      - name: Upload NEXT-2 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-2-owner-ux-audit
          path: |
            dpro-next/gym/next-ledger.yml
