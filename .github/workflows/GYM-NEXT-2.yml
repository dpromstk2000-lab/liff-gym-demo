                      <button class="quick-action" type="button" onclick="showView('reservations')"><span>予約を確認</span><small>期間・状態から予約を検索</small></button>
                      <button class="quick-action" type="button" onclick="showView('customers')"><span>会員を確認</span><small>履歴・回数券・注意事項を確認</small></button>
                    </div>
                    <div class="stats">
                      <div class="stat blue"><span>予約</span><strong id="countReservations">-</strong></div><div class="stat red"><span>承認待ち</span><strong id="countPending">-</strong></div><div class="stat"><span>相談・連絡</span><strong id="countInquiries">-</strong></div><div class="stat"><span>フォロー期限</span><strong id="countFollow">-</strong></div><div class="stat green"><span>残り1回以下</span><strong id="countLowTickets">-</strong></div>
                    </div>
                    <section class="card priority-card"><div class="section-head"><div><h3>今すぐ対応</h3><p class="sub">承認待ち・変更希望・キャンセル希望・未対応相談です。</p></div><span class="section-count" id="urgentTaskCount">0</span></div><div class="list" id="urgentTasks" aria-live="polite"></div></section>
                    <div class="today-board">
                      <section class="card"><div class="section-head"><div><h3>本日の予約</h3><p class="sub">来店から完了まで、表示されたボタンを順番に押します。</p></div><span class="section-count green" id="todayReservationCount">0</span></div><div class="list" id="todayReservations"></div></section>
                      <div class="support-column">
                        <section class="card"><div class="section-head"><div><h3>今日中の対応</h3><p class="sub">期限が来ているフォローを確認します。</p></div><span class="section-count amber" id="todayTaskCount">0</span></div><div class="list" id="todayTasks"></div></section>
                        <section class="card"><div class="section-head"><div><h3>次回案内候補</h3><p class="sub">回数券が少ない会員へ個別に案内します。</p></div><span class="section-count green" id="followTaskCount">0</span></div><div class="list" id="followTasks"></div></section>
                      </div>
                    </div>
                  </section>"""
          replace_once(old_today, new_today, "today section")

          old_settings = """        <section class="view" id="view-settings">
                    <div class="page-head"><div><h2>施設設定</h2><p class="sub">営業時間・休み・予約受付条件を設定します。予約枠は30分固定です。</p></div></div>
                    <div class="card"><div class="settings-grid"><div><label for="settingOpen">営業開始</label><input id="settingOpen" type="time" step="1800"></div><div><label for="settingClose">営業終了</label><input id="settingClose" type="time" step="1800"></div><div><label for="settingMaxDays">予約可能日数</label><input id="settingMaxDays" type="number" min="1" max="365"></div><div><label for="settingLead">予約までの最低時間</label><input id="settingLead" type="number" min="0" max="168"></div><div><label for="settingCancel">キャンセル期限（時間前）</label><input id="settingCancel" type="number" min="0" max="336"></div><div><label for="settingParallel">同時セッション上限</label><input id="settingParallel" type="number" min="1" max="20"></div><div class="span-2"><label>定休日</label><div class="checkbox-row" id="weekdayChecks"></div></div><div class="span-2"><label for="settingClosedDates">臨時休業日（1行に1日・YYYY-MM-DD）</label><textarea id="settingClosedDates"></textarea></div><div class="span-2"><label for="settingNotice">予約画面のお知らせ</label><textarea id="settingNotice"></textarea></div></div><div class="modal-actions"><button class="btn btn-blue" type="button" onclick="saveSettings()">設定を保存</button></div></div>
                  </section>"""
