name: STEP GYM-NEXT-2 - Owner Today UX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-2-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-2
  SYSTEM_NAME: DPRO パーソナルジム LINE
  FACILITY_CODE: dpro_gym_demo
  CURRENT_STEP_REQUIRED: GYM-NEXT-1-COMPLETE
  NEXT_STEP: GYM-NEXT-3
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-2.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  TARGET_FILE: dashboard.html
  EXPECTED_DASHBOARD_BLOB: 2d7d98012eb581068bdd040bf487884cf19dbdb1
  BACKUP_TAG: backup-gym-before-next-2-20260725
  PUBLIC_DASHBOARD_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/dashboard.html?demo=1

jobs:
  owner-next-ux:
    name: Improve owner today screen without API changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Record STEP metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "STARTED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Confirm NEXT-1 completion and safe upload commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${LEDGER_FILE}" ]]; then
            echo "::error::Completion ledger is missing: ${LEDGER_FILE}"
            exit 1
          fi

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"
          LEDGER_NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"
          LEDGER_RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" \
              | head -n 1 \
              | tr -d '"\r'
          )"

          if [[ "${CURRENT_STEP}" != "${CURRENT_STEP_REQUIRED}" ]]; then
            echo "::error::Previous STEP is not complete: ${CURRENT_STEP}"
            exit 1
          fi
          if [[ "${LEDGER_NEXT_STEP}" != "${STEP_NAME}" ]]; then
            echo "::error::Ledger next_step is not ${STEP_NAME}: ${LEDGER_NEXT_STEP}"
            exit 1
          fi
          if [[ "${LEDGER_RESULT}" != "OK" ]]; then
            echo "::error::Previous STEP result is not OK: ${LEDGER_RESULT}"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::This workflow must run on main."
            exit 1
          fi

          if [[ ! -f "${WORKFLOW_FILE}" ]]; then
            echo "::error::Workflow file is missing: ${WORKFLOW_FILE}"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" \
                | grep -v -F -x "${WORKFLOW_FILE}" \
                | sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::The upload commit must contain only ${WORKFLOW_FILE}."
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          echo "UPLOAD_PARENT=${UPLOAD_PARENT}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-2 version with backup tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING_SHA="$(git rev-list -n 1 "${BACKUP_TAG}")"
            if [[ "${EXISTING_SHA}" != "${UPLOAD_PARENT}" ]]; then
              echo "::error::Backup tag already points to another commit."
              echo "Expected: ${UPLOAD_PARENT}"
              echo "Existing: ${EXISTING_SHA}"
              exit 1
            fi
          else
            git tag -a "${BACKUP_TAG}" "${UPLOAD_PARENT}" \
              -m "DPRO パーソナルジム LINE before GYM-NEXT-2"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify protected dashboard baseline
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${TARGET_FILE}" ]]; then
            echo "::error::Missing target file: ${TARGET_FILE}"
            exit 1
          fi

          CURRENT_BLOB="$(git hash-object "${TARGET_FILE}")"
          if [[ "${CURRENT_BLOB}" != "${EXPECTED_DASHBOARD_BLOB}" ]]; then
            echo "::error::dashboard.html differs from the inspected GYM-6-R2 baseline."
            echo "Expected blob: ${EXPECTED_DASHBOARD_BLOB}"
            echo "Current blob:  ${CURRENT_BLOB}"
            exit 1
          fi

          cp "${TARGET_FILE}" /tmp/dashboard-before-next-2.html
          echo "BEFORE_SHA256=$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "BEFORE_SIZE=$(stat -c '%s' "${TARGET_FILE}")" >> "$GITHUB_ENV"

      - name: Apply DPRO NEXT owner screen changes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path("dashboard.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one anchor, found {count}"
                  )
              text = text.replace(old, new, 1)

          replace_once(
              "<body>",
              '<body data-dpro-next-step="GYM-NEXT-2">',
              "NEXT marker",
          )

          replace_once(
              "    html { font-size:17px; }",
              "    html { font-size:18px; }",
              "desktop font size",
          )

          css_anchor = "    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }"
          css_block = """    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
              .quick-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
              .quick-action { min-width:0; min-height:78px; border:1px solid var(--line); border-radius:17px; padding:13px 15px; text-align:left; color:var(--navy); background:#fff; box-shadow:0 6px 18px rgba(20,38,70,.04); }
              .quick-action.primary { border-color:#98b9f8; color:#fff; background:linear-gradient(135deg,var(--blue),var(--blue2)); }
              .quick-action span { display:block; font-size:1rem; font-weight:950; }
              .quick-action small { display:block; margin-top:3px; color:var(--muted); font-size:.76rem; font-weight:750; }
              .quick-action.primary small { color:#e5edff; }
              .priority-card { border:2px solid #f0b4bb; background:#fff7f8; }
              .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
              .section-count { display:inline-grid; place-items:center; min-width:34px; height:34px; border-radius:999px; padding:0 10px; color:#fff; background:var(--red); font-size:.8rem; font-weight:950; }
              .section-count.amber { background:var(--amber); }
              .section-count.green { background:var(--green); }
              .today-board { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr); gap:14px; align-items:start; }
              .support-column { display:grid; gap:14px; }
              .support-column .card { margin-bottom:0; }
              .settings-shell { display:grid; grid-template-columns:210px minmax(0,1fr); gap:16px; align-items:start; }
              .settings-menu { position:sticky; top:93px; display:grid; gap:7px; }
              .settings-menu-btn { width:100%; min-height:48px; border:0; border-radius:13px; padding:9px 12px; text-align:left; color:#4c5a70; background:#eef2f7; font-weight:900; }
              .settings-menu-btn.active { color:#fff; background:var(--blue); }
              .settings-content { min-width:0; }
              .settings-panel { display:none; }
              .settings-panel.active { display:block; }
              .settings-panel h3 { margin-bottom:4px; }
              .settings-save { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
              .settings-save .sub { margin:0; }"""
          replace_once(css_anchor, css_block, "NEXT CSS")

          old_media_1080 = "    @media (max-width:1080px) { .layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:6px}.nav-btn{flex:0 0 auto;width:auto;margin:0}.stats{grid-template-columns:repeat(3,1fr)} }"
          new_media_1080 = "    @media (max-width:1080px) { .layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:6px}.nav-btn{flex:0 0 auto;width:auto;margin:0}.stats{grid-template-columns:repeat(3,1fr)}.today-board{grid-template-columns:1fr}.settings-menu{position:static} }"
          replace_once(old_media_1080, new_media_1080, "tablet CSS")

          old_media_760 = "    @media (max-width:760px) { html{font-size:16px}.header-inner{align-items:flex-start}.header-actions{max-width:52%}.stats{grid-template-columns:1fr 1fr}.grid-2,.settings-grid,.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.page-head{display:block}.page-actions{justify-content:flex-start;margin-top:10px}.layout{padding:11px}.card{padding:14px} }"
          new_media_760 = "    @media (max-width:760px) { html{font-size:17px}.header-inner{display:block;padding:12px}.header-actions{max-width:none;justify-content:flex-start;margin-top:10px}.header-actions .btn{flex:1 1 145px}.stats{grid-template-columns:1fr 1fr}.quick-actions{grid-template-columns:1fr}.today-board,.settings-shell,.grid-2,.settings-grid,.form-grid{grid-template-columns:1fr}.settings-menu{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.settings-menu-btn{flex:0 0 auto;width:auto;white-space:nowrap}.span-2{grid-column:auto}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.page-head{display:block}.page-actions{justify-content:flex-start;margin-top:10px}.page-actions input{min-width:0}.layout{padding:11px}.card{padding:14px}.section-head{align-items:center}.item-top{display:block}.item-top .badge{margin-top:7px} }"
          replace_once(old_media_760, new_media_760, "mobile CSS")

          old_today = """        <section class="view active" id="view-today">
                    <div class="page-head"><div><h2>今日やること</h2><p class="sub" id="todayLabel">予約と優先対応を確認します。</p></div><div class="page-actions"><input id="dashboardDate" type="date"><button class="btn btn-blue" type="button" onclick="loadDashboard()">日付を表示</button><button class="btn btn-dark" type="button" onclick="prepareDemo()">営業前DEMO準備</button></div></div>
                    <div class="stats">
                      <div class="stat blue"><span>予約</span><strong id="countReservations">-</strong></div><div class="stat red"><span>承認待ち</span><strong id="countPending">-</strong></div><div class="stat"><span>相談・連絡</span><strong id="countInquiries">-</strong></div><div class="stat"><span>フォロー期限</span><strong id="countFollow">-</strong></div><div class="stat green"><span>残り1回以下</span><strong id="countLowTickets">-</strong></div>
                    </div>
                    <div class="grid-2"><div class="card"><h3>本日の予約</h3><p class="sub">来店から完了まで順番に更新します。</p><div class="list" id="todayReservations"></div></div><div class="card"><h3>優先対応</h3><p class="sub">承認待ち・相談・継続フォローを上から確認します。</p><div class="list" id="priorityTasks"></div></div></div>
                  </section>"""
          new_today = """        <section class="view active" id="view-today">
                    <div class="page-head"><div><p class="brand">DPRO NEXT</p><h2>今日やること</h2><p class="sub" id="todayLabel">今すぐ必要な操作から順番に表示します。</p></div><div class="page-actions"><input id="dashboardDate" type="date" aria-label="表示日"><button class="btn btn-blue" type="button" onclick="loadDashboard()">日付を表示</button><button class="btn btn-dark" type="button" onclick="prepareDemo()">営業前DEMO準備</button></div></div>
                    <div class="quick-actions" aria-label="主要操作">
