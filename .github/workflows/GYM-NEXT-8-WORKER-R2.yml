name: STEP GYM-NEXT-8-WORKER-R2 - Fix Follow-up Snooze Guard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-8-WORKER-R2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gym-next-8-worker-r2-main
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-8-WORKER-R2.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  PACKAGE_DIR: dpro-next/gym/deploy/GYM-NEXT-8
  PACKAGE_WORKER: dpro-next/gym/deploy/GYM-NEXT-8/worker.js
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-8-worker-r2-20260725
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  CURRENT_VERSION: GYM-NEXT-8-WORKER-20260725
  EXPECTED_VERSION: GYM-NEXT-8-WORKER-R2-20260725
  EXPECTED_SHA256: 4555776fa0dc64f9d32ebe784a49000e8068743a72921c5f2d76735c77918ec8

jobs:
  correct:
    name: Correct NEXT-8 follow-up action guards
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-8 prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${PACKAGE_WORKER}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "GYM-NEXT-8-PREPARED" ]] || {
            echo "::error::Expected GYM-NEXT-8-PREPARED, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "GYM-NEXT-8-VERIFY" ]] || {
            echo "::error::Expected GYM-NEXT-8-VERIFY, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Expected PREPARED, got ${RESULT}"
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          echo "STEP_BASE_SHA=${UPLOAD_PARENT}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect current prepared package
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "DPRO パーソナルジム before NEXT-8 Worker R2"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current package and deployed R1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object "${PACKAGE_WORKER}")" == \
             "044ca5170773ecf51b53804e55630c5b4612500c" ]] || {
            echo "::error::Stored NEXT-8 Worker differs from inspected R1."
            exit 1
          }

          mkdir -p /tmp/gym-next-8-r2
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --output /tmp/gym-next-8-r2/health.json \
            "${WORKER_BASE}/api/health?r2=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-8-r2/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("version") == "GYM-NEXT-8-WORKER-20260725", data
          assert data.get("next8", {}).get("ok") is True, data
          features = data.get("features", {})
          assert features.get("follow_up_board") is True, data
          assert features.get("follow_up_action_log") is True, data
          assert features.get("automatic_line_broadcast") is False, data
          PY

      - name: Apply compact R2 Worker patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/gym-next-8-r2/worker.patch <<'PATCH'
          --- a/worker.js
          +++ b/worker.js
          @@ -2,7 +2,7 @@
             STEP GYM-NEXT-8
             DPRO パーソナルジム LINE API
             Worker name: dpro-gym-line-api
          -  Worker version: GYM-NEXT-8-WORKER-20260725
          +  Worker version: GYM-NEXT-8-WORKER-R2-20260725
 
             Cloudflare Secrets:
               SUPABASE_URL
          @@ -17,7 +17,7 @@
               ALLOW_DEMO_ADMIN_FALLBACK   false（通常は設定不要）
           ============================================================ */
 
          -const VERSION = 'GYM-NEXT-8-WORKER-20260725';
          +const VERSION = 'GYM-NEXT-8-WORKER-R2-20260725';
           const SERVICE = 'DPRO Personal Gym LINE API';
           const DEFAULT_FACILITY_CODE = 'dpro_gym_demo';
           const DEMO_CONFIRM_TEXT = 'DEMOパーソナルジムだけ実行';
          @@ -333,7 +333,9 @@
               follow_up_board: false,
               interaction_log: false,
               derived_without_schema_change: false,
          -    manual_line_copy_only: true
          +    manual_line_copy_only: true,
          +    snooze_guard: false,
          +    recent_done_guard: false
             };
 
             try {
          @@ -401,7 +403,9 @@
                 follow_up_board: true,
                 interaction_log: true,
                 derived_without_schema_change: true,
          -      manual_line_copy_only: true
          +      manual_line_copy_only: true,
          +      snooze_guard: true,
          +      recent_done_guard: true
               };
             } catch (error) {
               next8 = {
          @@ -410,7 +414,9 @@
                 follow_up_board: false,
                 interaction_log: false,
                 derived_without_schema_change: false,
          -      manual_line_copy_only: true
          +      manual_line_copy_only: true,
          +      snooze_guard: false,
          +      recent_done_guard: false
               };
             }
 
          @@ -457,6 +463,8 @@
                 follow_up_prioritization: true,
                 follow_up_action_log: Boolean(next8?.interaction_log),
                 follow_up_message_copy_only: true,
          +      follow_up_snooze_guard: Boolean(next8?.snooze_guard),
          +      follow_up_recent_done_guard: Boolean(next8?.recent_done_guard),
                 automatic_line_broadcast: false,
                 system_check: true,
                 demo_prepare: true
          @@ -1108,6 +1116,33 @@
                   : 'follow';
 
               const latest = latestInteraction.get(customer.id) || null;
          +
          +    // STEP GYM-NEXT-8 R2:
          +    // 延期中の会員は指定日まで候補へ戻さない。
          +    const scheduledForFuture =
          +      customer.follow_status === 'scheduled' &&
          +      nextFollow &&
          +      nextFollow > today;
          +    if (scheduledForFuture) return;
          +
          +    // 対応済みの直後に、残り回数など同じ条件だけで
          +    // 即時再表示されることを防ぐ。明示的な期限到来は優先する。
          +    const latestCompletedOn =
          +      latest?.status === 'completed' && latest.created_at
          +        ? formatJstDate(new Date(latest.created_at))
          +        : null;
          +    const daysSinceLatestCompleted = isYmd(latestCompletedOn)
          +      ? followUpDayDiff(latestCompletedOn, today)
          +      : null;
          +    if (
          +      !explicitDue &&
          +      daysSinceLatestCompleted !== null &&
          +      daysSinceLatestCompleted >= 0 &&
          +      daysSinceLatestCompleted < 7
          +    ) {
          +      return;
          +    }
          +
               const candidate = {
                 customer: adminCustomer(customer),
                 reasons: uniqueReasons,
          PATCH

          (
            cd "${PACKAGE_DIR}"
            patch -p1 --forward --batch \
              -i /tmp/gym-next-8-r2/worker.patch
          )

          cp "${PACKAGE_WORKER}" /tmp/gym-next-8-r2/worker.mjs
          node --check /tmp/gym-next-8-r2/worker.mjs

          grep -Fq "const VERSION = '${EXPECTED_VERSION}';" \
            "${PACKAGE_WORKER}"
          grep -Fq "follow_up_snooze_guard: Boolean(next8?.snooze_guard)" \
            "${PACKAGE_WORKER}"
          grep -Fq "follow_up_recent_done_guard: Boolean(next8?.recent_done_guard)" \
            "${PACKAGE_WORKER}"
          grep -Fq "if (scheduledForFuture) return;" \
            "${PACKAGE_WORKER}"
          grep -Fq "daysSinceLatestCompleted < 7" \
            "${PACKAGE_WORKER}"

          ACTUAL_SHA256="$(
            sha256sum "${PACKAGE_WORKER}" | awk '{print $1}'
          )"
          [[ "${ACTUAL_SHA256}" == "${EXPECTED_SHA256}" ]] || {
            echo "::error::Corrected Worker SHA-256 mismatch."
            echo "Expected: ${EXPECTED_SHA256}"
            echo "Actual:   ${ACTUAL_SHA256}"
            exit 1
          }

          (
            cd "${PACKAGE_DIR}"
            rm -f GYM-NEXT-8-WORKER.zip
            zip -q GYM-NEXT-8-WORKER.zip worker.js
          )
          sha256sum "${PACKAGE_WORKER}" \
            > "${PACKAGE_DIR}/SHA256SUMS.txt"

          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "dpro-next/gym/deploy/GYM-NEXT-8/manifest.yml"
          )
          text = manifest.read_text(encoding="utf-8")
          text = text.replace(
              'package_version: "GYM-NEXT-8-PREP-20260725"',
              'package_version: "GYM-NEXT-8-PREP-R2-20260725"',
              1,
          )
          text = text.replace(
              'worker_expected_version: "GYM-NEXT-8-WORKER-20260725"',
              'worker_expected_version: "GYM-NEXT-8-WORKER-R2-20260725"',
              1,
          )
          if "follow_up_snooze_guard" not in text:
              text += (
                  "\nr2_guards:\n"
                  '  follow_up_snooze_guard: true\n'
                  '  follow_up_recent_done_guard: true\n'
              )
          manifest.write_text(text, encoding="utf-8", newline="\n")
          PY

          ruby -e "require 'yaml'; YAML.load_file('${PACKAGE_DIR}/manifest.yml', aliases: true)"

      - name: Confirm no runtime files changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git status --porcelain=v1 --untracked-files=all |
              sed -E 's/^.. //' |
              sed 's/^"//;s/"$//' |
              grep -v -F -x "${WORKFLOW_FILE}" |
              sed '/^$/d' |
              sort
          )

          EXPECTED="$(
            printf '%s\n' \
              "${PACKAGE_DIR}/GYM-NEXT-8-WORKER.zip" \
              "${PACKAGE_DIR}/SHA256SUMS.txt" \
              "${PACKAGE_DIR}/manifest.yml" \
              "${PACKAGE_WORKER}" |
              sort
          )"

          [[ "$(printf '%s\n' "${CHANGED[@]}")" == "${EXPECTED}" ]] || {
            echo "::error::Unexpected files changed."
            printf 'Changed:\n%s\n' "${CHANGED[*]}"
            exit 1
          }

          for file in \
            config.js index.html member.html dashboard.html \
            owner-ipad.html staff.html system-check.html
          do
            git diff --quiet -- "${file}" || {
              echo "::error::Runtime file changed: ${file}"
              exit 1
            }
          done
          git diff --check

      - name: Commit corrected Worker package
        shell: bash
        run: |
          set -euo pipefail
          git add "${PACKAGE_DIR}"
          git commit -m "Correct GYM-NEXT-8 follow-up guards R2"
          PACKAGE_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "PACKAGE_COMMIT_SHA=${PACKAGE_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Update prepared ledger and self-delete
        shell: bash
        run: |
          set -euo pipefail
          export CORRECTED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-8-WORKER-R2.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-8 Worker R2

          - 結果: PREPARED
          - 修正後Worker: ${EXPECTED_VERSION}
          - 3日後・7日後の延期ガード: OK
          - 対応済み後7日間の再表示防止: OK
          - 明示的な期限到来の優先: OK
          - LINE自動送信: なし
          - Supabase変更: なし
          - 公開画面変更: なし
          - 修正日時: ${CORRECTED_AT}
          - Actions: ${RUN_URL}
          EOF

          python3 <<'PY'
          from pathlib import Path
          import os

          path = Path("dpro-next/gym/next-ledger.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'workflow_revision: "R1"',
              'workflow_revision: "R2"',
              1,
          )
          text = text.replace(
              'expected_worker_version: "GYM-NEXT-8-WORKER-20260725"',
              'expected_worker_version: "GYM-NEXT-8-WORKER-R2-20260725"',
              1,
          )
          text = text.replace(
              'worker_sha256: "b5be892badfe91ffaa76d2d38b2fd54cf4310af519b4e2484ef8d72d75225995"',
              'worker_sha256: "4555776fa0dc64f9d32ebe784a49000e8068743a72921c5f2d76735c77918ec8"',
              1,
          )
          old_commit = (
              'package_commit_sha: '
              '"3399f57f593a7d290b701fb2f92c6bb21853bb7d"'
          )
          new_commit = (
              'package_commit_sha: '
              f'"{os.environ["PACKAGE_COMMIT_SHA"]}"'
          )
          text = text.replace(old_commit, new_commit, 1)
          if "worker_r2_correction:" not in text:
              text += (
                  "\nworker_r2_correction:\n"
                  "  follow_up_snooze_guard: true\n"
                  "  follow_up_recent_done_guard: true\n"
                  f'  corrected_at: "{os.environ["CORRECTED_AT"]}"\n'
                  f'  workflow_run_url: "{os.environ["RUN_URL"]}"\n'
              )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-8 Worker R2 correction"
          git push origin HEAD:main

      - name: Correction summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-8 Worker R2 prepared"
            echo ""
            echo "- Snooze guard: OK"
            echo "- Recent completed guard: OK"
            echo "- Runtime UI changed: false"
            echo "- Supabase changed: false"
            echo "- Next: deploy ${EXPECTED_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
