name: STEP GYM-NEXT-8-RECOVERY - Remove Duplicate Preparation Workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-8-RECOVERY.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gym-next-8-recovery-main
  cancel-in-progress: false

env:
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  PACKAGE_WORKER: dpro-next/gym/deploy/GYM-NEXT-8/worker.js
  STALE_WORKFLOW_FILE: .github/workflows/GYM-NEXT-8.yml
  RECOVERY_WORKFLOW_FILE: .github/workflows/GYM-NEXT-8-RECOVERY.yml
  EXPECTED_STEP: GYM-NEXT-8-PREPARED
  EXPECTED_NEXT_STEP: GYM-NEXT-8-VERIFY
  EXPECTED_WORKER_VERSION: GYM-NEXT-8-WORKER-20260725
  EXPECTED_WORKER_SHA256: b5be892badfe91ffaa76d2d38b2fd54cf4310af519b4e2484ef8d72d75225995
  STEP_DIR: dpro-next/gym/steps

jobs:
  recover:
    name: Confirm prepared state and remove duplicate workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-8 is already prepared
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${PACKAGE_WORKER}"
          test -f "${RECOVERY_WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          WORKER_DEPLOYED="$(
            sed -n 's/^worker_deployed:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${EXPECTED_STEP}" ]] || {
            echo "::error::Expected ${EXPECTED_STEP}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "${EXPECTED_NEXT_STEP}" ]] || {
            echo "::error::Expected ${EXPECTED_NEXT_STEP}, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Expected PREPARED, got ${RESULT}"
            exit 1
          }
          [[ "${WORKER_DEPLOYED}" == "false" ]] || {
            echo "::error::Worker deployment state is not false."
            exit 1
          }

          grep -Fq "const VERSION = '${EXPECTED_WORKER_VERSION}';" \
            "${PACKAGE_WORKER}"

          ACTUAL_SHA256="$(
            sha256sum "${PACKAGE_WORKER}" | awk '{print $1}'
          )"
          [[ "${ACTUAL_SHA256}" == "${EXPECTED_WORKER_SHA256}" ]] || {
            echo "::error::NEXT-8 Worker SHA-256 does not match."
            echo "Expected: ${EXPECTED_WORKER_SHA256}"
            echo "Actual:   ${ACTUAL_SHA256}"
            exit 1
          }

          echo "NEXT-8 preparation and Worker package are already complete."

      - name: Remove duplicate workflow and record recovery
        shell: bash
        run: |
          set -euo pipefail
          RECOVERED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-8-DUPLICATE-CLEANUP.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-8 duplicate cleanup

          - 結果: OK
          - NEXT-8準備状態: 維持
          - Workerパッケージ: 維持
          - Supabase変更: なし
          - 公開画面変更: なし
          - 削除対象: ${STALE_WORKFLOW_FILE}
          - 復旧YML: 自動削除
          - 復旧日時: ${RECOVERED_AT}
          - 次の操作: dpro-gym-line-apiへNEXT-8 WorkerをDeploy
          EOF

          git add "${STEP_DIR}/GYM-NEXT-8-DUPLICATE-CLEANUP.md"

          if [[ -f "${STALE_WORKFLOW_FILE}" ]]; then
            git rm "${STALE_WORKFLOW_FILE}"
          fi

          git rm "${RECOVERY_WORKFLOW_FILE}"

          git diff --cached --check
          git commit -m "Clean duplicate GYM-NEXT-8 workflow"
          git push origin HEAD:main

      - name: Recovery summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-8 duplicate cleanup complete"
            echo ""
            echo "- Prepared state preserved: OK"
            echo "- Worker package preserved: OK"
            echo "- Runtime files changed: false"
            echo "- Supabase changed: false"
            echo "- Duplicate workflow removed: OK"
            echo "- Next: Deploy GYM-NEXT-8 Worker"
          } >> "$GITHUB_STEP_SUMMARY"
