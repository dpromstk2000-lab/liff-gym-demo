          -  Worker version: GYM-NEXT-5-WORKER-20260725
          +  Worker version: GYM-NEXT-6-WORKER-20260725
 
             Cloudflare Secrets:
               SUPABASE_URL
               SUPABASE_SERVICE_ROLE_KEY
          -    ADMIN_TOKEN                 デモは 1234
          +    ADMIN_TOKEN                 オーナー・デモは 1234
          +    STAFF_TOKEN                 受付・スタッフ（推奨デモ値 5678）
 
             Optional variables:
               DEMO_FACILITY_CODE          dpro_gym_demo
          @@ -16,7 +17,7 @@
               ALLOW_DEMO_ADMIN_FALLBACK   false（通常は設定不要）
           ============================================================ */
 
