name: STEP GYM-NEXT-6 - Prepare iPad and Staff Role Separation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-6.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-6-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-6
  CURRENT_STEP_REQUIRED: GYM-NEXT-5-COMPLETE
  NEXT_ACTION: SET_STAFF_TOKEN_AND_DEPLOY_WORKER
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-6.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  SOURCE_WORKER: dpro-next/gym/deploy/GYM-NEXT-5/worker.js
  PACKAGE_DIR: dpro-next/gym/deploy/GYM-NEXT-6
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-6-20260725
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  CURRENT_WORKER_VERSION: GYM-NEXT-5-WORKER-20260725
  EXPECTED_WORKER_VERSION: GYM-NEXT-6-WORKER-20260725
  WORKER_B64: ""
  MANIFEST_B64: ""

jobs:
  prepare:
    name: Prepare staff API Worker without runtime changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm NEXT-5 completion and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::Previous STEP result is not OK."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-NEXT-6 version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム LINE before GYM-NEXT-6"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify current UI source and Worker baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob config.js 94619ddc2fd2dd43b6d3cb99ba2349eef9d1f705
          check_blob dashboard.html 538199c142e44d4ee03953d29359c1b341c4ca28
          check_blob owner-ipad.html 04b119e1f32a5156f94a64079c6d751253d7dfff
          check_blob "${SOURCE_WORKER}" c248345348ae3dccb485f4d1bbdb3eb2bffd0329

          if [[ -e staff.html ]]; then
            echo "::error::staff.html already exists unexpectedly."
            exit 1
          fi

          mkdir -p /tmp/gym-next-6
          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-6/health.json             "${WORKER_BASE}/api/health?prepare=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-6/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("version") == "GYM-NEXT-5-WORKER-20260725", data
          assert data.get("next4", {}).get("ok") is True, data
          assert data.get("next5", {}).get("ok") is True, data
          assert data.get("features", {}).get("atomic_admission") is True, data
          assert data.get("features", {}).get("session_records") is True, data
          PY

      - name: Generate NEXT-6 Worker package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}"

          printf '%s' "${WORKER_B64}" |
            base64 --decode > "${PACKAGE_DIR}/worker.js"
          printf '%s' "${MANIFEST_B64}" |
            base64 --decode > "${PACKAGE_DIR}/manifest.yml"

          cp "${PACKAGE_DIR}/worker.js" /tmp/gym-next-6/worker.mjs
          node --check /tmp/gym-next-6/worker.mjs
          ruby -e "require 'yaml'; YAML.load_file('${PACKAGE_DIR}/manifest.yml', aliases: true)"

          grep -Fq "const VERSION = '${EXPECTED_WORKER_VERSION}';"             "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/staff/health" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/staff/today" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/staff/reservations/status" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/staff/customers" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/staff/session-records/upsert" "${PACKAGE_DIR}/worker.js"
          grep -Fq "/api/staff/sessions/complete" "${PACKAGE_DIR}/worker.js"
          grep -Fq "function requireStaff" "${PACKAGE_DIR}/worker.js"
          grep -Fq "role_separation: true" "${PACKAGE_DIR}/worker.js"

          for existing in             "/api/admin/dashboard"             "/api/admin/trial-pipeline"             "/api/admin/customers/admit"             "/api/admin/sessions/complete"             "/api/member/home"             "/api/public/reservations"
          do
            grep -Fq "${existing}" "${PACKAGE_DIR}/worker.js"
          done

          (
            cd "${PACKAGE_DIR}"
            zip -q GYM-NEXT-6-WORKER.zip worker.js
          )
          sha256sum "${PACKAGE_DIR}/worker.js"             > "${PACKAGE_DIR}/SHA256SUMS.txt"

      - name: Confirm preparation changed no runtime files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_FILES < <(
            git status --porcelain=v1 --untracked-files=all |
              sed -E 's/^.. //' |
              sed 's/^"//;s/"$//' |
              grep -v -F -x "${WORKFLOW_FILE}" |
              sed '/^$/d' || true
          )

          [[ "${#CHANGED_FILES[@]}" -gt 0 ]] || {
            echo "::error::NEXT-6 package was not generated."
            exit 1
          }

          for changed_file in "${CHANGED_FILES[@]}"; do
            case "${changed_file}" in
              "${PACKAGE_DIR}/"*)
                ;;
              *)
                echo "::error::Unexpected file changed: ${changed_file}"
                exit 1
                ;;
            esac
          done

          for file in             "${PACKAGE_DIR}/worker.js"             "${PACKAGE_DIR}/manifest.yml"             "${PACKAGE_DIR}/GYM-NEXT-6-WORKER.zip"             "${PACKAGE_DIR}/SHA256SUMS.txt"
          do
            [[ -s "${file}" ]] || {
              echo "::error::Required file missing or empty: ${file}"
              exit 1
            }
          done

          for file in             config.js dashboard.html owner-ipad.html             index.html member.html system-check.html
          do
            git diff --quiet -- "${file}" || {
              echo "::error::Runtime file changed during preparation: ${file}"
              exit 1
            }
          done

      - name: Commit NEXT-6 deployment package
        shell: bash
        run: |
          set -euo pipefail
          git add "${PACKAGE_DIR}"
          git diff --cached --check
          git commit -m "Prepare GYM-NEXT-6 staff role Worker"
          PACKAGE_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "PACKAGE_COMMIT_SHA=${PACKAGE_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Record prepared state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          PREPARED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          WORKER_SHA256="$(
            sha256sum "${PACKAGE_DIR}/worker.js" |
              awk '{print $1}'
          )"

          cat > "${STEP_DIR}/GYM-NEXT-6-PREPARED.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-6 PREPARED

          - 結果: PREPARED
          - Supabase変更: なし
          - 正式Worker: dpro-gym-line-api
          - 更新後バージョン: ${EXPECTED_WORKER_VERSION}
          - 新しいSecret: STAFF_TOKEN
          - デモ推奨スタッフコード: 5678
          - PC管理コード: 1234のまま
          - iPad受付: STAFF_TOKENへ変更予定
          - staff.html: VERIFYで新規作成予定
          - 公開中の本体画面: 変更なし
          - Worker SHA-256: ${WORKER_SHA256}
          - バックアップタグ: ${BACKUP_TAG}
          - パッケージコミット: ${PACKAGE_COMMIT_SHA}
          - 準備日時: ${PREPARED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-6-PREPARED"
          workflow_revision: "R1"
          next_step: "GYM-NEXT-6-VERIFY"
          next_action: "${NEXT_ACTION}"
          result: "PREPARED"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          package_commit_sha: "${PACKAGE_COMMIT_SHA}"
          prepared_at: "${PREPARED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          current_worker_version: "${CURRENT_WORKER_VERSION}"
          expected_worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_sha256: "${WORKER_SHA256}"
          staff_token_required: true
          recommended_demo_staff_code: "5678"
          supabase_changed: false
          runtime_files_changed: false
          worker_deployed: false
          planned_runtime_files:
            - "config.js"
            - "owner-ipad.html"
            - "staff.html"
          planned_roles:
            owner_pc: "ADMIN_TOKEN / 全体管理"
            owner_ipad: "STAFF_TOKEN / 受付"
            staff: "STAFF_TOKEN / セッション"
            member_line: "LINE / 会員操作"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            current_worker_health: "OK"
            next4_preserved: "OK"
            next5_preserved: "OK"
            source_worker_blob: "OK"
            worker_javascript_syntax: "OK"
            staff_api_contract: "OK"
            existing_api_contract: "OK"
            runtime_unchanged: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-6 prepared state"
          git push origin HEAD:main

      - name: Upload NEXT-6 deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-6-worker-package
          path: |
            dpro-next/gym/deploy/GYM-NEXT-6/
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-6-PREPARED.md
          if-no-files-found: error
          retention-days: 30

      - name: STEP summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-6 PREPARED"
            echo ""
            echo "- Supabase change: false"
            echo "- Runtime UI changed: false"
            echo "- Worker package: ready"
            echo "- Required Secret: STAFF_TOKEN"
            echo "- Recommended demo staff code: 5678"
            echo "- Next request: STEP GYM-NEXT-6-VERIFY"
          } >> "$GITHUB_STEP_SUMMARY"
