name: STEP GYM-NEXT-4-VERIFY - Session Records UI Completion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-4-VERIFY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-4-verify-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-4-VERIFY
  CURRENT_STEP_REQUIRED: GYM-NEXT-4-PREPARED
  NEXT_STEP: GYM-NEXT-5
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-4-VERIFY.yml
  LEDGER_FILE: dpro-next/gym/next-ledger.yml
  STEP_DIR: dpro-next/gym/steps
  BACKUP_TAG: backup-gym-before-next-4-verify-20260725
  PUBLIC_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  WORKER_BASE: https://dpro-gym-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: GYM-NEXT-4-WORKER-20260725
  PATCH_SCRIPT_B64: ""

jobs:
  verify-and-complete:
    name: Verify SQL and Worker then add session record UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm prepared state and safe upload
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LEDGER_FILE}"
          test -f "${WORKFLOW_FILE}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP_IN_LEDGER="$(
            sed -n 's/^next_step:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' "${LEDGER_FILE}" |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "${CURRENT_STEP_REQUIRED}" ]] || {
            echo "::error::Expected ${CURRENT_STEP_REQUIRED}, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP_IN_LEDGER}" == "${STEP_NAME}" ]] || {
            echo "::error::Expected next_step ${STEP_NAME}, got ${NEXT_STEP_IN_LEDGER}"
            exit 1
          }
          [[ "${RESULT}" == "PREPARED" ]] || {
            echo "::error::Prepared result is not PREPARED."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if [[ -n "${UNEXPECTED}" ]]; then
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            fi
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT}"
          while git rev-parse "${STEP_BASE_SHA}^" >/dev/null 2>&1; do
            if ! git cat-file -e "${STEP_BASE_SHA}:${WORKFLOW_FILE}" 2>/dev/null; then
              break
            fi
            CHANGED="$(
              git diff --name-only "${STEP_BASE_SHA}^" "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            OTHER="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            if printf '%s\n' "${CHANGED}" |
                 grep -F -x -q "${WORKFLOW_FILE}" &&
               [[ -z "${OTHER}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect pre-VERIFY version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}"               -m "DPRO パーソナルジム LINE before GYM-NEXT-4-VERIFY"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected UI baselines and config
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "${file}"
            actual="$(git hash-object "${file}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::${file} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            fi
          }

          check_blob config.js 94619ddc2fd2dd43b6d3cb99ba2349eef9d1f705
          check_blob dashboard.html 83485110de3f2964897f2d6f6804abb53853bb21
          check_blob owner-ipad.html 2e61368938b6f3f55dd84c9012ea2bc8c94401e9

          grep -Fq             "workerBaseUrl: 'https://dpro-gym-line-api.dpromstk2000.workers.dev'"             config.js

      - name: Verify deployed Worker and Supabase NEXT-4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-4-verify

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-4-verify/health.json             "${WORKER_BASE}/api/health?verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-4-verify/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          assert data.get("version") == "GYM-NEXT-4-WORKER-20260725", data
          assert data.get("database", {}).get("ok") is True, data

          next4 = data.get("next4", {})
          assert next4.get("ok") is True, data
          assert next4.get("session_records") is True, data
          assert next4.get("completion_guard") is True, data
          assert next4.get("ticket_completion_unique_guard") is True, data
          assert next4.get("duplicate_completion_count") == 0, data

          features = data.get("features", {})
          assert features.get("session_records") is True, data
          assert features.get("atomic_session_completion") is True, data
          assert features.get("ticket_completion_unique_guard") is True, data
          PY

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             -H "X-Admin-Key: 1234"             --output /tmp/gym-next-4-verify/system-check.json             "${WORKER_BASE}/api/admin/next-4-system-check?facility_code=dpro_gym_demo&verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-4-verify/system-check.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True, data
          result = data.get("result", {})
          assert result.get("duplicate_completion_count") == 0, data
          PY

      - name: Apply NEXT-4 PC and iPad session UI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${PATCH_SCRIPT_B64}" |
            base64 --decode > /tmp/gym-next-4-verify/apply_patch.py
          python3 -m py_compile /tmp/gym-next-4-verify/apply_patch.py
          python3 /tmp/gym-next-4-verify/apply_patch.py

      - name: Validate HTML JavaScript IDs and feature contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-4-verify/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          report = {}
          for filename in ("dashboard.html", "owner-ipad.html"):
              text = Path(filename).read_text(encoding="utf-8")
              parser = IdParser()
              parser.feed(text)
              duplicates = sorted({
                  item for item in parser.ids
                  if parser.ids.count(item) > 1
              })
              if duplicates:
                  raise SystemExit(
                      f"Duplicate IDs in {filename}: {duplicates}"
                  )

              scripts = re.findall(
                  r"<script(?:\s[^>]*)?>(.*?)</script>",
                  text,
                  flags=re.I | re.S,
              )
              inline_scripts = [
                  script for script in scripts
                  if script.strip()
              ]
              for index, script in enumerate(inline_scripts, 1):
                  output = Path(
                      f"/tmp/gym-next-4-verify/scripts/"
                      f"{Path(filename).stem}-{index}.js"
                  )
                  output.write_text(script, encoding="utf-8")

              report[filename] = {
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicates,
                  "inline_script_count": len(inline_scripts),
              }

          Path("/tmp/gym-next-4-verify/html-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          find /tmp/gym-next-4-verify/scripts -type f -name '*.js' -print0 |
            while IFS= read -r -d '' script; do
              node --check "${script}"
            done

          grep -Fq 'data-dpro-next-step="GYM-NEXT-4"' dashboard.html
          grep -Fq 'data-dpro-next-step="GYM-NEXT-4"' owner-ipad.html
          grep -Fq 'id="sessionModal"' dashboard.html
          grep -Fq 'id="sessionModal"' owner-ipad.html
          grep -Fq '/api/admin/sessions/complete' dashboard.html
          grep -Fq '/api/admin/sessions/complete' owner-ipad.html
          grep -Fq '/api/admin/session-records/upsert' dashboard.html
          grep -Fq '/api/admin/session-records/upsert' owner-ipad.html
          grep -Fq 'customerSessionHistory' dashboard.html
          grep -Fq 'customerTicketLedger' dashboard.html

          for marker in             '/api/admin/dashboard'             '/api/admin/customers'             '/api/admin/customers/tickets'             '/api/admin/reservations/status'             '/api/admin/inquiries'             '/api/admin/settings'             '/api/admin/demo-prepare'
          do
            grep -Fq "${marker}" dashboard.html
          done

          for marker in             '/api/admin/dashboard'             '/api/admin/customers'             '/api/admin/customers/tickets'             '/api/admin/reservations/status'             '/api/admin/inquiries'             '/api/admin/demo-prepare'
          do
            grep -Fq "${marker}" owner-ipad.html
          done

      - name: Confirm only intended application files changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only |
              sed '/^$/d' |
              sort
          )
          EXPECTED=(
            "dashboard.html"
            "owner-ipad.html"
          )
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          if [[ "$(printf '%s\n' "${CHANGED[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]]; then
            echo "::error::Unexpected application files changed."
            printf 'Changed:\n%s\n' "${CHANGED[*]}"
            exit 1
          fi

          git diff --quiet -- config.js || {
            echo "::error::config.js must remain unchanged."
            exit 1
          }
          git diff --check

      - name: Commit NEXT-4 UI
        shell: bash
        run: |
          set -euo pipefail
          git add dashboard.html owner-ipad.html
          git commit -m "Complete GYM-NEXT-4 session record UI"
          APPLICATION_COMMIT_SHA="$(git rev-parse HEAD)"
          DASHBOARD_BLOB="$(git hash-object dashboard.html)"
          IPAD_BLOB="$(git hash-object owner-ipad.html)"

          echo "APPLICATION_COMMIT_SHA=${APPLICATION_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "DASHBOARD_BLOB=${DASHBOARD_BLOB}" >> "$GITHUB_ENV"
          echo "IPAD_BLOB=${IPAD_BLOB}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify published UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-4-verify/public

          verify_page() {
            local page="$1"
            local marker1="$2"
            local marker2="$3"
            local file="/tmp/gym-next-4-verify/public/${page}"

            for attempt in $(seq 1 24); do
              curl --fail --location --silent --show-error                 --max-time 30                 --output "${file}"                 "${PUBLIC_BASE}/${page}?verify=${GITHUB_RUN_ID}-${attempt}" || true

              if [[ -s "${file}" ]] &&
                 grep -Fq "${marker1}" "${file}" &&
                 grep -Fq "${marker2}" "${file}"; then
                return 0
              fi

              sleep 10
            done

            echo "::error::Published page did not reach NEXT-4: ${page}"
            exit 1
          }

          verify_page             dashboard.html             'data-dpro-next-step="GYM-NEXT-4"'             '/api/admin/sessions/complete'

          verify_page             owner-ipad.html             'data-dpro-next-step="GYM-NEXT-4"'             '/api/admin/sessions/complete'

          curl --fail --location --silent --show-error             --retry 3 --retry-delay 2 --max-time 30             --output /tmp/gym-next-4-verify/public/health.json             "${WORKER_BASE}/api/health?public_verify=${GITHUB_RUN_ID}"

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/gym-next-4-verify/public/health.json")
              .read_text(encoding="utf-8")
          )
          assert data.get("ok") is True
          assert data.get("version") == "GYM-NEXT-4-WORKER-20260725"
          assert data.get("next4", {}).get("ok") is True
          PY

      - name: Record GYM-NEXT-4 completion
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > "${STEP_DIR}/GYM-NEXT-4-COMPLETE.md" <<EOF
          # DPRO パーソナルジム LINE｜GYM-NEXT-4 COMPLETE

          - 結果: OK
          - Worker: ${EXPECTED_WORKER_VERSION}
          - Supabase NEXT-4: OK
          - PCセッション記録UI: OK
          - iPadセッション記録UI: OK
          - 回数券完了減算一意ガード: OK
          - 重複完了: 0件
          - バックアップタグ: ${BACKUP_TAG}
          - アプリケーションコミット: ${APPLICATION_COMMIT_SHA}
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          cat > "${LEDGER_FILE}" <<EOF
          system_name: "DPRO パーソナルジム LINE"
          repository: "${GITHUB_REPOSITORY}"
          branch: "main"
          current_step: "GYM-NEXT-4-COMPLETE"
          workflow_revision: "R1"
          next_step: "${NEXT_STEP}"
          result: "OK"
          facility_code: "dpro_gym_demo"
          slot_minutes: 30
          step_backup_tag: "${BACKUP_TAG}"
          step_backup_sha: "${STEP_BASE_SHA}"
          application_commit_sha: "${APPLICATION_COMMIT_SHA}"
          dashboard_blob: "${DASHBOARD_BLOB}"
          owner_ipad_blob: "${IPAD_BLOB}"
          completed_at: "${COMPLETED_AT}"
          workflow_run_url: "${RUN_URL}"
          worker_name: "dpro-gym-line-api"
          worker_url: "${WORKER_BASE}"
          worker_version: "${EXPECTED_WORKER_VERSION}"
          worker_deployed: true
          supabase_executed: true
          runtime_files_changed: true
          worker_changed: true
          supabase_changed: true
          api_changed: true
          changed_files:
            - "dashboard.html"
            - "owner-ipad.html"
          checks:
            previous_step: "OK"
            backup_tag: "OK"
            worker_health: "OK"
            supabase_next4: "OK"
            duplicate_completion_count: 0
            config_worker_url: "OK"
            html_structure: "OK"
            javascript_syntax: "OK"
            duplicate_html_ids: "OK"
            existing_api_references: "OK"
            pc_session_ui: "OK"
            ipad_session_ui: "OK"
            public_pages: "OK"
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${LEDGER_FILE}', aliases: true)"
          git add "${LEDGER_FILE}" "${STEP_DIR}"
          git rm "${WORKFLOW_FILE}"
          git commit -m "Record GYM-NEXT-4 completion"
          git push origin HEAD:main

      - name: Upload NEXT-4 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-4-completion
          path: |
            dpro-next/gym/next-ledger.yml
            dpro-next/gym/steps/GYM-NEXT-4-COMPLETE.md
            /tmp/gym-next-4-verify/health.json
            /tmp/gym-next-4-verify/system-check.json
            /tmp/gym-next-4-verify/html-report.json
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-4 COMPLETE"
            echo ""
            echo "- Worker: \`${EXPECTED_WORKER_VERSION}\`"
            echo "- Supabase NEXT-4: \`OK\`"
            echo "- PC session UI: \`OK\`"
            echo "- iPad session UI: \`OK\`"
            echo "- Duplicate completion count: \`0\`"
            echo "- Next STEP: \`${NEXT_STEP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
