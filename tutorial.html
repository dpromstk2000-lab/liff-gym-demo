<!doctype html>
<html lang="ja" data-tutorial-version="GYM-R3-V1.1-20260828"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>DPRO GYM｜First10 Tutorial</title><link rel="stylesheet" href="tutorial.css?v=20260828"><script src="tutorial-data.js?v=20260828"></script></head>
<body>
<div class="dt-shell"><header class="dt-top"><div><strong>DPRO GYM First10 Tutorial</strong><br><span>STANDARD V1.1 / business mutation 0</span></div><span id="topStatus">10ステップ</span></header><main class="dt-stage"><iframe id="tutorialFrame" class="dt-frame" title="DPRO GYM 実画面"></iframe></main></div>
<section id="tutorialCard" class="dt-card" role="dialog" aria-modal="false" aria-labelledby="tutorialTitle">
  <div id="dragHandle" class="dt-handle" tabindex="0" aria-label="チュートリアルカード移動ハンドル"><b>つかんで移動</b><span class="dt-grip" aria-hidden="true">⋮⋮</span><button id="closeButton" class="dt-close" type="button" aria-label="チュートリアルを閉じる">×</button></div>
  <div class="dt-content"><p id="kicker" class="dt-kicker"></p><h1 id="tutorialTitle" class="dt-title" tabindex="-1"></h1><p id="guidance" class="dt-copy"></p><div id="safety" class="dt-safety"></div><div id="targetStatus" class="dt-target-status" aria-live="polite"></div>
  <div id="normalActions" class="dt-actions"><button id="backButton" class="dt-back" type="button">戻る</button><button id="nextButton" class="dt-next" type="button">次へ</button><button id="skipButton" class="dt-skip" type="button">スキップ</button></div>
  <div id="completeArea" class="dt-complete" hidden><strong>First10 完了</strong><p>業務データを変更せず、10ステップの確認が完了しました。</p><div class="dt-complete-actions"><button id="replayButton" class="dt-replay" type="button">Replay</button><button id="exitButton" class="dt-exit" type="button">閉じる</button></div></div>
  <div class="dt-footer"><button id="resumeButton" type="button">Resume</button><button id="restartButton" type="button">最初から</button></div></div>
</section>
<div id="launcher" class="dt-launcher" hidden><button id="launcherResume" type="button">Tutorialを再開</button></div>
<script>
(() => {
'use strict';
const DATA=window.DPRO_GYM_TUTORIAL_DATA,STORAGE=DATA.storageKey,steps=DATA.steps,frame=document.getElementById('tutorialFrame'),card=document.getElementById('tutorialCard');
let stepIndex=0,drag=null,targetEl=null,lastFrameRoute='';
const $=id=>document.getElementById(id);
function safeState(){try{const raw=localStorage.getItem(STORAGE);if(!raw)return null;const value=JSON.parse(raw);if(value.system!=='GYM'||value.standard!=='V1.1'||value.step<1||value.step>10)return null;return value}catch(_){return null}}
function writeState(extra={}){const old=safeState()||{};const rect=card.getBoundingClientRect();const value={...old,system:'GYM',standard:'V1.1',step:stepIndex+1,route:steps[stepIndex].route,timestamp:new Date().toISOString(),position:{left:Math.round(rect.left),top:Math.round(rect.top)},...extra};localStorage.setItem(STORAGE,JSON.stringify(value));return value}
function applyStoredPosition(){const s=safeState();if(!s?.position)return;card.style.left=`${Number(s.position.left)||8}px`;card.style.top=`${Number(s.position.top)||55}px`;clampCard()}
function routeBase(route){return String(route).split('?')[0]}
function currentFrameBase(){try{return frame.contentWindow.location.pathname.split('/').pop()||'index.html'}catch(_){return ''}}
function setFrameRoute(step,force=false){const desired=step.route;if(!force&&lastFrameRoute===desired&&routeBase(desired)===currentFrameBase())return Promise.resolve();lastFrameRoute=desired;return new Promise(resolve=>{const done=()=>{frame.removeEventListener('load',done);resolve()};frame.addEventListener('load',done,{once:true});frame.src=desired})}
function clearTarget(){if(!targetEl)return;try{targetEl.style.outline=targetEl.dataset.dtOldOutline||'';targetEl.style.outlineOffset=targetEl.dataset.dtOldOffset||'';targetEl.removeAttribute('data-dt-target');delete targetEl.dataset.dtOldOutline;delete targetEl.dataset.dtOldOffset}catch(_){}targetEl=null}
async function prepareStep(step){if(step.step===3){try{const d=frame.contentDocument,el=d?.querySelector('#trainerList');if(el&&!isUsable(el)){if(!el.dataset.dtTutorialMinHeight)el.dataset.dtTutorialMinHeight=el.style.minHeight||'__EMPTY__';el.style.minHeight='36px'}}catch(_){}}if(step.prepare==='booking-step-2'){try{const d=frame.contentDocument;if(!d)return;d.querySelectorAll('.step').forEach(el=>el.classList.toggle('active',el.getAttribute('data-step')==='2'));d.querySelectorAll('[data-progress]').forEach(el=>{const n=Number(el.getAttribute('data-progress'));el.classList.toggle('active',n===2);el.classList.toggle('done',n<2)})}catch(_){}}}
async function findTarget(step,attempts=50){for(let i=0;i<attempts;i++){await new Promise(r=>setTimeout(r,i?120:20));let doc;try{doc=frame.contentDocument}catch(_){continue}if(!doc)continue;let el=doc.querySelector(step.target);let used='primary';if(!el||!isUsable(el)){el=doc.querySelector(step.fallback);used='fallback'}if(el&&isUsable(el))return{el,used}}return null}
function isUsable(el){const r=el.getBoundingClientRect(),s=el.ownerDocument.defaultView.getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}
function highlight(found){clearTarget();if(!found)return;targetEl=found.el;targetEl.dataset.dtOldOutline=targetEl.style.outline||'';targetEl.dataset.dtOldOffset=targetEl.style.outlineOffset||'';targetEl.style.outline='4px solid #f5c244';targetEl.style.outlineOffset='4px';targetEl.setAttribute('data-dt-target','1');try{targetEl.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'})}catch(_){targetEl.scrollIntoView()}}
async function renderStep({forceRoute=false}={}){clearTarget();const step=steps[stepIndex];$('completeArea').hidden=true;$('normalActions').hidden=false;$('kicker').textContent=`FIRST10 ${String(step.step).padStart(2,'0')} / 10`;$('tutorialTitle').textContent=step.title;$('guidance').textContent=step.guidance;$('safety').textContent=`安全条件：${step.safety}`;$('topStatus').textContent=`${step.step} / 10`;$('backButton').disabled=stepIndex===0;$('nextButton').textContent=stepIndex===steps.length-1?'完了':'次へ';$('tutorialTitle').focus({preventScroll:true});writeState();await setFrameRoute(step,forceRoute);await new Promise(r=>setTimeout(r,250));await prepareStep(step);const found=await findTarget(step);highlight(found);$('targetStatus').textContent=found?`対象を確認：${found.used==='primary'?'primary':'safe fallback'} selector`:'対象をまだ確認できません。Resumeで再確認できます。';$('tutorialTitle').focus({preventScroll:true});requestAnimationFrame(clampCard)}
function complete(){clearTarget();writeState({completed:true});$('normalActions').hidden=true;$('completeArea').hidden=false;$('kicker').textContent='FIRST10 COMPLETE';$('tutorialTitle').textContent='10ステップ完了';$('guidance').textContent='予約・回数券・受付・セッション・継続管理の流れを確認しました。';$('safety').textContent='Tutorial起因の業務データ変更は行いません。';$('targetStatus').textContent='ReplayでStep 1から再確認できます。';$('replayButton').focus()}
function next(){if(stepIndex===steps.length-1){complete();return}stepIndex++;renderStep({forceRoute:steps[stepIndex].route!==steps[stepIndex-1].route})}
function back(){if(stepIndex===0)return;stepIndex--;renderStep({forceRoute:steps[stepIndex].route!==steps[stepIndex+1].route})}
function replay(){localStorage.removeItem(STORAGE);stepIndex=0;card.hidden=false;$('launcher').hidden=true;card.style.left='18px';card.style.top='72px';renderStep({forceRoute:true})}
function resume(){const s=safeState();stepIndex=Math.max(0,Math.min(9,(s?.step||1)-1));card.hidden=false;$('launcher').hidden=true;renderStep({forceRoute:true}).then(applyStoredPosition)}
function closeTutorial(){writeState();card.hidden=true;$('launcher').hidden=false;$('launcherResume').focus()}
function skip(){writeState({skipped:true,completed:true});complete()}
function clampCard(){if(card.hidden)return;const r=card.getBoundingClientRect(),g=8,maxL=Math.max(g,window.innerWidth-r.width-g),maxT=Math.max(g,window.innerHeight-r.height-g);let l=Math.min(maxL,Math.max(g,r.left)),t=Math.min(maxT,Math.max(g,r.top));card.style.left=`${Math.round(l)}px`;card.style.top=`${Math.round(t)}px`}
function pointerDown(e){if(e.button!==undefined&&e.button!==0)return;if(e.target.closest('button,a,input,select,textarea'))return;const r=card.getBoundingClientRect();drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,left:r.left,top:r.top};try{e.currentTarget.setPointerCapture?.(e.pointerId)}catch(_){}e.preventDefault()}
function pointerMove(e){if(!drag||drag.id!==e.pointerId)return;card.style.left=`${drag.left+e.clientX-drag.startX}px`;card.style.top=`${drag.top+e.clientY-drag.startY}px`;clampCard();e.preventDefault()}
function pointerUp(e){if(!drag||drag.id!==e.pointerId)return;drag=null;writeState()}
$('dragHandle').addEventListener('pointerdown',pointerDown);$('dragHandle').addEventListener('pointermove',pointerMove);$('dragHandle').addEventListener('pointerup',pointerUp);$('dragHandle').addEventListener('pointercancel',pointerUp);
$('nextButton').addEventListener('click',next);$('backButton').addEventListener('click',back);$('closeButton').addEventListener('click',closeTutorial);$('skipButton').addEventListener('click',skip);$('resumeButton').addEventListener('click',resume);$('restartButton').addEventListener('click',replay);$('replayButton').addEventListener('click',replay);$('exitButton').addEventListener('click',closeTutorial);$('launcherResume').addEventListener('click',resume);
window.addEventListener('resize',clampCard);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!card.hidden){e.preventDefault();closeTutorial()}});
window.DPRO_GYM_TUTORIAL={data:DATA,get step(){return stepIndex+1},next,back,resume,replay,close:closeTutorial,skip,clampCard,async testGoToStep(n){stepIndex=Math.max(0,Math.min(9,Number(n)-1));await renderStep({forceRoute:true});return stepIndex+1},getTarget(){return targetEl},state:safeState};
const initial=safeState();stepIndex=Math.max(0,Math.min(9,(initial?.step||1)-1));renderStep({forceRoute:true}).then(applyStoredPosition);
})();
</script></body></html>
